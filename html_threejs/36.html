
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js - GLTFLoader + Dispersion</title>
    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            color: white;
            line-height: 1.6;
            pointer-events: none;
        }

        #info a {
            color: #08f;
            text-decoration: none;
            pointer-events: auto;
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 20px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            z-index: 20;
            text-align: center;
            max-width: 90%;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="info">
        <a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>
        - GLTFLoader +
        <a href="https://github.com/KhronosGroup/glTF/tree/main/extensions/2.0/Khronos/KHR_materials_dispersion"
           target="_blank" rel="noopener">
            KHR_materials_dispersion
        </a>
    </div>

    <div id="status">Loading dispersion model...</div>
    <div id="container"></div>

    <script type="module">

        import * as THREE from 'three';

        import { OrbitControls } from
            'three/addons/controls/OrbitControls.js';

        import { GLTFLoader } from
            'three/addons/loaders/GLTFLoader.js';

        import { RoomEnvironment } from
            'three/addons/environments/RoomEnvironment.js';

        // --------------------------------------------------
        // VARIABLES
        // --------------------------------------------------

        let camera;
        let scene;
        let renderer;
        let controls;
        let pmremGenerator;

        const container = document.getElementById('container');
        const status = document.getElementById('status');

        const MODEL_URL =
            'https://threejs.org/examples/models/gltf/DispersionTest.glb';

        // --------------------------------------------------
        // INITIALIZATION
        // --------------------------------------------------

        async function init() {

            // Camera
            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.01,
                5
            );

            camera.position.set(0.1, 0.05, 0.15);

            // Scene
            scene = new THREE.Scene();

            // Renderer
            renderer = new THREE.WebGLRenderer({
                antialias: true
            });

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 1.5)
            );

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.toneMapping = THREE.NeutralToneMapping;
            renderer.toneMappingExposure = 1;

            renderer.outputColorSpace = THREE.SRGBColorSpace;

            container.appendChild(renderer.domElement);

            // --------------------------------------------------
            // ENVIRONMENT
            // --------------------------------------------------

            const environment = new RoomEnvironment();

            pmremGenerator = new THREE.PMREMGenerator(renderer);

            const envRenderTarget = pmremGenerator.fromScene(
                environment,
                0.04
            );

            const envTexture = envRenderTarget.texture;

            scene.background = envTexture;
            scene.environment = envTexture;

            scene.backgroundBlurriness = 0.5;

            // RoomEnvironment is no longer needed after PMREM.
            environment.dispose();

            // --------------------------------------------------
            // LOAD GLTF MODEL
            // --------------------------------------------------

            const loader = new GLTFLoader();

            loader.load(
                MODEL_URL,

                function (gltf) {

                    scene.add(gltf.scene);

                    // --------------------------------------------------
                    // CONTROLS
                    // --------------------------------------------------

                    controls = new OrbitControls(
                        camera,
                        renderer.domElement
                    );

                    controls.minDistance = 0.1;
                    controls.maxDistance = 10;

                    controls.target.set(0, 0, 0);

                    controls.addEventListener('change', render);

                    controls.update();

                    status.style.display = 'none';

                    // Initial render
                    render();

                },

                function (xhr) {

                    if (xhr.total > 0) {

                        const progress = (
                            xhr.loaded / xhr.total
                        ) * 100;

                        status.textContent =
                            `Loading model: ${progress.toFixed(1)}%`;

                    } else {

                        status.textContent =
                            `Loading model: ${(xhr.loaded / 1024).toFixed(1)} KB`;

                    }

                },

                function (error) {

                    console.error('GLTF loading error:', error);

                    status.textContent =
                        'Unable to load DispersionTest.glb. Check the model URL and network connection.';

                    status.style.color = '#ff7777';

                }
            );

            window.addEventListener('resize', onWindowResize);

        }

        // --------------------------------------------------
        // RENDER
        // --------------------------------------------------

        function render() {

            if (!renderer || !scene || !camera) return;

            renderer.render(scene, camera);

        }

        // --------------------------------------------------
        // RESIZE
        // --------------------------------------------------

        function onWindowResize() {

            if (!camera || !renderer) return;

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            render();

        }

        // --------------------------------------------------
        // CLEANUP
        // --------------------------------------------------

        function cleanup() {

            window.removeEventListener('resize', onWindowResize);

            if (controls) {
                controls.dispose();
            }

            if (scene) {

                scene.traverse(object => {

                    if (object.geometry) {
                        object.geometry.dispose();
                    }

                    if (object.material) {

                        const materials = Array.isArray(object.material)
                            ? object.material
                            : [object.material];

                        materials.forEach(material => {

                            for (const key in material) {

                                const value = material[key];

                                if (value && value.isTexture) {
                                    value.dispose();
                                }

                            }

                            material.dispose();

                        });
                    }

                });
            }

            if (pmremGenerator) {
                pmremGenerator.dispose();
            }

            if (renderer) {
                renderer.dispose();
            }
        }

        window.addEventListener('pagehide', cleanup, { once: true });

        // --------------------------------------------------
        // START
        // --------------------------------------------------

        init().catch(error => {

            console.error('Initialization error:', error);

            status.textContent = error.message;
            status.style.color = '#ff7777';

        });

    </script>

</body>
</html>
