
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Three.js - ShadowMapViewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            color: white;
            font-size: 13px;
            line-height: 1.6;
        }

        #info a {
            color: white;
        }

        canvas {
            display: block;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="info">
    <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
    - ShadowMapViewer example
    <br>
    Left mouse: Rotate | Right mouse: Pan | Wheel: Zoom
    <br>
    Top-left panels: Directional and Spot Light shadow maps
</div>

<script type="module">

import * as THREE from 'three';

import Stats from 'three/addons/libs/stats.module.js';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { ShadowMapViewer } from 'three/addons/utils/ShadowMapViewer.js';

// --------------------------------------------------
// GLOBAL VARIABLES
// --------------------------------------------------

let camera;
let scene;
let renderer;
let timer;
let stats;
let controls;

let dirLight;
let spotLight;

let torusKnot;
let cube;

let dirLightShadowMapViewer;
let spotLightShadowMapViewer;

// --------------------------------------------------
// INITIALIZATION
// --------------------------------------------------

init();

function init() {

    initScene();

    // Renderer must exist before rendering shadow-map viewers.

    initRenderer();

    initShadowMapViewers();

    initControls();

    initMisc();

    document.body.appendChild(renderer.domElement);

    window.addEventListener('resize', onWindowResize);

    renderer.setAnimationLoop(animate);

}

// --------------------------------------------------
// SCENE
// --------------------------------------------------

function initScene() {

    // CAMERA

    camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        1,
        1000
    );

    camera.position.set(0, 15, 35);

    // SCENE

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);

    // AMBIENT LIGHT

    scene.add(
        new THREE.AmbientLight(0x404040, 3)
    );

    // --------------------------------------------------
    // SPOT LIGHT
    // --------------------------------------------------

    spotLight = new THREE.SpotLight(0xffffff, 500);

    spotLight.name = 'Spot Light';

    spotLight.angle = Math.PI / 5;

    spotLight.penumbra = 0.3;

    spotLight.position.set(10, 10, 5);

    spotLight.castShadow = true;

    spotLight.shadow.camera.near = 8;

    spotLight.shadow.camera.far = 30;

    spotLight.shadow.mapSize.set(1024, 1024);

    scene.add(spotLight);

    const spotCameraHelper = new THREE.CameraHelper(
        spotLight.shadow.camera
    );

    scene.add(spotCameraHelper);

    // --------------------------------------------------
    // DIRECTIONAL LIGHT
    // --------------------------------------------------

    dirLight = new THREE.DirectionalLight(0xffffff, 3);

    dirLight.name = 'Dir. Light';

    dirLight.position.set(0, 10, 0);

    dirLight.castShadow = true;

    dirLight.shadow.camera.near = 1;

    dirLight.shadow.camera.far = 10;

    dirLight.shadow.camera.right = 15;

    dirLight.shadow.camera.left = -15;

    dirLight.shadow.camera.top = 15;

    dirLight.shadow.camera.bottom = -15;

    dirLight.shadow.mapSize.set(1024, 1024);

    scene.add(dirLight);

    const dirCameraHelper = new THREE.CameraHelper(
        dirLight.shadow.camera
    );

    scene.add(dirCameraHelper);

    // --------------------------------------------------
    // TORUS KNOT
    // --------------------------------------------------

    let geometry = new THREE.TorusKnotGeometry(
        25,
        8,
        75,
        20
    );

    const redMaterial = new THREE.MeshPhongMaterial({

        color: 0xff0000,

        shininess: 150,

        specular: 0x222222

    });

    torusKnot = new THREE.Mesh(
        geometry,
        redMaterial
    );

    torusKnot.scale.multiplyScalar(1 / 18);

    torusKnot.position.y = 3;

    torusKnot.castShadow = true;

    torusKnot.receiveShadow = true;

    scene.add(torusKnot);

    // --------------------------------------------------
    // CUBE
    // --------------------------------------------------

    geometry = new THREE.BoxGeometry(3, 3, 3);

    cube = new THREE.Mesh(
        geometry,
        redMaterial
    );

    cube.position.set(8, 3, 8);

    cube.castShadow = true;

    cube.receiveShadow = true;

    scene.add(cube);

    // --------------------------------------------------
    // GROUND
    // --------------------------------------------------

    geometry = new THREE.BoxGeometry(
        10,
        0.15,
        10
    );

    const groundMaterial = new THREE.MeshPhongMaterial({

        color: 0xa0adaf,

        shininess: 150,

        specular: 0x111111

    });

    const ground = new THREE.Mesh(
        geometry,
        groundMaterial
    );

    ground.scale.multiplyScalar(3);

    ground.castShadow = false;

    ground.receiveShadow = true;

    scene.add(ground);

}

// --------------------------------------------------
// RENDERER
// --------------------------------------------------

function initRenderer() {

    renderer = new THREE.WebGLRenderer({

        antialias: true

    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    // Keep the original example's shadow-map type.

    renderer.shadowMap.type = THREE.BasicShadowMap;

    renderer.outputColorSpace = THREE.SRGBColorSpace;

}

// --------------------------------------------------
// SHADOW MAP VIEWERS
// --------------------------------------------------

function initShadowMapViewers() {

    dirLightShadowMapViewer = new ShadowMapViewer(
        dirLight
    );

    spotLightShadowMapViewer = new ShadowMapViewer(
        spotLight
    );

    resizeShadowMapViewers();

}

// --------------------------------------------------
// ORBIT CONTROLS
// --------------------------------------------------

function initControls() {

    controls = new OrbitControls(
        camera,
        renderer.domElement
    );

    controls.target.set(0, 2, 0);

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.enableRotate = true;

    controls.enableZoom = true;

    controls.enablePan = true;

    controls.minDistance = 10;

    controls.maxDistance = 100;

    controls.update();

}

// --------------------------------------------------
// MISC
// --------------------------------------------------

function initMisc() {

    timer = new THREE.Timer();

    timer.connect(document);

    stats = new Stats();

    document.body.appendChild(stats.dom);

}

// --------------------------------------------------
// RESIZE SHADOW MAP VIEWERS
// --------------------------------------------------

function resizeShadowMapViewers() {

    const size = window.innerWidth * 0.15;

    // Directional light viewer

    dirLightShadowMapViewer.position.x = 10;

    dirLightShadowMapViewer.position.y = 10;

    dirLightShadowMapViewer.size.width = size;

    dirLightShadowMapViewer.size.height = size;

    dirLightShadowMapViewer.update();

    // Spotlight viewer

    spotLightShadowMapViewer.size.set(
        size,
        size
    );

    spotLightShadowMapViewer.position.set(
        size + 20,
        10
    );

}

// --------------------------------------------------
// WINDOW RESIZE
// --------------------------------------------------

function onWindowResize() {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    resizeShadowMapViewers();

    dirLightShadowMapViewer.updateForWindowResize();

    spotLightShadowMapViewer.updateForWindowResize();

}

// --------------------------------------------------
// ANIMATION
// --------------------------------------------------

function animate() {

    timer.update();

    const delta = timer.getDelta();

    // ROTATE TORUS KNOT

    torusKnot.rotation.x += 0.25 * delta;

    torusKnot.rotation.y += 2 * delta;

    torusKnot.rotation.z += 1 * delta;

    // ROTATE CUBE

    cube.rotation.x += 0.25 * delta;

    cube.rotation.y += 2 * delta;

    cube.rotation.z += 1 * delta;

    // UPDATE CONTROLS

    controls.update();

    // RENDER SCENE

    renderer.render(scene, camera);

    // RENDER SHADOW MAP VIEWERS

    dirLightShadowMapViewer.render(renderer);

    spotLightShadowMapViewer.render(renderer);

    // PERFORMANCE MONITOR

    stats.update();

}

// --------------------------------------------------
// CLEANUP
// --------------------------------------------------

window.addEventListener('pagehide', () => {

    renderer.setAnimationLoop(null);

    controls.dispose();

    timer.dispose();

});

</script>

</body>
</html>
