
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three.js WebGPU - Compute Cloth</title>

    <link rel="icon" href="data:,">

    <style>
        * {

        }

        body {

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
            "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
            "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.tsl.js",

</head>

<body>

    <div id="info">
        <div class="title">
            <a href="https://threejs.org/" target="_blank" rel="noopener">
                three.js
            </a>
            - Compute Cloth
        </div>

        <small>
            Simple cloth simulation with a Verlet system
            running in compute shaders.
        </small>
    </div>

    <div id="status">
        Checking WebGPU support...
    </div>

    <script type="module">

        import * as THREE from 'three/webgpu';

        import {
            Fn,
            If,
            Return,
            instancedArray,
            instanceIndex,
            uniform,
            select,
            attribute,
            Loop,
            float,
            transformNormalToView,
            cross,
            triNoise3D,
            time,
            EPSILON
        } from 'three/tsl';

        import { OrbitControls } from
            'three/addons/controls/OrbitControls.js';

        import { UltraHDRLoader } from
            'three/addons/loaders/UltraHDRLoader.js';

        import { GUI } from
            'three/addons/libs/lil-gui.module.min.js';


        // =====================================================
        // CONFIGURATION
        // =====================================================

        const BASE_URL = 'https://threejs.org/examples/';

        const HDR_URL =
            BASE_URL + 'textures/equirectangular/royal_esplanade_2k.hdr.jpg';


        // Cloth dimensions.

        const clothWidth = 1;
        const clothHeight = 1;

        const clothNumSegmentsX = 30;
        const clothNumSegmentsY = 30;

        const sphereRadius = 0.15;


        // =====================================================
        // VARIABLES
        // =====================================================

        let renderer;
        let scene;
        let camera;
        let controls;
        let gui;

        let vertexPositionBuffer;
        let vertexForceBuffer;
        let vertexParamsBuffer;

        let springVertexIdBuffer;
        let springRestLengthBuffer;
        let springForceBuffer;
        let springListBuffer;

        let computeSpringForces;
        let computeVertexForces;

        let dampeningUniform;
        let spherePositionUniform;
        let stiffnessUniform;
        let sphereUniform;
        let windUniform;

        let vertexWireframeObject;
        let springWireframeObject;

        let clothMesh;
        let clothMaterial;
        let sphere;

        let timeSinceLastStep = 0;
        let timestamp = 0;

        let animationStarted = false;

        const verletVertices = [];
        const verletSprings = [];
        const verletVertexColumns = [];

        const timer = new THREE.Timer();

        const params = {
            wireframe: false,
            sphere: true,
            wind: 1.0
        };

        const API = {
            color: 0x204080,
            sheenColor: 0xffffff
        };

        const statusElement =
            document.getElementById('status');


        // =====================================================
        // STATUS
        // =====================================================

        function showStatus(message) {

            statusElement.textContent = message;

            statusElement.classList.remove('hidden');

        }

        function hideStatus() {

            statusElement.classList.add('hidden');

        }


        // =====================================================
        // WEBGPU CHECK
        // =====================================================

        async function checkWebGPU() {

            if (!navigator.gpu) {

                throw new Error(
                    'WebGPU is not available. ' +
                    'Please use a browser and GPU with WebGPU support.'
                );

            }

            const adapter = await navigator.gpu.requestAdapter();

            if (!adapter) {

                throw new Error(
                    'No compatible WebGPU adapter was found.'
                );

            }

            return adapter;

        }


        // =====================================================
        // INITIALIZATION
        // =====================================================

        async function init() {

            showStatus('Checking WebGPU...');

            await checkWebGPU();


            // -------------------------------------------------
            // RENDERER
            // -------------------------------------------------

            renderer = new THREE.WebGPURenderer({

                antialias: true,

                requiredLimits: {
                    maxStorageBuffersInVertexStage: 1
                }

            });

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 1.5)
            );

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.toneMapping = THREE.NeutralToneMapping;

            renderer.toneMappingExposure = 1;

            document.body.appendChild(renderer.domElement);


            showStatus('Initializing WebGPU renderer...');

            await renderer.init();


            // -------------------------------------------------
            // SCENE
            // -------------------------------------------------

            scene = new THREE.Scene();


            // -------------------------------------------------
            // CAMERA
            // -------------------------------------------------

            camera = new THREE.PerspectiveCamera(

                40,

                window.innerWidth / window.innerHeight,

                0.01,

                10

            );

            camera.position.set(
                -1.6,
                -0.1,
                -1.6
            );


            // -------------------------------------------------
            // CONTROLS
            // -------------------------------------------------

            controls = new OrbitControls(

                camera,

                renderer.domElement

            );

            controls.minDistance = 1;

            controls.maxDistance = 3;

            controls.target.set(
                0,
                -0.1,
                0
            );

            controls.enableDamping = true;

            controls.update();


            // -------------------------------------------------
            // HDR ENVIRONMENT
            // -------------------------------------------------

            showStatus('Loading environment texture...');

            const hdrLoader = new UltraHDRLoader();

            const hdrTexture = await hdrLoader.loadAsync(HDR_URL);

            hdrTexture.mapping =
                THREE.EquirectangularReflectionMapping;

            scene.background = hdrTexture;

            scene.backgroundBlurriness = 0.5;

            scene.environment = hdrTexture;


            // -------------------------------------------------
            // CLOTH SIMULATION
            // -------------------------------------------------

            showStatus('Creating cloth simulation...');

            setupCloth();


            // -------------------------------------------------
            // GUI
            // -------------------------------------------------

            initGUI();


            // -------------------------------------------------
            // EVENTS
            // -------------------------------------------------

            window.addEventListener(
                'resize',
                onWindowResize
            );


            // -------------------------------------------------
            // TIMER
            // -------------------------------------------------

            timer.connect(document);

            // THREE.Timer does not require a start() call.


            // -------------------------------------------------
            // START RENDERING
            // -------------------------------------------------

            animationStarted = true;

            renderer.setAnimationLoop(render);

            hideStatus();

        }


        // =====================================================
        // VERLET GEOMETRY
        // =====================================================

        function setupVerletGeometry() {

            // Create a Verlet vertex.

            const addVerletVertex = (
                x,
                y,
                z,
                isFixed
            ) => {

                const id = verletVertices.length;

                const vertex = {

                    id,

                    position: new THREE.Vector3(x, y, z),

                    isFixed,

                    springIds: []

                };

                verletVertices.push(vertex);

                return vertex;

            };


            // Create a spring connecting two vertices.

            const addVerletSpring = (
                vertex0,
                vertex1
            ) => {

                const id = verletSprings.length;

                const spring = {

                    id,

                    vertex0,

                    vertex1

                };

                vertex0.springIds.push(id);

                vertex1.springIds.push(id);

                verletSprings.push(spring);

                return spring;

            };


            // Create cloth vertices.

            for (
                let x = 0;
                x <= clothNumSegmentsX;
                x++
            ) {

                const column = [];

                for (
                    let y = 0;
                    y <= clothNumSegmentsY;
                    y++
                ) {

                    const posX =
                        x * (clothWidth / clothNumSegmentsX)
                        - clothWidth * 0.5;

                    const posZ =
                        y * (clothHeight / clothNumSegmentsY);

                    // Fix selected vertices along the top edge.

                    const isFixed =
                        y === 0 && (x % 5) === 0;

                    const vertex = addVerletVertex(

                        posX,

                        clothHeight * 0.5,

                        posZ,

                        isFixed

                    );

                    column.push(vertex);

                }

                verletVertexColumns.push(column);

            }


            // Create springs.

            for (
                let x = 0;
                x <= clothNumSegmentsX;
                x++
            ) {

                for (
                    let y = 0;
                    y <= clothNumSegmentsY;
                    y++
                ) {

                    const vertex0 =
                        verletVertexColumns[x][y];

                    // Horizontal spring.

                    if (x > 0) {

                        addVerletSpring(
                            vertex0,
                            verletVertexColumns[x - 1][y]
                        );

                    }

                    // Vertical spring.

                    if (y > 0) {

                        addVerletSpring(
                            vertex0,
                            verletVertexColumns[x][y - 1]
                        );

                    }

                    // Diagonal spring.

                    if (x > 0 && y > 0) {

                        addVerletSpring(
                            vertex0,
                            verletVertexColumns[x - 1][y - 1]
                        );

                    }

                    // Opposite diagonal spring.

                    if (
                        x > 0 &&
                        y < clothNumSegmentsY
                    ) {

                        addVerletSpring(
                            vertex0,
                            verletVertexColumns[x - 1][y + 1]
                        );

                    }

                }

            }

        }


        // =====================================================
        // VERLET VERTEX BUFFERS
        // =====================================================

        function setupVerletVertexBuffers() {

            const vertexCount = verletVertices.length;

            const springListArray = [];

            const vertexPositionArray =
                new Float32Array(vertexCount * 3);

            const vertexParamsArray =
                new Uint32Array(vertexCount * 3);


            for (
                let i = 0;
                i < vertexCount;
                i++
            ) {

                const vertex = verletVertices[i];

                vertexPositionArray[i * 3] =
                    vertex.position.x;

                vertexPositionArray[i * 3 + 1] =
                    vertex.position.y;

                vertexPositionArray[i * 3 + 2] =
                    vertex.position.z;


                vertexParamsArray[i * 3] =
                    vertex.isFixed ? 1 : 0;


                if (!vertex.isFixed) {

                    vertexParamsArray[i * 3 + 1] =
                        vertex.springIds.length;

                    vertexParamsArray[i * 3 + 2] =
                        springListArray.length;

                    springListArray.push(
                        ...vertex.springIds
                    );

                }

            }


            vertexPositionBuffer = instancedArray(
                vertexPositionArray,
                'vec3'
            ).setPBO(true);


            vertexForceBuffer = instancedArray(
                vertexCount,
                'vec3'
            );


            vertexParamsBuffer = instancedArray(
                vertexParamsArray,
                'uvec3'
            );


            springListBuffer = instancedArray(
                new Uint32Array(springListArray),
                'uint'
            ).setPBO(true);

        }


        // =====================================================
        // VERLET SPRING BUFFERS
        // =====================================================

        function setupVerletSpringBuffers() {

            const springCount = verletSprings.length;

            const springVertexIdArray =
                new Uint32Array(springCount * 2);

            const springRestLengthArray =
                new Float32Array(springCount);


            for (
                let i = 0;
                i < springCount;
                i++
            ) {

                const spring = verletSprings[i];

                springVertexIdArray[i * 2] =
                    spring.vertex0.id;

                springVertexIdArray[i * 2 + 1] =
                    spring.vertex1.id;

                springRestLengthArray[i] =
                    spring.vertex0.position.distanceTo(
                        spring.vertex1.position
                    );

            }


            springVertexIdBuffer = instancedArray(
                springVertexIdArray,
                'uvec2'
            ).setPBO(true);


            springRestLengthBuffer = instancedArray(
                springRestLengthArray,
                'float'
            );


            springForceBuffer = instancedArray(
                springCount,
                'vec3'
            ).setPBO(true);

        }


        // =====================================================
        // UNIFORMS
        // =====================================================

        function setupUniforms() {

            dampeningUniform = uniform(0.99);

            spherePositionUniform = uniform(
                new THREE.Vector3(0, 0, 0)
            );

            sphereUniform = uniform(1.0);

            windUniform = uniform(1.0);

            stiffnessUniform = uniform(0.2);

        }


        // =====================================================
        // COMPUTE SHADERS
        // =====================================================

        function setupComputeShaders() {

            const vertexCount = verletVertices.length;

            const springCount = verletSprings.length;


            // -------------------------------------------------
            // COMPUTE SPRING FORCES
            // -------------------------------------------------

            computeSpringForces = Fn(() => {

                const vertexIds =
                    springVertexIdBuffer.element(
                        instanceIndex
                    );

                const restLength =
                    springRestLengthBuffer.element(
                        instanceIndex
                    );


                const vertex0Position =
                    vertexPositionBuffer.element(
                        vertexIds.x
                    );

                const vertex1Position =
                    vertexPositionBuffer.element(
                        vertexIds.y
                    );


                const delta = vertex1Position
                    .sub(vertex0Position)
                    .toVar();


                const dist = delta
                    .length()
                    .max(EPSILON)
                    .toVar();


                const force = dist

                    .sub(restLength)

                    .mul(stiffnessUniform)

                    .mul(delta)

                    .mul(0.5)

                    .div(dist);


                springForceBuffer
                    .element(instanceIndex)
                    .assign(force);

            })()

            .compute(springCount)

            .setName('Spring Forces');


            // -------------------------------------------------
            // COMPUTE VERTEX FORCES
            // -------------------------------------------------

            computeVertexForces = Fn(() => {

                const vertexParams =
                    vertexParamsBuffer
                        .element(instanceIndex)
                        .toVar();


                const isFixed = vertexParams.x;

                const connectedSpringCount = vertexParams.y;

                const springPointer = vertexParams.z;


                // Fixed vertices do not move.

                If(isFixed, () => {

                    Return();

                });


                const position =
                    vertexPositionBuffer
                        .element(instanceIndex)
                        .toVar('vertexPosition');


                const force =
                    vertexForceBuffer
                        .element(instanceIndex)
                        .toVar('vertexForce');


                // Damping.

                force.mulAssign(dampeningUniform);


                // Spring force accumulation.

                const ptrStart =
                    springPointer.toVar('ptrStart');

                const ptrEnd =
                    ptrStart
                        .add(connectedSpringCount)
                        .toVar('ptrEnd');


                Loop({

                    start: ptrStart,

                    end: ptrEnd,

                    type: 'uint',

                    condition: '<'

                }, ({ i }) => {

                    const springId =
                        springListBuffer
                            .element(i)
                            .toVar('springId');


                    const springForce =
                        springForceBuffer.element(springId);


                    const springVertexIds =
                        springVertexIdBuffer.element(springId);


                    const factor = select(

                        springVertexIds.x.equal(instanceIndex),

                        1.0,

                        -1.0

                    );


                    force.addAssign(
                        springForce.mul(factor)
                    );

                });


                // Gravity.

                force.y.subAssign(0.00005);


                // Wind.

                const noise = triNoise3D(

                    position,

                    1,

                    time

                )

                .sub(0.2)

                .mul(0.0001);


                const windForce =
                    noise.mul(windUniform);


                force.z.subAssign(windForce);


                // Sphere collision.

                const deltaSphere = position

                    .add(force)

                    .sub(spherePositionUniform);


                const dist = deltaSphere
                    .length()
                    .max(EPSILON);


                const sphereForce = float(sphereRadius)

                    .sub(dist)

                    .max(0)

                    .mul(deltaSphere)

                    .div(dist)

                    .mul(sphereUniform);


                force.addAssign(sphereForce);


                // Update force and position.

                vertexForceBuffer
                    .element(instanceIndex)
                    .assign(force);


                vertexPositionBuffer
                    .element(instanceIndex)
                    .addAssign(force);

            })()

            .compute(vertexCount)

            .setName('Vertex Forces');

        }


        // =====================================================
        // WIREFRAME VISUALIZATION
        // =====================================================

        function setupWireframe() {

            // -------------------------------------------------
            // VERTEX VISUALIZER
            // -------------------------------------------------

            const vertexWireframeMaterial =
                new THREE.SpriteNodeMaterial();

            vertexWireframeMaterial.positionNode =
                vertexPositionBuffer.element(instanceIndex);


            vertexWireframeObject = new THREE.Mesh(

                new THREE.PlaneGeometry(0.01, 0.01),

                vertexWireframeMaterial

            );

            vertexWireframeObject.frustumCulled = false;

            vertexWireframeObject.count =
                verletVertices.length;

            scene.add(vertexWireframeObject);


            // -------------------------------------------------
            // SPRING VISUALIZER
            // -------------------------------------------------

            const springWireframePositionBuffer =
                new THREE.BufferAttribute(
                    new Float32Array(6),
                    3,
                    false
                );


            const springWireframeIndexBuffer =
                new THREE.BufferAttribute(
                    new Uint32Array([0, 1]),
                    1,
                    false
                );


            const springWireframeMaterial =
                new THREE.LineBasicNodeMaterial();


            springWireframeMaterial.positionNode = Fn(() => {

                const vertexIds =
                    springVertexIdBuffer.element(instanceIndex);


                const vertexId = select(

                    attribute('vertexIndex').equal(0),

                    vertexIds.x,

                    vertexIds.y

                );


                return vertexPositionBuffer.element(vertexId);

            })();


            const springWireframeGeometry =
                new THREE.InstancedBufferGeometry();


            springWireframeGeometry.setAttribute(
                'position',
                springWireframePositionBuffer
            );


            springWireframeGeometry.setAttribute(
                'vertexIndex',
                springWireframeIndexBuffer
            );


            springWireframeGeometry.instanceCount =
                verletSprings.length;


            springWireframeObject = new THREE.Line(

                springWireframeGeometry,

                springWireframeMaterial

            );

            springWireframeObject.frustumCulled = false;

            springWireframeObject.count =
                verletSprings.length;

            scene.add(springWireframeObject);

        }


        // =====================================================
        // SPHERE
        // =====================================================

        function setupSphere() {

            const geometry = new THREE.IcosahedronGeometry(

                sphereRadius * 0.95,

                4

            );


            const material =
                new THREE.MeshStandardNodeMaterial();


            sphere = new THREE.Mesh(
                geometry,
                material
            );

            scene.add(sphere);

        }


        // =====================================================
        // CLOTH MESH
        // =====================================================

        function setupClothMesh() {

            const vertexCount =
                clothNumSegmentsX * clothNumSegmentsY;


            const geometry = new THREE.BufferGeometry();


            // Four Verlet vertex IDs contribute to each
            // rendered cloth vertex.

            const verletVertexIdArray =
                new Uint32Array(vertexCount * 4);


            const indices = [];


            const getIndex = (x, y) => {

                return y * clothNumSegmentsX + x;

            };


            // -------------------------------------------------
            // BUILD CLOTH VERTEX IDS
            // -------------------------------------------------

            for (
                let x = 0;
                x < clothNumSegmentsX;
                x++
            ) {

                for (
                    let y = 0;
                    y < clothNumSegmentsY;
                    y++
                ) {

                    const index = getIndex(x, y);


                    verletVertexIdArray[index * 4] =
                        verletVertexColumns[x][y].id;

                    verletVertexIdArray[index * 4 + 1] =
                        verletVertexColumns[x + 1][y].id;

                    verletVertexIdArray[index * 4 + 2] =
                        verletVertexColumns[x][y + 1].id;

                    verletVertexIdArray[index * 4 + 3] =
                        verletVertexColumns[x + 1][y + 1].id;


                    // Connect neighboring rendered cloth vertices.

                    if (
                        x > 0 &&
                        y > 0
                    ) {

                        indices.push(

                            getIndex(x, y),

                            getIndex(x - 1, y),

                            getIndex(x - 1, y - 1)

                        );


                        indices.push(

                            getIndex(x, y),

                            getIndex(x - 1, y - 1),

                            getIndex(x, y - 1)

                        );

                    }

                }

            }


            // -------------------------------------------------
            // GEOMETRY ATTRIBUTES
            // -------------------------------------------------

            const verletVertexIdBuffer =
                new THREE.BufferAttribute(
                    verletVertexIdArray,
                    4,
                    false
                );


            const positionBuffer =
                new THREE.BufferAttribute(
                    new Float32Array(vertexCount * 3),
                    3,
                    false
                );


            geometry.setAttribute(
                'position',
                positionBuffer
            );


            geometry.setAttribute(
                'vertexIds',
                verletVertexIdBuffer
            );


            geometry.setIndex(indices);


            // -------------------------------------------------
            // CLOTH MATERIAL
            // -------------------------------------------------

            clothMaterial =
                new THREE.MeshPhysicalNodeMaterial({

                    color: new THREE.Color().setHex(API.color),

                    side: THREE.DoubleSide,

                    transparent: true,

                    opacity: 0.85,

                    sheen: 1.0,

                    sheenRoughness: 0.5,

                    sheenColor:
                        new THREE.Color().setHex(API.sheenColor)

                });


            // -------------------------------------------------
            // POSITION NODE
            // -------------------------------------------------

            clothMaterial.positionNode = Fn(({ material }) => {

                const vertexIds = attribute('vertexIds');


                // Four Verlet positions.

                const v0 = vertexPositionBuffer
                    .element(vertexIds.x)
                    .toVar();

                const v1 = vertexPositionBuffer
                    .element(vertexIds.y)
                    .toVar();

                const v2 = vertexPositionBuffer
                    .element(vertexIds.z)
                    .toVar();

                const v3 = vertexPositionBuffer
                    .element(vertexIds.w)
                    .toVar();


                // Calculate tangents.

                const top = v0.add(v1);

                const right = v1.add(v3);

                const bottom = v2.add(v3);

                const left = v0.add(v2);


                const tangent = right
                    .sub(left)
                    .normalize();

                const bitangent = bottom
                    .sub(top)
                    .normalize();


                // Calculate normal.

                const normal = cross(
                    tangent,
                    bitangent
                );


                // Pass normal to fragment shader.

                material.normalNode =
                    transformNormalToView(normal).toVarying();


                // Center position of four Verlet vertices.

                return v0

                    .add(v1)

                    .add(v2)

                    .add(v3)

                    .mul(0.25);

            })();


            // -------------------------------------------------
            // CREATE CLOTH MESH
            // -------------------------------------------------

            clothMesh = new THREE.Mesh(
                geometry,
                clothMaterial
            );

            clothMesh.frustumCulled = false;

            scene.add(clothMesh);

        }


        // =====================================================
        // SETUP CLOTH
        // =====================================================

        function setupCloth() {

            setupVerletGeometry();

            setupVerletVertexBuffers();

            setupVerletSpringBuffers();

            setupUniforms();

            setupComputeShaders();

            setupWireframe();

            setupSphere();

            setupClothMesh();

        }


        // =====================================================
        // GUI
        // =====================================================

        function initGUI() {

            gui = new GUI();

            const folder = gui.addFolder('Settings');


            folder.add(

                stiffnessUniform,

                'value',

                0.1,

                0.5,

                0.01

            ).name('Stiffness');


            folder.add(
                params,
                'wireframe'
            ).name('Wireframe');


            folder.add(
                params,
                'sphere'
            ).name('Sphere');


            folder.add(

                params,

                'wind',

                0,

                5,

                0.1

            ).name('Wind');


            folder.open();


            // -------------------------------------------------
            // MATERIAL SETTINGS
            // -------------------------------------------------

            const materialFolder =
                gui.addFolder('Material');


            materialFolder.addColor(
                API,
                'color'
            )

            .name('Color')

            .onChange(color => {

                clothMaterial.color.setHex(color);

            });


            materialFolder.add(

                clothMaterial,

                'roughness',

                0,

                1,

                0.01

            );


            materialFolder.add(

                clothMaterial,

                'sheen',

                0,

                1,

                0.01

            );


            materialFolder.add(

                clothMaterial,

                'sheenRoughness',

                0,

                1,

                0.01

            );


            materialFolder.addColor(
                API,
                'sheenColor'
            )

            .name('Sheen color')

            .onChange(color => {

                clothMaterial.sheenColor.setHex(color);

            });


            materialFolder.open();

        }


        // =====================================================
        // WINDOW RESIZE
        // =====================================================

        function onWindowResize() {

            if (!camera || !renderer) return;

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }


        // =====================================================
        // UPDATE SPHERE
        // =====================================================

        function updateSphere() {

            sphere.position.set(

                Math.sin(timestamp * 2.1) * 0.1,

                0,

                Math.sin(timestamp * 0.8)

            );


            spherePositionUniform.value.copy(
                sphere.position
            );

        }


        // =====================================================
        // RENDER AND COMPUTE
        // =====================================================

        function render() {

            if (!animationStarted) return;


            timer.update();


            // -------------------------------------------------
            // GUI STATE
            // -------------------------------------------------

            sphere.visible = params.sphere;

            sphereUniform.value =
                params.sphere ? 1 : 0;

            windUniform.value = params.wind;


            clothMesh.visible =
                !params.wireframe;

            vertexWireframeObject.visible =
                params.wireframe;

            springWireframeObject.visible =
                params.wireframe;


            // -------------------------------------------------
            // FIXED TIMESTEP
            // -------------------------------------------------

            const deltaTime = Math.min(

                timer.getDelta(),

                1 / 60

            );


            const stepsPerSecond = 360;

            const timePerStep = 1 / stepsPerSecond;


            timeSinceLastStep += deltaTime;


            // -------------------------------------------------
            // VERLET SIMULATION
            // -------------------------------------------------

            while (
                timeSinceLastStep >= timePerStep
            ) {

                timestamp += timePerStep;

                timeSinceLastStep -= timePerStep;


                updateSphere();


                // Step 1: calculate spring forces.

                renderer.compute(
                    computeSpringForces
                );


                // Step 2: calculate vertex forces.

                renderer.compute(
                    computeVertexForces
                );

            }


            // -------------------------------------------------
            // RENDER SCENE
            // -------------------------------------------------

            controls.update();

            renderer.render(
                scene,
                camera
            );

        }


        // =====================================================
        // CLEANUP
        // =====================================================

        function cleanup() {

            animationStarted = false;

            window.removeEventListener(
                'resize',
                onWindowResize
            );


            if (renderer) {

                renderer.setAnimationLoop(null);

            }


            if (controls) {

                controls.dispose();

            }


            if (gui) {

                gui.destroy();

            }


            if (scene) {

                const geometries = new Set();

                const materials = new Set();

                const textures = new Set();


                scene.traverse(object => {

                    if (object.geometry) {

                        geometries.add(object.geometry);

                    }


                    if (object.material) {

                        const list = Array.isArray(object.material)

                            ? object.material

                            : [object.material];


                        for (const material of list) {

                            materials.add(material);


                            for (
                                const value of Object.values(material)
                            ) {

                                if (value && value.isTexture) {

                                    textures.add(value);

                                }

                            }

                        }

                    }

                });


                geometries.forEach(item => item.dispose());

                materials.forEach(item => item.dispose());

                textures.forEach(item => item.dispose());

            }


            if (renderer) {

                renderer.dispose();

            }

        }


        window.addEventListener(
            'pagehide',
            cleanup,
            { once: true }
        );


        // =====================================================
        // START APPLICATION
        // =====================================================

        init().catch(error => {

            console.error(
                'Compute Cloth error:',
                error
            );

            showStatus(
                'Unable to start Compute Cloth: ' +
                error.message +
                '. Check the browser console.'
            );

        });

    </script>

</body>
</html>
