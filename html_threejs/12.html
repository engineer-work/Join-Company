
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js WebGPU - VXGI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #aaaaaa;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            color: #111;
            pointer-events: none;
            line-height: 1.5;
        }

        #info a {
            color: #111;
            text-decoration: none;
            pointer-events: auto;
        }

        .title-wrapper {
            font-size: 18px;
            font-weight: bold;
        }

        .title-wrapper span {
            margin-left: 10px;
        }

        #info small {
            display: block;
            margin-top: 4px;
        }

        #error {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: #171717;
            color: white;
            font: 14px/1.6 monospace;
            white-space: pre-wrap;
            z-index: 100;
        }
    </style>

  
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
}
</script>

</head>

<body>

    <div id="info">
        <div class="title-wrapper">
            <a href="https://threejs.org/" target="_blank" rel="noopener">
                three.js
            </a>
            <span>VXGI</span>
        </div>
        <small>Diffuse global illumination using Voxel Cone Tracing.</small>
    </div>

    <div id="error"></div>

    <script type="module">

       import * as THREE from 'three/webgpu';

import {
    pass,
    mrt,
    normalView,
    velocity,
    vec3,
    vec4,
    packNormalToRGB,
    unpackRGBToNormal,
    sample,
    screenUV,
    builtinGIContext
} from 'three/tsl';

import { vxgi } from 'three/addons/lighting/vxgi/VXGINode.js';
import { traa } from 'three/addons/tsl/display/TRAANode.js';

        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Inspector } from 'three/addons/inspector/Inspector.js';
        import WebGPU from 'three/addons/capabilities/WebGPU.js';


        // --------------------------------------------------
        // GLOBAL VARIABLES
        // --------------------------------------------------

        let camera;
        let scene;
        let renderer;
        let renderPipeline;
        let controls;

        let giPass;
        let ao;
        let gi;
        let scenePass;
        let traaPass;
        let giContext;

        const errorElement = document.getElementById('error');


        // --------------------------------------------------
        // ERROR HANDLING
        // --------------------------------------------------

        function showError(error) {

            console.error(error);

            errorElement.style.display = 'flex';

            errorElement.textContent =
                'Unable to initialize the VXGI demo.\n\n' +
                (error?.stack || error?.message || String(error)) +
                '\n\nCheck your browser WebGPU support and console.';

        }


        // --------------------------------------------------
        // INITIALIZATION
        // --------------------------------------------------

        async function init() {

            // Check WebGPU support

            if (WebGPU.isAvailable() === false) {

                throw new Error(
                    'WebGPU is not available in this browser or on this device.'
                );

            }


            // --------------------------------------------------
            // CAMERA
            // --------------------------------------------------

            camera = new THREE.PerspectiveCamera(
                40,
                window.innerWidth / window.innerHeight,
                0.1,
                100
            );

            camera.position.set(0, 10, 30);


            // --------------------------------------------------
            // SCENE
            // --------------------------------------------------

            scene = new THREE.Scene();

            scene.background = new THREE.Color(0xaaaaaa);


            // --------------------------------------------------
            // WEBGPU RENDERER
            // --------------------------------------------------

            renderer = new THREE.WebGPURenderer({
                antialias: true
            });

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 1.5)
            );

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.shadowMap.enabled = true;

            document.body.appendChild(renderer.domElement);

            // Important: initialize WebGPU before creating
            // the render pipeline and starting rendering.

            await renderer.init();

            renderer.inspector = new Inspector();


            // --------------------------------------------------
            // ORBIT CONTROLS
            // --------------------------------------------------

            controls = new OrbitControls(
                camera,
                renderer.domElement
            );

            controls.target.set(0, 7, 0);

            controls.enablePan = true;
            controls.minDistance = 1;
            controls.maxDistance = 100;

            controls.update();


            // --------------------------------------------------
            // RENDER PIPELINE
            // --------------------------------------------------

            renderPipeline = new THREE.RenderPipeline(renderer);


            // --------------------------------------------------
            // PRE-PASS
            // --------------------------------------------------

            const prePass = pass(scene, camera);

            prePass.name = 'Pre-Pass';
            prePass.transparent = false;

            prePass.setMRT(
                mrt({
                    output: packNormalToRGB(normalView),
                    velocity: velocity
                })
            );


            // --------------------------------------------------
            // NORMAL TEXTURE
            // --------------------------------------------------

            const prePassNormal = sample((uv) => {

                return unpackRGBToNormal(
                    prePass.getTextureNode().sample(uv)
                );

            });


            // --------------------------------------------------
            // DEPTH AND VELOCITY
            // --------------------------------------------------

            const prePassDepth =
                prePass.getTextureNode('depth')
                    .toInspector(
                        'Depth',
                        () => prePass.getLinearDepthNode()
                    );

            const prePassVelocity =
                prePass.getTextureNode('velocity')
                    .toInspector('Velocity');


            // --------------------------------------------------
            // PRE-PASS MEMORY OPTIMIZATION
            // --------------------------------------------------

            const normalTexture = prePass.getTexture('output');

            normalTexture.type = THREE.UnsignedByteType;


            // --------------------------------------------------
            // VXGI
            // --------------------------------------------------

            // Resolution: 64 voxels along the longest axis.
            // Lower this to 32 if performance or memory is limited.

            giPass = vxgi(
                prePassDepth,
                prePassNormal,
                scene,
                camera,
                64
            );

            ao = giPass.getAONode()
                .toInspector('VXGI.AO');

            gi = giPass.getGINode()
                .toInspector('VXGI.GI');


            // --------------------------------------------------
            // SCENE PASS
            // --------------------------------------------------

            scenePass = pass(scene, camera)
                .toInspector('Color');

            giContext = builtinGIContext(
                ao.sample(screenUV).r,
                gi.sample(screenUV).rgb
            );

            scenePass.contextNode = giContext;


            // --------------------------------------------------
            // TEMPORAL ANTI-ALIASING
            // --------------------------------------------------

            traaPass = traa(
                scenePass,
                prePassDepth,
                prePassVelocity,
                camera
            );

            renderPipeline.outputNode = traaPass;


            // --------------------------------------------------
            // CORNELL BOX SCENE
            // --------------------------------------------------

            const wallGeometry = new THREE.PlaneGeometry(1, 1);


            // --------------------------------------------------
            // LEFT WALL - RED
            // --------------------------------------------------

            const redWallMaterial =
                new THREE.MeshPhysicalMaterial({
                    color: '#ff0000'
                });

            const leftWall = new THREE.Mesh(
                wallGeometry,
                redWallMaterial
            );

            leftWall.scale.set(20, 15, 1);

            leftWall.rotation.y = Math.PI * 0.5;

            leftWall.position.set(-10, 7.5, 0);

            leftWall.receiveShadow = true;

            scene.add(leftWall);


            // --------------------------------------------------
            // RIGHT WALL - GREEN
            // --------------------------------------------------

            const greenWallMaterial =
                new THREE.MeshPhysicalMaterial({
                    color: '#00ff00'
                });

            const rightWall = new THREE.Mesh(
                wallGeometry,
                greenWallMaterial
            );

            rightWall.scale.set(20, 15, 1);

            rightWall.rotation.y = Math.PI * -0.5;

            rightWall.position.set(9.999, 7.5, 0);

            rightWall.receiveShadow = true;

            scene.add(rightWall);


            // --------------------------------------------------
            // WHITE MATERIAL
            // --------------------------------------------------

            const whiteMaterial =
                new THREE.MeshPhysicalMaterial({
                    color: '#ffffff'
                });


            // --------------------------------------------------
            // FLOOR
            // --------------------------------------------------

            const floor = new THREE.Mesh(
                wallGeometry,
                whiteMaterial
            );

            floor.scale.set(20, 20, 1);

            floor.rotation.x = Math.PI * -0.5;

            floor.receiveShadow = true;

            scene.add(floor);


            // --------------------------------------------------
            // BACK WALL
            // --------------------------------------------------

            const backWall = new THREE.Mesh(
                wallGeometry,
                whiteMaterial
            );

            backWall.scale.set(15, 20, 1);

            backWall.rotation.z = Math.PI * -0.5;

            backWall.position.set(0, 7.5, -10);

            backWall.receiveShadow = true;

            scene.add(backWall);


            // --------------------------------------------------
            // CEILING
            // --------------------------------------------------

            const ceiling = new THREE.Mesh(
                wallGeometry,
                whiteMaterial
            );

            ceiling.scale.set(20, 20, 1);

            ceiling.rotation.x = Math.PI * 0.5;

            ceiling.position.set(0, 14.999, 0);

            ceiling.receiveShadow = true;

            scene.add(ceiling);


            // --------------------------------------------------
            // TALL BOX
            // --------------------------------------------------

            const tallBoxGeometry =
                new THREE.BoxGeometry(5, 7, 5);

            const tallBox = new THREE.Mesh(
                tallBoxGeometry,
                whiteMaterial
            );

            tallBox.rotation.y = Math.PI * 0.25;

            tallBox.position.set(-3, 3.5, -2);

            tallBox.castShadow = true;
            tallBox.receiveShadow = true;

            scene.add(tallBox);


            // --------------------------------------------------
            // SHORT BOX
            // --------------------------------------------------

            const shortBoxGeometry =
                new THREE.BoxGeometry(4, 4, 4);

            const shortBox = new THREE.Mesh(
                shortBoxGeometry,
                whiteMaterial
            );

            shortBox.rotation.y = Math.PI * -0.1;

            shortBox.position.set(4, 2, 4);

            shortBox.castShadow = true;
            shortBox.receiveShadow = true;

            scene.add(shortBox);


            // --------------------------------------------------
            // LIGHT SOURCE GEOMETRY
            // --------------------------------------------------

            const lightSourceGeometry =
                new THREE.CylinderGeometry(
                    2.5,
                    2.5,
                    1,
                    64
                );

            const lightSourceMaterial =
                new THREE.MeshBasicMaterial();

            const lightSource = new THREE.Mesh(
                lightSourceGeometry,
                lightSourceMaterial
            );

            lightSource.position.y = 15;

            scene.add(lightSource);


            // --------------------------------------------------
            // POINT LIGHT
            // --------------------------------------------------

            const pointLight = new THREE.PointLight(
                '#ffffff',
                100
            );

            pointLight.position.set(0, 13, 0);

            pointLight.distance = 100;

            pointLight.castShadow = true;

            // Reduced for better performance on older GPUs.

            pointLight.shadow.mapSize.width = 512;
            pointLight.shadow.mapSize.height = 512;

            scene.add(pointLight);


            // --------------------------------------------------
            // AMBIENT LIGHT
            // --------------------------------------------------

            const ambientLight = new THREE.AmbientLight(
                '#0c0c0c'
            );

            scene.add(ambientLight);


            // --------------------------------------------------
            // VXGI SETTINGS
            // --------------------------------------------------

            const params = {
                output: 0,
                debug: 0,
                lightX: 0,
                lightZ: 0
            };

            const types = {
                Combined: 0,
                Direct: 3,
                AO: 1,
                GI: 2
            };

            const debugTypes = {
                Off: 0,
                Radiance: 1,
                Opacity: 2
            };


            // --------------------------------------------------
            // INSPECTOR GUI
            // --------------------------------------------------

            const gui = renderer.inspector.createParameters(
                'VXGI Settings'
            );

            gui.add(
                params,
                'output',
                types
            ).onChange(updatePostprocessing);

            gui.add(
                params,
                'debug',
                debugTypes
            )
            .name('voxel view')
            .onChange(updatePostprocessing);

            gui.add(
                giPass.debugLevel,
                'value',
                0,
                4,
                1
            ).name('voxel view level');

            gui.add(
                giPass.coneCount,
                'value',
                2,
                8,
                1
            ).name('cone count');

            gui.add(
                giPass.coneAngle,
                'value',
                10,
                90
            ).name('cone angle');

            gui.add(
                giPass.volume.stepScale,
                'value',
                0.25,
                2
            ).name('step scale');

            gui.add(
                giPass.volume.maxDistance,
                'value',
                0,
                50
            ).name('max distance');

            gui.add(
                giPass.normalOffset,
                'value',
                0,
                4
            ).name('normal offset');

            gui.add(
                giPass.giIntensity,
                'value',
                0,
                4
            ).name('GI intensity');

            gui.add(
                giPass,
                'bounces',
                0,
                2,
                1
            ).name('bounces');

            gui.add(
                giPass,
                'directionalRadiance'
            ).name('directional radiance');

            gui.add(
                giPass,
                'useTemporalFiltering'
            )
            .name('temporal filtering')
            .onChange(updatePostprocessing);


            // --------------------------------------------------
            // POST-PROCESSING UPDATE
            // --------------------------------------------------

            function updatePostprocessing() {

                giPass.debug.value = params.debug;

                if (params.debug !== 0) {

                    renderPipeline.outputNode =
                        vec4(gi.rgb, 1);

                } else if (params.output === 1) {

                    renderPipeline.outputNode =
                        vec4(vec3(ao), 1);

                } else if (params.output === 2) {

                    renderPipeline.outputNode =
                        vec4(gi.rgb, 1);

                } else if (params.output === 3) {

                    renderPipeline.outputNode = scenePass;

                } else {

                    renderPipeline.outputNode =
                        giPass.useTemporalFiltering
                            ? traaPass
                            : scenePass;

                }


                // Direct lighting only:
                // render scene without the GI context.

                scenePass.contextNode =
                    (params.output === 3)
                        ? null
                        : giContext;

                scenePass.needsUpdate = true;

                renderPipeline.needsUpdate = true;

            }


            // --------------------------------------------------
            // WINDOW RESIZE
            // --------------------------------------------------

            window.addEventListener(
                'resize',
                onWindowResize
            );


            // --------------------------------------------------
            // START RENDERING
            // --------------------------------------------------

            renderer.setAnimationLoop(animate);

        }


        // --------------------------------------------------
        // RESIZE HANDLER
        // --------------------------------------------------

        function onWindowResize() {

            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;

            camera.updateProjectionMatrix();

            renderer.setSize(width, height);

        }


        // --------------------------------------------------
        // ANIMATION LOOP
        // --------------------------------------------------

        function animate() {

            controls.update();

            renderPipeline.render();

        }


        // --------------------------------------------------
        // START APPLICATION
        // --------------------------------------------------

        init().catch(showError);

    </script>

</body>
</html>
