
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three.js - Sky and Sun Shader</title>

    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            padding: 10px 14px;
            color: white;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.6;
            pointer-events: none;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="info">
    <strong>Three.js - Sky and Sun Shader</strong>
    Drag: Rotate view<br>
    GUI: Change atmosphere and sunlight
</div>

<script type="module">

import * as THREE from "three";

import { OrbitControls } from
    "three/addons/controls/OrbitControls.js";

import { Sky } from
    "three/addons/objects/Sky.js";

import GUI from
    "three/addons/libs/lil-gui.module.min.js";

import Stats from
    "three/addons/libs/stats.module.js";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let camera;
let scene;
let renderer;

let sky;
let sun;

let sphere;
let cubeCamera;

let controls;
let gui;
let stats;

let cubeRenderTarget;


/* =====================================================
   PARAMETERS
===================================================== */

const parameters = {

    turbidity: 10,

    rayleigh: 3,

    mieCoefficient: 0.005,

    mieDirectionalG: 0.7,

    elevation: 65,

    azimuth: 0,

    exposure: 0.5,

    showSunDisc: true

};


/* =====================================================
   INITIALIZATION
===================================================== */

init();

function init() {

    /* Scene */

    scene = new THREE.Scene();


    /* Camera */

    camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        1,
        2000000
    );

    camera.position.set(
        0,
        100,
        2000
    );


    /* Renderer */

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "default"
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = parameters.exposure;

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);


    /* Statistics */

    stats = new Stats();

    document.body.appendChild(stats.dom);


    /* Orbit controls */

    controls = new OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enableZoom = false;

    controls.enablePan = false;

    controls.enableDamping = true;

    controls.dampingFactor = 0.04;


    /* Sky */

    initSky();


    /* Reflective sphere */

    initSphere();


    /* GUI */

    initGUI();


    /* Resize */

    window.addEventListener(
        "resize",
        onWindowResize
    );


    /* Animation */

    renderer.setAnimationLoop(animate);

}


/* =====================================================
   SKY
===================================================== */

function initSky() {

    sky = new Sky();

    sky.scale.setScalar(450000);

    scene.add(sky);

    sun = new THREE.Vector3();

    const uniforms = sky.material.uniforms;

    uniforms["turbidity"].value = parameters.turbidity;

    uniforms["rayleigh"].value = parameters.rayleigh;

    uniforms["mieCoefficient"].value =
        parameters.mieCoefficient;

    uniforms["mieDirectionalG"].value =
        parameters.mieDirectionalG;

    updateSky();

}


/* =====================================================
   UPDATE SUN AND SKY
===================================================== */

function updateSky() {

    const uniforms = sky.material.uniforms;

    uniforms["turbidity"].value =
        parameters.turbidity;

    uniforms["rayleigh"].value =
        parameters.rayleigh;

    uniforms["mieCoefficient"].value =
        parameters.mieCoefficient;

    uniforms["mieDirectionalG"].value =
        parameters.mieDirectionalG;

    /*
       Convert elevation and azimuth to spherical coordinates.
    */

    const phi = THREE.MathUtils.degToRad(
        90 - parameters.elevation
    );

    const theta = THREE.MathUtils.degToRad(
        parameters.azimuth
    );

    sun.setFromSphericalCoords(
        1,
        phi,
        theta
    );

    uniforms["sunPosition"].value.copy(sun);

    renderer.toneMappingExposure = parameters.exposure;

}


/* =====================================================
   REFLECTIVE SPHERE
===================================================== */

function initSphere() {

    /*
       Cube render target.
       The sphere reflects the surrounding sky.
    */

    cubeRenderTarget = new THREE.WebGLCubeRenderTarget(
        256,
        {
            type: THREE.HalfFloatType
        }
    );

    cubeCamera = new THREE.CubeCamera(
        1,
        1000000,
        cubeRenderTarget
    );

    sphere = new THREE.Mesh(

        new THREE.SphereGeometry(
            400,
            64,
            32
        ),

        new THREE.MeshBasicMaterial({

            envMap: cubeRenderTarget.texture,

            color: 0xffffff,

            roughness: 0,

            metalness: 1

        })

    );

    sphere.position.set(
        0,
        0,
        0
    );

    scene.add(sphere);

}


/* =====================================================
   GUI
===================================================== */

function initGUI() {

    gui = new GUI({
        title: "Sky and Sun Controls"
    });


    /* Atmosphere */

    const atmosphere = gui.addFolder(
        "Atmosphere"
    );

    atmosphere.add(
        parameters,
        "turbidity",
        0,
        20,
        0.1
    ).onChange(updateSky);

    atmosphere.add(
        parameters,
        "rayleigh",
        0,
        4,
        0.001
    ).onChange(updateSky);

    atmosphere.add(
        parameters,
        "mieCoefficient",
        0,
        0.1,
        0.001
    ).onChange(updateSky);

    atmosphere.add(
        parameters,
        "mieDirectionalG",
        0,
        1,
        0.001
    ).onChange(updateSky);


    /* Sun */

    const sunFolder = gui.addFolder(
        "Sun Position"
    );

    sunFolder.add(
        parameters,
        "elevation",
        0,
        90,
        0.1
    ).onChange(updateSky);

    sunFolder.add(
        parameters,
        "azimuth",
        -180,
        180,
        0.1
    ).onChange(updateSky);

    sunFolder.add(
        parameters,
        "exposure",
        0,
        1,
        0.001
    ).onChange(updateSky);


    /* Sun disc */

    sunFolder.add(
        parameters,
        "showSunDisc"
    ).onChange(value => {

        sky.material.uniforms[
            "sunDisc"
        ].value = value ? 1 : 0;

    });


    atmosphere.open();

    sunFolder.open();

}


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    controls.update();

    /*
       Hide the sphere while updating the cube camera.
       This prevents the sphere from reflecting itself.
    */

    sphere.visible = false;

    cubeCamera.update(
        renderer,
        scene
    );

    sphere.visible = true;

    renderer.render(
        scene,
        camera
    );

    stats.update();

}


/* =====================================================
   RESIZE
===================================================== */

function onWindowResize() {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener("pagehide", () => {

    renderer.setAnimationLoop(null);

    controls.dispose();

    gui.destroy();

    sphere.geometry.dispose();

    sphere.material.dispose();

    sky.geometry.dispose();

    sky.material.dispose();

    cubeRenderTarget.dispose();

    renderer.dispose();

}, { once: true });


</script>

</body>
</html>
