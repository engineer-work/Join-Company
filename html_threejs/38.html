
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js - Subsurface Scattering</title>
    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            color: white;
            line-height: 1.6;
            pointer-events: none;
            text-shadow: 0 1px 3px #000;
        }

        #info a {
            color: #08f;
            text-decoration: none;
            pointer-events: auto;
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            padding: 15px 20px;
            max-width: 90%;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            text-align: center;
        }

        .lil-gui {
            z-index: 30 !important;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="container"></div>

    <div id="info">
        <a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>
        <br>
        Fast subsurface scattering in Blinn-Phong shading demo
        <br>
        Art support:
        <a href="https://github.com/shaochun" target="_blank" rel="noopener">
            Shaochun Lin
        </a>
    </div>

    <div id="status">Loading subsurface scattering demo...</div>

    <script type="module">

        import * as THREE from 'three';

        import Stats from
            'three/addons/libs/stats.module.js';

        import { GUI } from
            'three/addons/libs/lil-gui.module.min.js';

        import { OrbitControls } from
            'three/addons/controls/OrbitControls.js';

        import { SubsurfaceScatteringShader } from
            'three/addons/shaders/SubsurfaceScatteringShader.js';

        import { FBXLoader } from
            'three/addons/loaders/FBXLoader.js';

        // --------------------------------------------------
        // ASSET URLS
        // --------------------------------------------------

        const MODEL_URL =
            'https://threejs.org/examples/models/fbx/stanford-bunny.fbx';

        const DIFFUSE_TEXTURE_URL =
            'https://threejs.org/examples/models/fbx/white.jpg';

        const THICKNESS_TEXTURE_URL =
            'https://threejs.org/examples/models/fbx/bunny_thickness.jpg';

        // --------------------------------------------------
        // VARIABLES
        // --------------------------------------------------

        let camera;
        let scene;
        let renderer;

        let controls;
        let stats;
        let gui;

        let model;
        let material;
        let shaderUniforms;

        let animationRunning = false;
        let disposed = false;

        const container = document.getElementById('container');
        const status = document.getElementById('status');

        // --------------------------------------------------
        // INITIALIZATION
        // --------------------------------------------------

        async function init() {

            // Camera
            camera = new THREE.PerspectiveCamera(
                40,
                window.innerWidth / window.innerHeight,
                1,
                5000
            );

            camera.position.set(0, 300, 400 * 4);

            // Scene
            scene = new THREE.Scene();

            // --------------------------------------------------
            // LIGHTING
            // --------------------------------------------------

            scene.add(
                new THREE.AmbientLight(0xc1c1c1)
            );

            const directionalLight = new THREE.DirectionalLight(
                0xffffff,
                0.03
            );

            directionalLight.position.set(0, 0.5, 0.5).normalize();

            scene.add(directionalLight);

            // Point light 1
            const pointLight1 = new THREE.Mesh(
                new THREE.SphereGeometry(4, 8, 8),
                new THREE.MeshBasicMaterial({
                    color: 0xc1c1c1
                })
            );

            pointLight1.add(
                new THREE.PointLight(
                    0xc1c1c1,
                    4.0,
                    300,
                    0
                )
            );

            pointLight1.position.set(0, -50, 350);

            scene.add(pointLight1);

            // Point light 2
            const pointLight2 = new THREE.Mesh(
                new THREE.SphereGeometry(4, 8, 8),
                new THREE.MeshBasicMaterial({
                    color: 0xc1c100
                })
            );

            pointLight2.add(
                new THREE.PointLight(
                    0xc1c100,
                    0.75,
                    500,
                    0
                )
            );

            pointLight2.position.set(-100, 20, -260);

            scene.add(pointLight2);

            // --------------------------------------------------
            // RENDERER
            // --------------------------------------------------

            renderer = new THREE.WebGLRenderer({
                antialias: true
            });

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 1.5)
            );

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.outputColorSpace = THREE.SRGBColorSpace;

            container.appendChild(renderer.domElement);

            // --------------------------------------------------
            // CONTROLS
            // --------------------------------------------------

            controls = new OrbitControls(
                camera,
                renderer.domElement
            );

            controls.minDistance = 500;
            controls.maxDistance = 3000;

            controls.target.set(0, 0, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // --------------------------------------------------
            // STATS
            // --------------------------------------------------

            stats = new Stats();

            container.appendChild(stats.dom);

            // --------------------------------------------------
            // EVENTS
            // --------------------------------------------------

            window.addEventListener(
                'resize',
                onWindowResize
            );

            // --------------------------------------------------
            // LOAD SHADER, TEXTURES AND MODEL
            // --------------------------------------------------

            await initMaterial();

            if (disposed) return;

            animationRunning = true;

            renderer.setAnimationLoop(animate);

            status.style.display = 'none';
        }

        // --------------------------------------------------
        // INITIALIZE SUBSURFACE SCATTERING MATERIAL
        // --------------------------------------------------

        async function initMaterial() {

            status.textContent = 'Loading textures...';

            const textureLoader = new THREE.TextureLoader();

            // Load both textures.
            const [imgTexture, thicknessTexture] = await Promise.all([

                textureLoader.loadAsync(DIFFUSE_TEXTURE_URL),

                textureLoader.loadAsync(THICKNESS_TEXTURE_URL)

            ]);

            if (disposed) {
                imgTexture.dispose();
                thicknessTexture.dispose();
                return;
            }

            // Diffuse texture is an sRGB color image.
            imgTexture.colorSpace = THREE.SRGBColorSpace;

            imgTexture.wrapS = THREE.RepeatWrapping;
            imgTexture.wrapT = THREE.RepeatWrapping;

            // Thickness map is data, not a color image.
            thicknessTexture.colorSpace = THREE.NoColorSpace;

            thicknessTexture.wrapS = THREE.RepeatWrapping;
            thicknessTexture.wrapT = THREE.RepeatWrapping;

            // --------------------------------------------------
            // SHADER UNIFORMS
            // --------------------------------------------------

            const shader = SubsurfaceScatteringShader;

            shaderUniforms = THREE.UniformsUtils.clone(
                shader.uniforms
            );

            shaderUniforms.map.value = imgTexture;

            shaderUniforms.diffuse.value =
                new THREE.Vector3(1.0, 0.2, 0.2);

            shaderUniforms.shininess.value = 500;

            shaderUniforms.thicknessMap.value =
                thicknessTexture;

            shaderUniforms.thicknessColor.value =
                new THREE.Vector3(0.5, 0.3, 0.0);

            shaderUniforms.thicknessDistortion.value = 0.1;

            shaderUniforms.thicknessAmbient.value = 0.4;

            shaderUniforms.thicknessAttenuation.value = 0.8;

            shaderUniforms.thicknessPower.value = 2.0;

            shaderUniforms.thicknessScale.value = 16.0;

            // --------------------------------------------------
            // SHADER MATERIAL
            // --------------------------------------------------

            material = new THREE.ShaderMaterial({

                uniforms: shaderUniforms,

                vertexShader: shader.vertexShader,

                fragmentShader: shader.fragmentShader,

                lights: true

            });

            // --------------------------------------------------
            // LOAD FBX MODEL
            // --------------------------------------------------

            status.textContent = 'Loading Stanford Bunny model...';

            const loaderFBX = new FBXLoader();

            model = await loaderFBX.loadAsync(MODEL_URL);

            if (disposed) return;

            // Apply the SSS material to all meshes in the FBX.
            let meshCount = 0;

            model.traverse(child => {

                if (child.isMesh) {

                    child.material = material;

                    child.castShadow = true;
                    child.receiveShadow = true;

                    meshCount++;

                }

            });

            if (meshCount === 0) {

                throw new Error(
                    'The FBX model does not contain any mesh objects.'
                );

            }

            model.position.set(0, 0, 10);
            model.scale.setScalar(1);

            scene.add(model);

            console.log('Loaded FBX model:', model);
            console.log('Mesh count:', meshCount);

            // --------------------------------------------------
            // GUI
            // --------------------------------------------------

            initGUI(shaderUniforms);
        }

        // --------------------------------------------------
        // GUI CONTROLS
        // --------------------------------------------------

        function initGUI(uniforms) {

            gui = new GUI({
                title: 'Thickness Control'
            });

            const thicknessControls = {

                distortion: uniforms.thicknessDistortion.value,

                ambient: uniforms.thicknessAmbient.value,

                attenuation: uniforms.thicknessAttenuation.value,

                power: uniforms.thicknessPower.value,

                scale: uniforms.thicknessScale.value

            };

            // Distortion
            gui.add(
                thicknessControls,
                'distortion',
                0.01,
                1,
                0.01
            )
            .name('Distortion')
            .onChange(value => {

                uniforms.thicknessDistortion.value = value;

            });

            // Ambient
            gui.add(
                thicknessControls,
                'ambient',
                0.01,
                5,
                0.05
            )
            .name('Ambient')
            .onChange(value => {

                uniforms.thicknessAmbient.value = value;

            });

            // Attenuation
            gui.add(
                thicknessControls,
                'attenuation',
                0.01,
                5,
                0.05
            )
            .name('Attenuation')
            .onChange(value => {

                uniforms.thicknessAttenuation.value = value;

            });

            // Power
            gui.add(
                thicknessControls,
                'power',
                0.01,
                16,
                0.1
            )
            .name('Power')
            .onChange(value => {

                uniforms.thicknessPower.value = value;

            });

            // Scale
            gui.add(
                thicknessControls,
                'scale',
                0.01,
                50,
                0.1
            )
            .name('Scale')
            .onChange(value => {

                uniforms.thicknessScale.value = value;

            });
        }

        // --------------------------------------------------
        // ANIMATION
        // --------------------------------------------------

        function animate() {

            if (!animationRunning || disposed) return;

            if (model) {

                model.rotation.y = performance.now() / 5000;

            }

            controls.update();

            render();

            stats.update();
        }

        // --------------------------------------------------
        // RENDER
        // --------------------------------------------------

        function render() {

            if (!renderer || !scene || !camera || disposed) {
                return;
            }

            renderer.render(scene, camera);
        }

        // --------------------------------------------------
        // RESIZE
        // --------------------------------------------------

        function onWindowResize() {

            if (!camera || !renderer) return;

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }

        // --------------------------------------------------
        // CLEANUP
        // --------------------------------------------------

        function cleanup() {

            disposed = true;
            animationRunning = false;

            window.removeEventListener(
                'resize',
                onWindowResize
            );

            if (renderer) {
                renderer.setAnimationLoop(null);
            }

            if (controls) {
                controls.dispose();
            }

            if (gui) {
                gui.destroy();
            }

            if (scene) {

                scene.traverse(object => {

                    if (object.geometry) {
                        object.geometry.dispose();
                    }

                });
            }

            if (material) {
                material.dispose();

                const map = shaderUniforms?.map?.value;
                const thicknessMap =
                    shaderUniforms?.thicknessMap?.value;

                map?.dispose();
                thicknessMap?.dispose();
            }

            if (renderer) {
                renderer.dispose();
            }
        }

        window.addEventListener(
            'pagehide',
            cleanup,
            { once: true }
        );

        // --------------------------------------------------
        // START
        // --------------------------------------------------

        init().catch(error => {

            console.error(
                'Subsurface Scattering Error:',
                error
            );

            status.textContent =
                'Error: ' + error.message;

            status.style.color = '#ff7777';

        });

    </script>

</body>
</html>
