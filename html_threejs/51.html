
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Three.js - Multiple Animated Skinned Meshes</title>

    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #a0a0a0;
        }

        body {
            position: relative;
        }

        #info {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.45);
            padding: 10px 14px;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.6;
            max-width: 460px;
        }

        #info a {
            color: #ff7777;
            text-decoration: none;
        }

        #info a:hover {
            text-decoration: underline;
        }

        #loading,
        #error {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            padding: 16px 20px;
            border-radius: 8px;
            text-align: center;
            line-height: 1.5;
        }

        #loading {
            color: white;
            background: rgba(0, 0, 0, 0.7);
        }

        #error {
            display: none;
            width: min(90%, 600px);
            color: white;
            background: #600;
            white-space: pre-wrap;
        }

        .lil-gui {
            --background-color: rgba(25, 25, 25, 0.92);
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="info">
        This demo shows the usage of
        <strong>SkeletonUtils.clone()</strong>
        and how to set up a shared skeleton.<br>

        Soldier model from
        <a href="https://www.mixamo.com/"
           target="_blank"
           rel="noopener">Mixamo</a>.
    </div>

    <div id="loading">
        Loading Soldier model...
    </div>

    <div id="error"></div>

    <script type="module">

        import * as THREE from 'three';

        import { GLTFLoader }
            from 'three/addons/loaders/GLTFLoader.js';

        import * as SkeletonUtils
            from 'three/addons/utils/SkeletonUtils.js';

        import { GUI }
            from 'three/addons/libs/lil-gui.module.min.js';


        // --------------------------------------------------
        // GLOBAL VARIABLES
        // --------------------------------------------------

        let camera;
        let scene;
        let renderer;
        let timer;

        let model;
        let animations;

        let gui;

        const mixers = [];
        const objects = [];

        const params = {
            sharedSkeleton: false
        };

        const loadingElement =
            document.getElementById('loading');

        const errorElement =
            document.getElementById('error');


        // --------------------------------------------------
        // INITIALIZATION
        // --------------------------------------------------

        init();

        function init() {

            // Camera
            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                1,
                1000
            );

            camera.position.set(2, 3, -6);
            camera.lookAt(0, 1, 0);


            // Timer
            timer = new THREE.Timer();
            timer.connect(document);


            // Scene
            scene = new THREE.Scene();

            scene.background =
                new THREE.Color(0xa0a0a0);

            scene.fog = new THREE.Fog(
                0xa0a0a0,
                10,
                50
            );


            // --------------------------------------------------
            // LIGHTING
            // --------------------------------------------------

            const hemiLight =
                new THREE.HemisphereLight(
                    0xffffff,
                    0x8d8d8d,
                    3
                );

            hemiLight.position.set(0, 20, 0);

            scene.add(hemiLight);


            const dirLight =
                new THREE.DirectionalLight(
                    0xffffff,
                    3
                );

            dirLight.position.set(-3, 10, -10);

            dirLight.castShadow = true;

            dirLight.shadow.camera.top = 4;
            dirLight.shadow.camera.bottom = -4;
            dirLight.shadow.camera.left = -4;
            dirLight.shadow.camera.right = 4;

            dirLight.shadow.camera.near = 0.1;
            dirLight.shadow.camera.far = 40;

            dirLight.shadow.mapSize.set(1024, 1024);

            scene.add(dirLight);


            // --------------------------------------------------
            // GROUND
            // --------------------------------------------------

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(200, 200),

                new THREE.MeshPhongMaterial({
                    color: 0xcbcbcb,
                    depthWrite: false
                })
            );

            ground.rotation.x = -Math.PI / 2;

            ground.receiveShadow = true;

            scene.add(ground);


            // --------------------------------------------------
            // RENDERER
            // --------------------------------------------------

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance'
            });

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 1.5)
            );

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.shadowMap.enabled = true;

            renderer.shadowMap.type =
                THREE.PCFSoftShadowMap;

            renderer.outputColorSpace =
                THREE.SRGBColorSpace;

            document.body.appendChild(
                renderer.domElement
            );


            // --------------------------------------------------
            // LOAD MODEL
            // --------------------------------------------------

            loadSoldierModel();


            // --------------------------------------------------
            // GUI
            // --------------------------------------------------

            gui = new GUI();

            gui.add(
                params,
                'sharedSkeleton'
            )
            .name('Shared Skeleton')
            .onChange(function (value) {

                if (!model) return;

                clearScene();

                try {

                    if (value) {

                        setupSharedSkeletonScene();

                    } else {

                        setupDefaultScene();

                    }

                } catch (error) {

                    console.error(
                        'Scene setup error:',
                        error
                    );

                    showError(error.message);

                }

            });

            gui.open();


            // Resize
            window.addEventListener(
                'resize',
                onWindowResize
            );

        }


        // --------------------------------------------------
        // LOAD SOLDIER MODEL
        // --------------------------------------------------

        function loadSoldierModel() {

            const loader = new GLTFLoader();

            const modelURL =
                'https://threejs.org/examples/models/gltf/Soldier.glb';

            loader.load(

                modelURL,

                function (gltf) {

                    model = gltf.scene;

                    animations = gltf.animations;

                    if (!animations || animations.length < 4) {

                        throw new Error(
                            'The Soldier model does not contain the expected animation clips.'
                        );

                    }

                    // Enable shadows
                    model.traverse(function (object) {

                        if (object.isMesh) {

                            object.castShadow = true;

                            object.receiveShadow = true;

                        }

                    });

                    console.log(
                        'Soldier animations:',
                        animations.map(function (clip, index) {
                            return {
                                index: index,
                                name: clip.name,
                                duration: clip.duration
                            };
                        })
                    );

                    // Set up initial scene
                    setupDefaultScene();

                    loadingElement.style.display = 'none';

                },

                function (xhr) {

                    if (xhr.total > 0) {

                        const percent = (
                            xhr.loaded / xhr.total * 100
                        ).toFixed(0);

                        loadingElement.textContent =
                            'Loading Soldier model... ' +
                            percent + '%';

                    }

                },

                function (error) {

                    console.error(
                        'Soldier model loading failed:',
                        error
                    );

                    showError(
                        'Unable to load Soldier.glb.\n\n' +
                        'Check your internet connection and browser console.\n\n' +
                        'Model URL:\n' + modelURL
                    );

                }

            );

        }


        // --------------------------------------------------
        // CLEAR CURRENT SCENE
        // --------------------------------------------------

        function clearScene() {

            // Stop all existing animation mixers
            for (const mixer of mixers) {

                mixer.stopAllAction();

            }

            mixers.length = 0;


            // Remove previous models and shared bones
            for (const object of objects) {

                scene.remove(object);

            }

            objects.length = 0;

        }


        // --------------------------------------------------
        // DEFAULT SCENE
        // --------------------------------------------------

        function setupDefaultScene() {

            if (!model || !animations) return;

            /*
                Three independent cloned models.

                Model 1 = Idle
                Model 2 = Run
                Model 3 = Walk

                Each model has its own skeleton
                and independent animation mixer.
            */


            const model1 =
                SkeletonUtils.clone(model);

            const model2 =
                SkeletonUtils.clone(model);

            const model3 =
                SkeletonUtils.clone(model);


            // Position
            model1.position.x = -2;

            model2.position.x = 0;

            model3.position.x = 2;


            // Shadows
            enableShadows(model1);
            enableShadows(model2);
            enableShadows(model3);


            // Independent animation mixers
            const mixer1 =
                new THREE.AnimationMixer(model1);

            const mixer2 =
                new THREE.AnimationMixer(model2);

            const mixer3 =
                new THREE.AnimationMixer(model3);


            // Idle animation
            mixer1.clipAction(
                animations[0]
            ).play();


            // Run animation
            mixer2.clipAction(
                animations[1]
            ).play();


            // Walk animation
            mixer3.clipAction(
                animations[3]
            ).play();


            // Add models to scene
            scene.add(
                model1,
                model2,
                model3
            );


            // Store objects
            objects.push(
                model1,
                model2,
                model3
            );


            // Store mixers
            mixers.push(
                mixer1,
                mixer2,
                mixer3
            );

        }


        // --------------------------------------------------
        // SHARED SKELETON SCENE
        // --------------------------------------------------

        function setupSharedSkeletonScene() {

            if (!model || !animations) return;

            /*
                Three skinned meshes share one skeleton.

                All three characters use the same
                animation mixer and animation state.
            */


            const sharedModel =
                SkeletonUtils.clone(model);


            // Find the skinned mesh
            const sharedSkinnedMesh =
                sharedModel.getObjectByName(
                    'vanguard_Mesh'
                );


            if (!sharedSkinnedMesh ||
                !sharedSkinnedMesh.isSkinnedMesh) {

                throw new Error(
                    'Could not find the vanguard_Mesh skinned mesh in Soldier.glb.'
                );

            }


            // Get shared skeleton
            const sharedSkeleton =
                sharedSkinnedMesh.skeleton;


            // Find hips bone
            const sharedParentBone =
                sharedModel.getObjectByName(
                    'mixamorigHips'
                );


            if (!sharedParentBone) {

                throw new Error(
                    'Could not find the mixamorigHips bone in Soldier.glb.'
                );

            }


            /*
                Keep the shared bones in the scene.

                The animation mixer operates on this
                shared bone hierarchy.
            */


            scene.add(sharedParentBone);


            // Create three skinned mesh clones
            const model1 =
                sharedSkinnedMesh.clone();

            const model2 =
                sharedSkinnedMesh.clone();

            const model3 =
                sharedSkinnedMesh.clone();


            // Use detached bind mode
            model1.bindMode = THREE.DetachedBindMode;

            model2.bindMode = THREE.DetachedBindMode;

            model3.bindMode = THREE.DetachedBindMode;


            // Bind all meshes to the same skeleton
            const identity = new THREE.Matrix4();

            model1.bind(sharedSkeleton, identity);

            model2.bind(sharedSkeleton, identity);

            model3.bind(sharedSkeleton, identity);


            // Position
            model1.position.x = -2;

            model2.position.x = 0;

            model3.position.x = 2;


            // Apply original glTF mesh transformation
            model1.scale.setScalar(0.01);

            model1.rotation.x = -Math.PI * 0.5;


            model2.scale.setScalar(0.01);

            model2.rotation.x = -Math.PI * 0.5;


            model3.scale.setScalar(0.01);

            model3.rotation.x = -Math.PI * 0.5;


            // Enable shadows
            model1.castShadow = true;
            model1.receiveShadow = true;

            model2.castShadow = true;
            model2.receiveShadow = true;

            model3.castShadow = true;
            model3.receiveShadow = true;


            // One mixer controls the shared skeleton
            const mixer =
                new THREE.AnimationMixer(sharedParentBone);


            // Run animation for all three meshes
            mixer.clipAction(
                animations[1]
            ).play();


            // Add objects to scene
            scene.add(
                model1,
                model2,
                model3
            );


            // Store objects for cleanup
            objects.push(
                sharedParentBone,
                model1,
                model2,
                model3
            );


            // Only one mixer is needed
            mixers.push(mixer);

        }


        // --------------------------------------------------
        // ENABLE SHADOWS
        // --------------------------------------------------

        function enableShadows(object) {

            object.traverse(function (child) {

                if (child.isMesh) {

                    child.castShadow = true;

                    child.receiveShadow = true;

                }

            });

        }


        // --------------------------------------------------
        // WINDOW RESIZE
        // --------------------------------------------------

        function onWindowResize() {

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 1.5)
            );

        }


        // --------------------------------------------------
        // ANIMATION LOOP
        // --------------------------------------------------

        function animate() {

            timer.update();

            const delta = timer.getDelta();

            for (const mixer of mixers) {

                mixer.update(delta);

            }

            renderer.render(scene, camera);

        }


        // --------------------------------------------------
        // ERROR DISPLAY
        // --------------------------------------------------

        function showError(message) {

            loadingElement.style.display = 'none';

            errorElement.style.display = 'block';

            errorElement.textContent = message;

        }

    </script>

</body>
</html>
