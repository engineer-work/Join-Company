
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Three.js - Shadow Map</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #59472b;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 1px 3px black;
        }

        #info a {
            color: #ffffff;
            pointer-events: auto;
        }

        canvas {
            display: block;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
        - shadow map - models by
        <a href="https://mirada.com/" target="_blank" rel="noopener">mirada</a>
        from
        <a href="https://rome.mrdoob.com" target="_blank" rel="noopener">rome</a>
        <br>
        Press T to toggle HUD
    </div>

    <script type="module">

        import * as THREE from "three";

        import Stats from "three/addons/libs/stats.module.js";

        import { OrbitControls } from
            "three/addons/controls/OrbitControls.js";

        import { GLTFLoader } from
            "three/addons/loaders/GLTFLoader.js";

        import { FontLoader } from
            "three/addons/loaders/FontLoader.js";

        import { TextGeometry } from
            "three/addons/geometries/TextGeometry.js";

        import { ShadowMapViewer } from
            "three/addons/utils/ShadowMapViewer.js";

        import * as SkeletonUtils from
            "three/addons/utils/SkeletonUtils.js";


        /* ==========================================
           CONFIGURATION
        ========================================== */

        const SHADOW_MAP_WIDTH = 2048;
        const SHADOW_MAP_HEIGHT = 1024;

        const FLOOR = -250;

        const NEAR = 10;
        const FAR = 3000;

        //const MODEL_BASE =
            //"https://cdn.jsdelivr.net/npm/three@0.183.0/examples/models/gltf/";

            const MODEL_BASE = "https://threejs.org/examples/models/gltf/";

        const FONT_URL =
            "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/fonts/helvetiker_bold.typeface.json";


        /* ==========================================
           GLOBAL VARIABLES
        ========================================== */

        let camera;
        let controls;
        let scene;
        let renderer;

        let container;
        let stats;

        let mixer;
        let light;
        let lightShadowMapViewer;

        let showHUD = false;

        const morphs = [];

        const timer = new THREE.Timer();

        // IMPORTANT:
        // Initialize loaders before init() is called.

        const gltfLoader = new GLTFLoader();
        const fontLoader = new FontLoader();


        /* ==========================================
           INITIALIZATION
        ========================================== */

        init();

        function init() {

            container = document.createElement("div");
            document.body.appendChild(container);


            // CAMERA

            camera = new THREE.PerspectiveCamera(
                23,
                window.innerWidth / window.innerHeight,
                NEAR,
                FAR
            );

            camera.position.set(700, 50, 1900);


            // SCENE

            scene = new THREE.Scene();

            scene.background = new THREE.Color(0x59472b);

            scene.fog = new THREE.Fog(
                0x59472b,
                1000,
                FAR
            );


            // LIGHTS

            const ambient = new THREE.AmbientLight(
                0xffffff,
                1
            );

            scene.add(ambient);

            light = new THREE.DirectionalLight(
                0xffffff,
                3
            );

            light.position.set(0, 1500, 1000);

            light.castShadow = true;

            light.shadow.camera.top = 2000;
            light.shadow.camera.bottom = -2000;
            light.shadow.camera.left = -2000;
            light.shadow.camera.right = 2000;

            light.shadow.camera.near = 1200;
            light.shadow.camera.far = 2500;

            light.shadow.bias = 0.0001;

            light.shadow.mapSize.width = SHADOW_MAP_WIDTH;
            light.shadow.mapSize.height = SHADOW_MAP_HEIGHT;

            scene.add(light);


            // SHADOW HUD

            createHUD();


            // SCENE OBJECTS

            createScene();


            // RENDERER

            renderer = new THREE.WebGLRenderer({
                antialias: true
            });

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 1.5)
            );

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.shadowMap.enabled = true;

            renderer.shadowMap.type = THREE.PCFShadowMap;

            renderer.outputColorSpace = THREE.SRGBColorSpace;

            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            renderer.toneMappingExposure = 1;

            renderer.autoClear = false;

            container.appendChild(renderer.domElement);


            // CONTROLS

            controls = new OrbitControls(
                camera,
                renderer.domElement
            );

            controls.enablePan = false;

            controls.maxPolarAngle = Math.PI / 2;

            controls.minDistance = 200;
            controls.maxDistance = 2200;

            controls.target.set(0, -75, 25);

            controls.update();


            // STATS

            stats = new Stats();

            // Uncomment to display performance statistics:
            // container.appendChild(stats.dom);


            // TIMER

            timer.connect(document);


            // EVENTS

            window.addEventListener(
                "resize",
                onWindowResize
            );

            window.addEventListener(
                "keydown",
                onKeyDown
            );


            // ANIMATION LOOP

            renderer.setAnimationLoop(animate);

        }


        /* ==========================================
           RESIZE
        ========================================== */

        function onWindowResize() {

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 1.5)
            );

            updateHUDPosition();

        }


        /* ==========================================
           KEYBOARD
        ========================================== */

        function onKeyDown(event) {

            if (event.key.toLowerCase() === "t") {

                showHUD = !showHUD;

            }

        }


        /* ==========================================
           SHADOW MAP HUD
        ========================================== */

        function createHUD() {

            lightShadowMapViewer =
                new ShadowMapViewer(light);

            lightShadowMapViewer.position.x = 10;

            lightShadowMapViewer.size.width =
                SHADOW_MAP_WIDTH / 4;

            lightShadowMapViewer.size.height =
                SHADOW_MAP_HEIGHT / 4;

            updateHUDPosition();

        }


        function updateHUDPosition() {

            if (!lightShadowMapViewer) return;

            lightShadowMapViewer.position.y =
                window.innerHeight -
                (SHADOW_MAP_HEIGHT / 4) -
                10;

            lightShadowMapViewer.update();

        }


        /* ==========================================
           CREATE SCENE
        ========================================== */

        function createScene() {


            // GROUND

            const geometry = new THREE.PlaneGeometry(
                100,
                100
            );

            const planeMaterial =
                new THREE.MeshPhongMaterial({
                    color: 0xffdd99
                });

            const ground = new THREE.Mesh(
                geometry,
                planeMaterial
            );

            ground.position.set(
                0,
                FLOOR,
                0
            );

            ground.rotation.x = -Math.PI / 2;

            ground.scale.set(100, 100, 100);

            ground.castShadow = false;

            ground.receiveShadow = true;

            scene.add(ground);


            // TEXT

            fontLoader.load(

                FONT_URL,

                function(font) {

                    const textGeo = new TextGeometry(
                        "THREE.JS",
                        {
                            font: font,

                            size: 200,

                            depth: 50,

                            curveSegments: 12,

                            bevelThickness: 2,

                            bevelSize: 5,

                            bevelEnabled: true
                        }
                    );

                    textGeo.computeBoundingBox();

                    const centerOffset =
                        -0.5 *
                        (
                            textGeo.boundingBox.max.x -
                            textGeo.boundingBox.min.x
                        );

                    const textMaterial =
                        new THREE.MeshPhongMaterial({
                            color: 0xff0000,
                            specular: 0xffffff
                        });

                    const mesh = new THREE.Mesh(
                        textGeo,
                        textMaterial
                    );

                    mesh.position.x = centerOffset;

                    mesh.position.y = FLOOR + 67;

                    mesh.castShadow = true;

                    mesh.receiveShadow = true;

                    scene.add(mesh);

                },

                undefined,

                function(error) {

                    console.error(
                        "Font loading error:",
                        error
                    );

                }

            );


            // CUBES

            const cubes1 = new THREE.Mesh(
                new THREE.BoxGeometry(
                    1500,
                    220,
                    150
                ),
                planeMaterial
            );

            cubes1.position.y = FLOOR - 50;

            cubes1.position.z = 20;

            cubes1.castShadow = true;

            cubes1.receiveShadow = true;

            scene.add(cubes1);


            const cubes2 = new THREE.Mesh(
                new THREE.BoxGeometry(
                    1600,
                    170,
                    250
                ),
                planeMaterial
            );

            cubes2.position.y = FLOOR - 50;

            cubes2.position.z = 20;

            cubes2.castShadow = true;

            cubes2.receiveShadow = true;

            scene.add(cubes2);


            // ANIMATION MIXER

            mixer = new THREE.AnimationMixer(scene);


            /* ======================================
               ADD ANIMATED MODEL
            ====================================== */

            function addMorph(
                originalRoot,
                clip,
                speed,
                duration,
                x,
                y,
                z,
                fudgeColor = false
            ) {

                // Correct cloning for animated/skinned models.
                const mesh = SkeletonUtils.clone(originalRoot);

                mesh.traverse(function(object) {

                    if (object.isMesh && object.material) {

                        object.material =
                            Array.isArray(object.material)
                                ? object.material.map(material => material.clone())
                                : object.material.clone();

                        object.castShadow = true;

                        object.receiveShadow = true;

                        if (fudgeColor) {

                            const materials = Array.isArray(object.material)
                                ? object.material
                                : [object.material];

                            for (const material of materials) {

                                if (material.color) {

                                    material.color.offsetHSL(
                                        0,
                                        Math.random() * 0.5 - 0.25,
                                        Math.random() * 0.5 - 0.25
                                    );

                                }

                            }

                        }

                    }

                });


                mesh.speed = speed;

                mesh.position.set(x, y, z);

                mesh.rotation.y = Math.PI / 2;


                // Independent animation action for this clone.

                const action = mixer.clipAction(
                    clip,
                    mesh
                );

                action.setDuration(duration);

                action.play();

                action.time = Math.random() * clip.duration;


                scene.add(mesh);

                morphs.push(mesh);

            }


            /* ======================================
               LOAD HORSES
            ====================================== */

            gltfLoader.load(

                MODEL_BASE + "Horse.glb",

                function(gltf) {

                    const root = gltf.scene;

                    const clip = gltf.animations[0];

                    if (!clip) {
                        console.warn("Horse animation not found.");
                        return;
                    }

                    addMorph(
                        root, clip, 550, 1,
                        100 - Math.random() * 1000,
                        FLOOR, 300, true
                    );

                    addMorph(
                        root, clip, 550, 1,
                        100 - Math.random() * 1000,
                        FLOOR, 450, true
                    );

                    addMorph(
                        root, clip, 550, 1,
                        100 - Math.random() * 1000,
                        FLOOR, 600, true
                    );

                    addMorph(
                        root, clip, 550, 1,
                        100 - Math.random() * 1000,
                        FLOOR, -300, true
                    );

                    addMorph(
                        root, clip, 550, 1,
                        100 - Math.random() * 1000,
                        FLOOR, -450, true
                    );

                    addMorph(
                        root, clip, 550, 1,
                        100 - Math.random() * 1000,
                        FLOOR, -600, true
                    );

                },

                undefined,

                function(error) {
                    console.error("Horse loading error:", error);
                }

            );


            /* ======================================
               LOAD FLAMINGO
            ====================================== */

            gltfLoader.load(

                MODEL_BASE + "Flamingo.glb",

                function(gltf) {

                    const root = gltf.scene;

                    const clip = gltf.animations[0];

                    if (!clip) return;

                    addMorph(
                        root,
                        clip,
                        500,
                        1,
                        500 - Math.random() * 500,
                        FLOOR + 350,
                        40
                    );

                },

                undefined,

                function(error) {
                    console.error("Flamingo loading error:", error);
                }

            );


            /* ======================================
               LOAD STORK
            ====================================== */

            gltfLoader.load(

                MODEL_BASE + "Stork.glb",

                function(gltf) {

                    const root = gltf.scene;

                    const clip = gltf.animations[0];

                    if (!clip) return;

                    addMorph(
                        root,
                        clip,
                        350,
                        1,
                        500 - Math.random() * 500,
                        FLOOR + 350,
                        340
                    );

                },

                undefined,

                function(error) {
                    console.error("Stork loading error:", error);
                }

            );


            /* ======================================
               LOAD PARROT
            ====================================== */

            gltfLoader.load(

                MODEL_BASE + "Parrot.glb",

                function(gltf) {

                    const root = gltf.scene;

                    const clip = gltf.animations[0];

                    if (!clip) return;

                    addMorph(
                        root,
                        clip,
                        450,
                        0.5,
                        500 - Math.random() * 500,
                        FLOOR + 300,
                        700
                    );

                },

                undefined,

                function(error) {
                    console.error("Parrot loading error:", error);
                }

            );

        }


        /* ==========================================
           ANIMATION
        ========================================== */

        function animate() {

            timer.update();

            render();

            stats.update();

        }


        /* ==========================================
           RENDER
        ========================================== */

        function render() {

            const delta = timer.getDelta();

            if (mixer) {

                mixer.update(delta);

            }


            // Move animated models.

            for (let i = 0; i < morphs.length; i++) {

                const morph = morphs[i];

                morph.position.x += morph.speed * delta;

                if (morph.position.x > 2000) {

                    morph.position.x =
                        -1000 - Math.random() * 500;

                }

            }


            controls.update(delta);


            // Main scene

            renderer.clear();

            renderer.render(scene, camera);


            // Shadow map HUD

            if (showHUD && lightShadowMapViewer) {

                lightShadowMapViewer.render(renderer);

            }

        }


        /* ==========================================
           CLEANUP
        ========================================== */

        window.addEventListener("pagehide", function() {

            renderer.setAnimationLoop(null);

            controls.dispose();

            renderer.dispose();

            timer.dispose();

        });

    </script>

</body>
</html>
