
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three.js - Mirror</title>

    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            color: #444;
        }

        #container {
            position: fixed;
            inset: 0;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            line-height: 1.5;
            pointer-events: none;
        }

        #info a {
            color: #08f;
            text-decoration: none;
            pointer-events: auto;
        }

        .lil-gui {
            z-index: 30 !important;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="container">

    <div id="info">
        <a href="https://threejs.org/" target="_blank" rel="noopener">
            three.js
        </a>
        - mirror
    </div>

</div>

<script type="module">

import * as THREE from 'three';

import { GUI } from
    'three/addons/libs/lil-gui.module.min.js';

import { OrbitControls } from
    'three/addons/controls/OrbitControls.js';

import { Reflector } from
    'three/addons/objects/Reflector.js';


// ======================================================
// VARIABLES
// ======================================================

let camera;
let scene;
let renderer;

let cameraControls;

let sphereGroup;
let smallSphere;

let groundMirror;
let verticalMirror;

let gui;

let resolutionScale = 0.6;

const size = new THREE.Vector2();

const container = document.getElementById('container');

let disposed = false;


// ======================================================
// INITIALIZATION
// ======================================================

function init() {

    // --------------------------------------------------
    // RENDERER
    // --------------------------------------------------

    renderer = new THREE.WebGLRenderer({

        antialias: true

    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    container.appendChild(renderer.domElement);


    // --------------------------------------------------
    // SCENE
    // --------------------------------------------------

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);


    // --------------------------------------------------
    // CAMERA
    // --------------------------------------------------

    camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        1,
        500
    );

    camera.position.set(0, 75, 160);


    // --------------------------------------------------
    // ORBIT CONTROLS
    // --------------------------------------------------

    cameraControls = new OrbitControls(
        camera,
        renderer.domElement
    );

    cameraControls.target.set(0, 40, 0);

    cameraControls.maxDistance = 400;

    cameraControls.minDistance = 10;

    cameraControls.enableDamping = true;

    cameraControls.dampingFactor = 0.05;

    cameraControls.update();


    // --------------------------------------------------
    // MIRROR RENDER TARGET SIZE
    // --------------------------------------------------

    renderer.getDrawingBufferSize(size);

    size.multiplyScalar(resolutionScale).round();


    // --------------------------------------------------
    // FLOOR GEOMETRY
    // --------------------------------------------------

    const planeGeo = new THREE.PlaneGeometry(
        100.1,
        100.1
    );


    // --------------------------------------------------
    // GROUND MIRROR
    // --------------------------------------------------

    const groundGeometry = new THREE.CircleGeometry(
        40,
        64
    );

    groundMirror = new Reflector(
        groundGeometry,
        {
            clipBias: 0.003,

            textureWidth: size.width,

            textureHeight: size.height,

            color: 0xb5b5b5
        }
    );

    groundMirror.position.y = 0.5;

    groundMirror.rotateX(-Math.PI / 2);

    scene.add(groundMirror);


    // --------------------------------------------------
    // VERTICAL MIRROR
    // --------------------------------------------------

    const verticalGeometry = new THREE.PlaneGeometry(
        100,
        100
    );

    verticalMirror = new Reflector(
        verticalGeometry,
        {
            clipBias: 0.003,

            textureWidth: size.width,

            textureHeight: size.height,

            color: 0xc1cbcb
        }
    );

    verticalMirror.position.y = 50;

    verticalMirror.position.z = -50;

    scene.add(verticalMirror);


    // --------------------------------------------------
    // REFLECTIVE LARGE OBJECT
    // --------------------------------------------------

    sphereGroup = new THREE.Object3D();

    scene.add(sphereGroup);


    // Sphere cap geometry

    let geometry = new THREE.CylinderGeometry(

        0.1,

        15 * Math.cos(Math.PI / 180 * 30),

        0.1,

        24,

        1

    );

    const sphereMaterial = new THREE.MeshPhongMaterial({

        color: 0xffffff,

        emissive: 0x8d8d8d

    });

    const sphereCap = new THREE.Mesh(
        geometry,
        sphereMaterial
    );

    sphereCap.position.y =
        -15 * Math.sin(Math.PI / 180 * 30) - 0.05;

    sphereCap.rotateX(-Math.PI);


    // Half sphere

    geometry = new THREE.SphereGeometry(

        15,

        24,

        24,

        Math.PI / 2,

        Math.PI * 2,

        0,

        Math.PI / 180 * 120

    );

    const halfSphere = new THREE.Mesh(
        geometry,
        sphereMaterial
    );

    halfSphere.add(sphereCap);

    halfSphere.rotateX(-Math.PI / 180 * 135);

    halfSphere.rotateZ(-Math.PI / 180 * 20);

    halfSphere.position.y =
        7.5 + 15 * Math.sin(Math.PI / 180 * 30);

    sphereGroup.add(halfSphere);


    // --------------------------------------------------
    // SMALL MOVING SPHERE
    // --------------------------------------------------

    geometry = new THREE.IcosahedronGeometry(5, 0);

    const smallSphereMaterial = new THREE.MeshPhongMaterial({

        color: 0xffffff,

        emissive: 0x7b7b7b,

        flatShading: true

    });

    smallSphere = new THREE.Mesh(
        geometry,
        smallSphereMaterial
    );

    scene.add(smallSphere);


    // --------------------------------------------------
    // ROOM WALLS
    // --------------------------------------------------

    // Top wall

    const planeTop = new THREE.Mesh(
        planeGeo,
        new THREE.MeshPhongMaterial({
            color: 0xffffff
        })
    );

    planeTop.position.y = 100;

    planeTop.rotateX(Math.PI / 2);

    scene.add(planeTop);


    // Bottom wall

    const planeBottom = new THREE.Mesh(
        planeGeo,
        new THREE.MeshPhongMaterial({
            color: 0xffffff
        })
    );

    planeBottom.rotateX(-Math.PI / 2);

    scene.add(planeBottom);


    // Front wall

    const planeFront = new THREE.Mesh(
        planeGeo,
        new THREE.MeshPhongMaterial({
            color: 0x7f7fff
        })
    );

    planeFront.position.z = 50;

    planeFront.position.y = 50;

    planeFront.rotateY(Math.PI);

    scene.add(planeFront);


    // Right wall

    const planeRight = new THREE.Mesh(
        planeGeo,
        new THREE.MeshPhongMaterial({
            color: 0x00ff00
        })
    );

    planeRight.position.x = 50;

    planeRight.position.y = 50;

    planeRight.rotateY(-Math.PI / 2);

    scene.add(planeRight);


    // Left wall

    const planeLeft = new THREE.Mesh(
        planeGeo,
        new THREE.MeshPhongMaterial({
            color: 0xff0000
        })
    );

    planeLeft.position.x = -50;

    planeLeft.position.y = 50;

    planeLeft.rotateY(Math.PI / 2);

    scene.add(planeLeft);


    // --------------------------------------------------
    // LIGHTING
    // --------------------------------------------------

    const mainLight = new THREE.PointLight(
        0xe7e7e7,
        2.5,
        250,
        0
    );

    mainLight.position.y = 60;

    scene.add(mainLight);


    const greenLight = new THREE.PointLight(
        0x00ff00,
        0.5,
        1000,
        0
    );

    greenLight.position.set(550, 50, 0);

    scene.add(greenLight);


    const redLight = new THREE.PointLight(
        0xff0000,
        0.5,
        1000,
        0
    );

    redLight.position.set(-550, 50, 0);

    scene.add(redLight);


    const blueLight = new THREE.PointLight(
        0xbbbbfe,
        0.5,
        1000,
        0
    );

    blueLight.position.set(0, 50, 550);

    scene.add(blueLight);


    // --------------------------------------------------
    // GUI
    // --------------------------------------------------

    initGUI();


    // --------------------------------------------------
    // EVENTS
    // --------------------------------------------------

    window.addEventListener(
        'resize',
        onWindowResize
    );


    // --------------------------------------------------
    // ANIMATION
    // --------------------------------------------------

    renderer.setAnimationLoop(animate);

}


// ======================================================
// GUI
// ======================================================

function initGUI() {

    const params = {

        resolution: resolutionScale

    };

    gui = new GUI();

    const folder = gui.addFolder('Mirrors');

    folder.add(
        params,
        'resolution',
        0.2,
        1,
        0.1
    )
    .name('Resolution')
    .onChange(value => {

        resolutionScale = value;

        resizeMirrors();

    });

    folder.open();

}


// ======================================================
// RESIZE MIRROR TEXTURES
// ======================================================

function resizeMirrors() {

    if (!renderer || !groundMirror || !verticalMirror) {
        return;
    }

    renderer.getDrawingBufferSize(size);

    size.multiplyScalar(resolutionScale).round();

    const width = Math.max(1, size.width);

    const height = Math.max(1, size.height);

    groundMirror.getRenderTarget().setSize(
        width,
        height
    );

    verticalMirror.getRenderTarget().setSize(
        width,
        height
    );

}


// ======================================================
// WINDOW RESIZE
// ======================================================

function onWindowResize() {

    if (!camera || !renderer) return;

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    resizeMirrors();

}


// ======================================================
// ANIMATION
// ======================================================

function animate() {

    if (disposed) return;

    const timer = performance.now() * 0.01;

    // Rotate the large reflective object.

    sphereGroup.rotation.y -= 0.002;


    // Move the small sphere.

    smallSphere.position.set(

        Math.cos(timer * 0.1) * 30,

        Math.abs(Math.cos(timer * 0.2)) * 20 + 5,

        Math.sin(timer * 0.1) * 30

    );

    smallSphere.rotation.y =
        Math.PI / 2 - timer * 0.1;

    smallSphere.rotation.z =
        timer * 0.8;


    cameraControls.update();

    renderer.render(scene, camera);

}


// ======================================================
// CLEANUP
// ======================================================

function cleanup() {

    disposed = true;

    window.removeEventListener(
        'resize',
        onWindowResize
    );

    if (renderer) {

        renderer.setAnimationLoop(null);

    }

    if (cameraControls) {

        cameraControls.dispose();

    }

    if (gui) {

        gui.destroy();

    }

    if (scene) {

        const geometries = new Set();

        const materials = new Set();

        const textures = new Set();

        scene.traverse(object => {

            if (object.geometry) {
                geometries.add(object.geometry);
            }

            if (object.material) {

                const list = Array.isArray(object.material)
                    ? object.material
                    : [object.material];

                list.forEach(material => {

                    materials.add(material);

                    for (const value of Object.values(material)) {

                        if (value && value.isTexture) {
                            textures.add(value);
                        }

                    }

                });

            }

        });

        geometries.forEach(geometry => geometry.dispose());

        materials.forEach(material => material.dispose());

        textures.forEach(texture => texture.dispose());

    }

    if (renderer) {

        renderer.dispose();

    }

}

window.addEventListener(
    'pagehide',
    cleanup,
    { once: true }
);


// ======================================================
// START
// ======================================================

try {

    init();

} catch (error) {

    console.error('Mirror initialization error:', error);

}

</script>

</body>
</html>
