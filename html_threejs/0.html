
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js - Octree World + Animated Soldier</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #88ccee;
        }

        #container {
            width: 100%;
            height: 100vh;
        }

        #info {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            padding: 12px 16px;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 8px;
            line-height: 1.7;
            pointer-events: none;
        }

        #status {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 10;
            padding: 8px 12px;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 6px;
        }

        canvas { display: block; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="info">
        <strong>Three.js Octree World + Animated Soldier</strong><br>
        Click inside the scene to capture mouse<br>
        WASD / Arrow Keys - Move<br>
        SHIFT - Run<br>
        SPACE - Jump<br>
        Mouse - Rotate camera<br>
        Hold left mouse button - Throw ball<br>
        ESC - Release mouse
    </div>

    <div id="container"></div>
    <div id="status">Loading collision world...</div>

    <script type="module">
        // =====================================================
        // IMPORTS
        // =====================================================

        import * as THREE from 'three';
        import Stats from 'three/addons/libs/stats.module.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { Octree } from 'three/addons/math/Octree.js';
        import { OctreeHelper } from 'three/addons/helpers/OctreeHelper.js';
        import { Capsule } from 'three/addons/math/Capsule.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';


        // =====================================================
        // DOM
        // =====================================================

        const container = document.getElementById('container');
        const status = document.getElementById('status');


        // =====================================================
        // CONSTANTS
        // =====================================================

        const GRAVITY = 30;

        const NUM_SPHERES = 100;
        const SPHERE_RADIUS = 0.2;

        const STEPS_PER_FRAME = 5;

        const WALK_SPEED = 4;
        const RUN_SPEED = 8;
        const JUMP_SPEED = 15;

        // Third-person camera settings.
        const CAMERA_DISTANCE = 4.5;
        const CAMERA_HEIGHT = 1.3;
        const CAMERA_SENSITIVITY = 0.0025;
        const CAMERA_MIN_PITCH = -0.65;
        const CAMERA_MAX_PITCH = 0.85;

        // Keep the camera slightly in front of a wall.
        const CAMERA_COLLISION_PADDING = 0.25;
        const CAMERA_MIN_DISTANCE = 0.08;


        // =====================================================
        // TIMER
        // =====================================================

        const timer = new THREE.Timer();
        timer.connect(document);


        // =====================================================
        // SCENE
        // =====================================================

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x88ccee);
        scene.fog = new THREE.Fog(0x88ccee, 0, 50);


        // =====================================================
        // CAMERA
        // =====================================================

        const camera = new THREE.PerspectiveCamera(
            70,
            window.innerWidth / window.innerHeight,
            0.05,
            1000
        );

        camera.rotation.order = 'YXZ';
        camera.position.set(0, 2, 5);

        // Camera orbit angles.
        let cameraYaw = 0;
        let cameraPitch = 0;

        // Camera collision and positioning vectors.
        const cameraTarget = new THREE.Vector3();
        const cameraOffset = new THREE.Vector3();
        const cameraDirection = new THREE.Vector3();
        const cameraRay = new THREE.Ray();

        let worldLoaded = false;


        // =====================================================
        // LIGHTING
        // =====================================================

        const fillLight = new THREE.HemisphereLight(
            0x8dc1de,
            0x00668d,
            1.5
        );

        fillLight.position.set(2, 1, 1);
        scene.add(fillLight);


        const directionalLight = new THREE.DirectionalLight(
            0xffffff,
            2.5
        );

        directionalLight.position.set(-5, 25, -1);
        directionalLight.castShadow = true;

        directionalLight.shadow.camera.near = 0.01;
        directionalLight.shadow.camera.far = 500;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;

        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        directionalLight.shadow.radius = 4;
        directionalLight.shadow.bias = -0.00006;

        scene.add(directionalLight);


        // =====================================================
        // RENDERER
        // =====================================================

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.VSMShadowMap;

        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;

        container.appendChild(renderer.domElement);


        // =====================================================
        // PERFORMANCE STATS
        // =====================================================

        const stats = new Stats();

        stats.domElement.style.position = 'absolute';
        stats.domElement.style.top = '0px';
        stats.domElement.style.left = '0px';

        container.appendChild(stats.domElement);


        // =====================================================
        // SPHERES
        // =====================================================

        const sphereGeometry = new THREE.IcosahedronGeometry(
            SPHERE_RADIUS,
            5
        );

        const sphereMaterial = new THREE.MeshLambertMaterial({
            color: 0xdede8d
        });

        const spheres = [];
        let sphereIdx = 0;

        for (let i = 0; i < NUM_SPHERES; i++) {
            const sphere = new THREE.Mesh(
                sphereGeometry,
                sphereMaterial
            );

            sphere.castShadow = true;
            sphere.receiveShadow = true;

            scene.add(sphere);

            spheres.push({
                mesh: sphere,

                collider: new THREE.Sphere(
                    new THREE.Vector3(0, -100, 0),
                    SPHERE_RADIUS
                ),

                velocity: new THREE.Vector3()
            });
        }


        // =====================================================
        // COLLISION WORLD
        // =====================================================

        const worldOctree = new Octree();


        // =====================================================
        // PLAYER COLLIDER
        // =====================================================

        const playerCollider = new Capsule(
            new THREE.Vector3(0, 0.35, 0),
            new THREE.Vector3(0, 1, 0),
            0.35
        );

        const playerVelocity = new THREE.Vector3();
        const playerDirection = new THREE.Vector3();

        let playerOnFloor = false;
        let mouseTime = 0;


        // =====================================================
        // SOLDIER CHARACTER
        // =====================================================

        const characterLoader = new GLTFLoader();

        const characterRoot = new THREE.Group();
        scene.add(characterRoot);

        let soldier = null;
        let soldierMixer = null;
        let soldierLoaded = false;
        let activeSoldierAction = null;

        const soldierActions = {};

        const soldierMoveDirection = new THREE.Vector3();


        // =====================================================
        // LOAD SOLDIER GLB
        // =====================================================

        const SOLDIER_MODEL_URL =
            'https://threejs.org/examples/models/gltf/Soldier.glb';

        characterLoader.load(
            SOLDIER_MODEL_URL,

            (gltf) => {
                soldier = gltf.scene;

                soldier.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                soldier.scale.set(1, 1, 1);

                // Keep the original Soldier model orientation.
                //soldier.rotation.y = Math.PI;

                characterRoot.add(soldier);

                soldierMixer = new THREE.AnimationMixer(soldier);

                gltf.animations.forEach((clip) => {
                    const action = soldierMixer.clipAction(clip);
                    soldierActions[clip.name.toLowerCase()] = action;
                });

                soldierLoaded = true;

                playSoldierAnimation('idle');

                status.textContent =
                    'Soldier loaded. Click to play.';

                console.log(
                    'Soldier loaded:',
                    gltf.animations.map(clip => clip.name)
                );
            },

            (xhr) => {
                if (xhr.total > 0) {
                    const percent = (
                        xhr.loaded / xhr.total * 100
                    ).toFixed(0);

                    status.textContent =
                        `Loading Soldier: ${percent}%`;
                }
            },

            (error) => {
                console.error('Soldier loading failed:', error);

                status.textContent =
                    'Soldier failed to load. Check browser console.';
            }
        );


        // =====================================================
        // SOLDIER ANIMATION SWITCHING
        // =====================================================

        function playSoldierAnimation(name) {
            if (!soldierMixer) return;

            const nextAction =
                soldierActions[name.toLowerCase()];

            if (!nextAction) {
                console.warn(
                    `Animation "${name}" was not found.`,
                    Object.keys(soldierActions)
                );
                return;
            }

            if (activeSoldierAction === nextAction) return;

            nextAction.reset();
            nextAction.enabled = true;

            nextAction.setEffectiveTimeScale(1);
            nextAction.setEffectiveWeight(1);

            nextAction.fadeIn(0.2);
            nextAction.play();

            if (activeSoldierAction) {
                activeSoldierAction.fadeOut(0.2);
            }

            activeSoldierAction = nextAction;
        }


        // =====================================================
        // INPUT
        // =====================================================

        const keyStates = {};

        document.addEventListener('keydown', (event) => {
            keyStates[event.code] = true;

            if (
                event.code === 'Space' ||
                event.code.startsWith('Arrow')
            ) {
                event.preventDefault();
            }
        });

        document.addEventListener('keyup', (event) => {
            keyStates[event.code] = false;
        });


        // =====================================================
        // POINTER LOCK
        // =====================================================

        container.addEventListener('mousedown', (event) => {
            if (
                document.pointerLockElement !== document.body
            ) {
                document.body.requestPointerLock();
            }

            if (event.button === 0) {
                mouseTime = performance.now();
            }
        });

        document.addEventListener('mouseup', (event) => {
            if (
                event.button === 0 &&
                document.pointerLockElement === document.body
            ) {
                throwBall();
            }
        });


        // =====================================================
        // THIRD-PERSON MOUSE CAMERA CONTROL
        // =====================================================

        document.body.addEventListener('mousemove', (event) => {
            if (
                document.pointerLockElement !== document.body
            ) {
                return;
            }

            cameraYaw -=
                event.movementX * CAMERA_SENSITIVITY;

            cameraPitch -=
                event.movementY * CAMERA_SENSITIVITY;

            cameraPitch = THREE.MathUtils.clamp(
                cameraPitch,
                CAMERA_MIN_PITCH,
                CAMERA_MAX_PITCH
            );
        });


        // =====================================================
        // RESIZE
        // =====================================================

        window.addEventListener('resize', onWindowResize);

        function onWindowResize() {
            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }


        // =====================================================
        // THROW BALL
        // =====================================================

        function throwBall() {
            const sphere = spheres[sphereIdx];

            camera.getWorldDirection(playerDirection);

            sphere.collider.center
                .copy(playerCollider.end)
                .addScaledVector(
                    playerDirection,
                    playerCollider.radius * 1.5
                );

            const holdDuration = Math.max(
                0,
                performance.now() - mouseTime
            );

            const impulse = 15 + 30 * (
                1 - Math.exp(-holdDuration * 0.001)
            );

            sphere.velocity
                .copy(playerDirection)
                .multiplyScalar(impulse);

            sphere.velocity.addScaledVector(
                playerVelocity,
                2
            );

            sphereIdx = (
                sphereIdx + 1
            ) % spheres.length;
        }


        // =====================================================
        // PLAYER COLLISIONS
        // =====================================================

        function playerCollisions() {
            const result = worldOctree.capsuleIntersect(
                playerCollider
            );

            playerOnFloor = false;

            if (result) {
                playerOnFloor = result.normal.y >= 0.15;

                if (!playerOnFloor) {
                    playerVelocity.addScaledVector(
                        result.normal,
                        -result.normal.dot(playerVelocity)
                    );
                }

                if (result.depth >= 1e-10) {
                    playerCollider.translate(
                        result.normal.multiplyScalar(
                            result.depth
                        )
                    );
                }
            }
        }


        // =====================================================
        // UPDATE PLAYER COLLIDER
        // =====================================================

        function updatePlayer(deltaTime) {
            let damping = Math.exp(
                -4 * deltaTime
            ) - 1;

            if (!playerOnFloor) {
                playerVelocity.y -= GRAVITY * deltaTime;
                damping *= 0.1;
            }

            playerVelocity.addScaledVector(
                playerVelocity,
                damping
            );

            const deltaPosition = playerVelocity
                .clone()
                .multiplyScalar(deltaTime);

            playerCollider.translate(deltaPosition);

            playerCollisions();
        }


        // =====================================================
        // PLAYER-SPHERE COLLISION
        // =====================================================

        const vector1 = new THREE.Vector3();
        const vector2 = new THREE.Vector3();
        const vector3 = new THREE.Vector3();

        function playerSphereCollision(sphere) {
            const center = new THREE.Vector3()
                .addVectors(
                    playerCollider.start,
                    playerCollider.end
                )
                .multiplyScalar(0.5);

            const sphereCenter = sphere.collider.center;

            const radius =
                playerCollider.radius +
                sphere.collider.radius;

            const radiusSquared = radius * radius;

            for (const point of [
                playerCollider.start,
                playerCollider.end,
                center
            ]) {
                const distanceSquared =
                    point.distanceToSquared(sphereCenter);

                if (distanceSquared < radiusSquared) {
                    const normal = vector1
                        .subVectors(point, sphereCenter)
                        .normalize();

                    const v1 = vector2
                        .copy(normal)
                        .multiplyScalar(
                            normal.dot(playerVelocity)
                        );

                    const v2 = vector3
                        .copy(normal)
                        .multiplyScalar(
                            normal.dot(sphere.velocity)
                        );

                    playerVelocity.add(v2).sub(v1);
                    sphere.velocity.add(v1).sub(v2);

                    const distance = (
                        radius - Math.sqrt(distanceSquared)
                    ) / 2;

                    sphereCenter.addScaledVector(
                        normal,
                        -distance
                    );
                }
            }
        }


        // =====================================================
        // SPHERE-SPHERE COLLISIONS
        // =====================================================

        function spheresCollisions() {
            for (
                let i = 0, length = spheres.length;
                i < length;
                i++
            ) {
                const s1 = spheres[i];

                for (let j = i + 1; j < length; j++) {
                    const s2 = spheres[j];

                    const distanceSquared =
                        s1.collider.center.distanceToSquared(
                            s2.collider.center
                        );

                    const radius =
                        s1.collider.radius +
                        s2.collider.radius;

                    const radiusSquared = radius * radius;

                    if (distanceSquared < radiusSquared) {
                        const normal = vector1
                            .subVectors(
                                s1.collider.center,
                                s2.collider.center
                            )
                            .normalize();

                        const v1 = vector2
                            .copy(normal)
                            .multiplyScalar(
                                normal.dot(s1.velocity)
                            );

                        const v2 = vector3
                            .copy(normal)
                            .multiplyScalar(
                                normal.dot(s2.velocity)
                            );

                        s1.velocity.add(v2).sub(v1);
                        s2.velocity.add(v1).sub(v2);

                        const distance = (
                            radius - Math.sqrt(distanceSquared)
                        ) / 2;

                        s1.collider.center.addScaledVector(
                            normal,
                            distance
                        );

                        s2.collider.center.addScaledVector(
                            normal,
                            -distance
                        );
                    }
                }
            }
        }


        // =====================================================
        // UPDATE SPHERES
        // =====================================================

        function updateSpheres(deltaTime) {
            spheres.forEach((sphere) => {
                sphere.collider.center.addScaledVector(
                    sphere.velocity,
                    deltaTime
                );

                const result = worldOctree.sphereIntersect(
                    sphere.collider
                );

                if (result) {
                    sphere.velocity.addScaledVector(
                        result.normal,
                        -result.normal.dot(sphere.velocity) * 1.5
                    );

                    sphere.collider.center.add(
                        result.normal.multiplyScalar(result.depth)
                    );
                } else {
                    sphere.velocity.y -= GRAVITY * deltaTime;
                }

                const damping = Math.exp(
                    -1.5 * deltaTime
                ) - 1;

                sphere.velocity.addScaledVector(
                    sphere.velocity,
                    damping
                );

                playerSphereCollision(sphere);
            });

            spheresCollisions();

            for (const sphere of spheres) {
                sphere.mesh.position.copy(
                    sphere.collider.center
                );
            }
        }


        // =====================================================
        // MOVEMENT DIRECTIONS
        // =====================================================

        // Forward follows the horizontal camera direction.
        // At yaw = 0, forward is toward negative Z.

        function getForwardVector() {
            playerDirection.set(
                -Math.sin(cameraYaw),
                0,
                -Math.cos(cameraYaw)
            );

            return playerDirection;
        }


        // Right follows the camera's horizontal right direction.

        function getSideVector() {
            playerDirection.set(
                Math.cos(cameraYaw),
                0,
                -Math.sin(cameraYaw)
            );

            return playerDirection;
        }


        // =====================================================
        // PLAYER CONTROLS
        // =====================================================

        function controls(deltaTime) {
            const running =
                keyStates['ShiftLeft'] ||
                keyStates['ShiftRight'];

            const movementMultiplier =
                running ? 1.7 : 1;

            const speedDelta = deltaTime *
                (playerOnFloor ? 25 : 8) *
                movementMultiplier;


            // Forward.
            if (
                keyStates['KeyW'] ||
                keyStates['ArrowUp']
            ) {
                playerVelocity.add(
                    getForwardVector().multiplyScalar(speedDelta)
                );
            }


            // Backward.
            if (
                keyStates['KeyS'] ||
                keyStates['ArrowDown']
            ) {
                playerVelocity.add(
                    getForwardVector().multiplyScalar(-speedDelta)
                );
            }


            // Left.
            if (
                keyStates['KeyA'] ||
                keyStates['ArrowLeft']
            ) {
                playerVelocity.add(
                    getSideVector().multiplyScalar(-speedDelta)
                );
            }


            // Right.
            if (
                keyStates['KeyD'] ||
                keyStates['ArrowRight']
            ) {
                playerVelocity.add(
                    getSideVector().multiplyScalar(speedDelta)
                );
            }


            // Jump.
            if (
                playerOnFloor &&
                keyStates['Space']
            ) {
                playerVelocity.y = JUMP_SPEED;
                playerOnFloor = false;
            }
        }


        // =====================================================
        // UPDATE SOLDIER CHARACTER
        // =====================================================

        function updateSoldier() {
            if (!soldierLoaded || !soldier) return;

            characterRoot.position.set(
                playerCollider.start.x,
                playerCollider.start.y -
                    playerCollider.radius,
                playerCollider.start.z
            );

            soldierMoveDirection.set(
                playerVelocity.x,
                0,
                playerVelocity.z
            );

            const horizontalSpeed =
                soldierMoveDirection.length();

            if (horizontalSpeed > 0.15) {
                soldierMoveDirection.normalize();

                // Soldier.glb has a local 180-degree rotation.
                // Subtract PI to make its visible front face
                // the actual direction of movement.
                characterRoot.rotation.y =
                    Math.atan2(
                        soldierMoveDirection.x,
                        soldierMoveDirection.z
                    ) - Math.PI;

                const running =
                    keyStates['ShiftLeft'] ||
                    keyStates['ShiftRight'];

                if (running) {
                    playSoldierAnimation('run');
                } else {
                    playSoldierAnimation('walk');
                }
            } else {
                playSoldierAnimation('idle');
            }
        }


        // =====================================================
        // THIRD-PERSON CAMERA WITH OCTREE COLLISION
        // =====================================================

        function updateThirdPersonCamera() {
            // The camera looks toward the upper part of the player.
            cameraTarget.copy(playerCollider.end);

            // Desired camera orbit offset.
            const horizontalDistance =
                Math.cos(cameraPitch) * CAMERA_DISTANCE;

            cameraOffset.set(
                Math.sin(cameraYaw) * horizontalDistance,
                CAMERA_HEIGHT +
                    Math.sin(cameraPitch) * CAMERA_DISTANCE,
                Math.cos(cameraYaw) * horizontalDistance
            );

            // Desired camera position before collision checking.
            const desiredPosition = cameraTarget
                .clone()
                .add(cameraOffset);

            // Direction from player target to desired camera position.
            cameraDirection
                .subVectors(desiredPosition, cameraTarget);

            const desiredDistance = cameraDirection.length();

            if (desiredDistance > 0) {
                cameraDirection.normalize();
            }

            let safeDistance = desiredDistance;

            // IMPORTANT:
            // Check the camera path against the world Octree.
            // If a wall is between the player and camera,
            // shorten the camera distance before the wall.
            if (worldLoaded) {
                cameraRay.origin.copy(cameraTarget);
                cameraRay.direction.copy(cameraDirection);

                const hit = worldOctree.rayIntersect(cameraRay);

                if (hit) {
                    safeDistance = Math.min(
                        desiredDistance,
                        hit.distance - CAMERA_COLLISION_PADDING
                    );

                    safeDistance = Math.max(
                        CAMERA_MIN_DISTANCE,
                        safeDistance
                    );
                }
            }

            // Place camera at the collision-safe position.
            camera.position
                .copy(cameraTarget)
                .addScaledVector(cameraDirection, safeDistance);

            // Always look back at the player.
            camera.lookAt(cameraTarget);
        }


        // =====================================================
        // LOAD COLLISION WORLD
        // =====================================================

        const worldLoader = new GLTFLoader();

        const MODEL_URL =
            'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r180/examples/models/gltf/collision-world.glb';

        worldLoader.load(
            MODEL_URL,

            (gltf) => {
                scene.add(gltf.scene);

                // Build collision Octree.
                worldOctree.fromGraphNode(gltf.scene);

                gltf.scene.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        if (child.material.map) {
                            child.material.map.anisotropy =
                                renderer.capabilities.getMaxAnisotropy();
                        }
                    }
                });

                // Octree debug helper.
                const helper = new OctreeHelper(worldOctree);
                helper.visible = false;
                scene.add(helper);

                // Debug GUI.
                const gui = new GUI({ width: 200 });

                const debugOptions = {
                    debug: false
                };

                gui.add(
                    debugOptions,
                    'debug'
                ).onChange((value) => {
                    helper.visible = value;
                });

                worldLoaded = true;

                status.textContent =
                    'Collision world loaded. Click to play.';

                console.log('Collision world loaded successfully.');
            },

            (xhr) => {
                if (xhr.total > 0) {
                    const percent = (
                        xhr.loaded / xhr.total * 100
                    ).toFixed(0);

                    status.textContent =
                        `Loading world: ${percent}%`;
                }
            },

            (error) => {
                console.error(
                    'World GLB loading failed:',
                    error
                );

                status.textContent =
                    'World loading failed. Check browser console.';
            }
        );


        // =====================================================
        // OUT-OF-BOUNDS TELEPORT
        // =====================================================

        function teleportPlayerIfOob() {
            if (playerCollider.end.y <= -25) {
                playerCollider.start.set(0, 0.35, 0);
                playerCollider.end.set(0, 1, 0);

                playerVelocity.set(0, 0, 0);

                cameraYaw = 0;
                cameraPitch = 0;

                camera.position.copy(playerCollider.end);
                camera.rotation.set(0, 0, 0);
            }
        }


        // =====================================================
        // ANIMATION LOOP
        // =====================================================

        function animate() {
            timer.update();

            const frameDelta = Math.min(
                0.05,
                timer.getDelta()
            );

            const deltaTime =
                frameDelta / STEPS_PER_FRAME;

            for (
                let i = 0;
                i < STEPS_PER_FRAME;
                i++
            ) {
                controls(deltaTime);

                updatePlayer(deltaTime);

                updateSpheres(deltaTime);

                teleportPlayerIfOob();
            }

            // Update Soldier skeletal animation.
            if (soldierMixer) {
                soldierMixer.update(frameDelta);
            }

            // Sync Soldier with player capsule.
            updateSoldier();

            // Follow player and prevent camera passing through walls.
            updateThirdPersonCamera();

            renderer.render(scene, camera);

            stats.update();
        }


        // =====================================================
        // START
        // =====================================================

        renderer.setAnimationLoop(animate);

    </script>
</body>
</html>
