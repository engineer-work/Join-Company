
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three.js WebGPU - Caustics</title>

    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101010;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 18px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 1px 4px #000;
        }

        #info a {
            color: #fff;
            text-decoration: none;
            pointer-events: auto;
        }

        #info .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        #info small {
            color: #ccc;
            font-size: 12px;
        }

        #status {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: 85%;
            text-align: center;
            line-height: 1.6;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            padding: 16px 22px;
            border-radius: 8px;
            z-index: 20;
        }

        #status.hidden {
            display: none;
        }

        .lil-gui {
            --width: 280px;
            z-index: 30 !important;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
            "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
            "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.tsl.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="info">
        <div class="title">
            <a href="https://threejs.org/" target="_blank" rel="noopener">
                three.js
            </a>
            - Caustics
        </div>
        <small>Realtime caustics effect</small>
    </div>

    <div id="status">
        Checking WebGPU support...
    </div>

    <script type="module">

        import * as THREE from 'three/webgpu';

        import {
            uniform,
            refract,
            div,
            positionViewDirection,
            positionLocal,
            normalView,
            texture,
            Fn,
            vec2,
            vec3,
            vec4
        } from 'three/tsl';

        import { OrbitControls } from
            'three/addons/controls/OrbitControls.js';

        import { GLTFLoader } from
            'three/addons/loaders/GLTFLoader.js';

        import { DRACOLoader } from
            'three/addons/loaders/DRACOLoader.js';

        import { GUI } from
            'three/addons/libs/lil-gui.module.min.js';


        // =====================================================
        // CONFIGURATION
        // =====================================================

        const BASE_URL = 'https://threejs.org/examples/';

        const MODEL_URL =
            BASE_URL + 'models/gltf/duck.glb';

        const DRACO_PATH =
            'https://www.gstatic.com/draco/versioned/decoders/1.5.7/';

        const CAUSTIC_TEXTURE_URL =
            BASE_URL + 'textures/opengameart/Caustic_Free.jpg';

        const COLOR_TEXTURE_URL =
            BASE_URL + 'textures/colors.png';

        const GROUND_TEXTURE_URL =
            BASE_URL + 'textures/hardwood2_diffuse.jpg';


        // =====================================================
        // VARIABLES
        // =====================================================

        let camera;
        let scene;
        let renderer;
        let controls;
        let gui;

        let duckRoot;
        let duckMeshes = [];

        let glass;
        let duckMaterial;
        let glassMaterial;

        let causticOcclusion;

        let animationStarted = false;

        const clock = new THREE.Timer();

        const statusElement =
            document.getElementById('status');


        // =====================================================
        // STATUS MESSAGE
        // =====================================================

        function showStatus(message) {

            statusElement.textContent = message;

            statusElement.classList.remove('hidden');

        }

        function hideStatus() {

            statusElement.classList.add('hidden');

        }


        // =====================================================
        // WEBGPU CHECK
        // =====================================================

        async function checkWebGPU() {

            if (!navigator.gpu) {

                throw new Error(
                    'WebGPU is not available in this browser or on this GPU.'
                );

            }

            const adapter = await navigator.gpu.requestAdapter();

            if (!adapter) {

                throw new Error(
                    'No compatible WebGPU adapter was found.'
                );

            }

        }


        // =====================================================
        // INITIALIZATION
        // =====================================================

        async function init() {

            showStatus('Initializing WebGPU...');

            await checkWebGPU();


            // -------------------------------------------------
            // CAMERA
            // -------------------------------------------------

            camera = new THREE.PerspectiveCamera(
                25,
                window.innerWidth / window.innerHeight,
                0.025,
                5
            );

            camera.position.set(
                -0.5,
                0.35,
                0.2
            );


            // -------------------------------------------------
            // SCENE
            // -------------------------------------------------

            scene = new THREE.Scene();

            scene.background = new THREE.Color(0x181818);


            // -------------------------------------------------
            // SPOT LIGHT
            // -------------------------------------------------

            const spotLight = new THREE.SpotLight(
                0xffffff,
                1
            );

            spotLight.position.set(
                0.2,
                0.3,
                0.2
            );

            spotLight.castShadow = true;

            spotLight.angle = Math.PI / 6;

            spotLight.penumbra = 1;

            spotLight.decay = 2;

            spotLight.distance = 0;

            spotLight.shadow.mapType = THREE.HalfFloatType;

            spotLight.shadow.mapSize.width = 1024;

            spotLight.shadow.mapSize.height = 1024;

            spotLight.shadow.camera.near = 0.1;

            spotLight.shadow.camera.far = 1;

            spotLight.shadow.intensity = 0.95;

            scene.add(spotLight);


            // -------------------------------------------------
            // RENDERER
            // -------------------------------------------------

            renderer = new THREE.WebGPURenderer({
                antialias: true
            });

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 1.5)
            );

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.shadowMap.enabled = true;

            renderer.shadowMap.transmitted = true;

            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            renderer.outputColorSpace = THREE.SRGBColorSpace;

            document.body.appendChild(renderer.domElement);


            // Initialize WebGPU before rendering.

            showStatus('Initializing graphics device...');

            await renderer.init();


            // -------------------------------------------------
            // DRACO LOADER
            // -------------------------------------------------

            const dracoLoader = new DRACOLoader();

            dracoLoader.setDecoderPath(DRACO_PATH);

            const gltfLoader = new GLTFLoader();

            gltfLoader.setDRACOLoader(dracoLoader);


            // -------------------------------------------------
            // LOAD DUCK MODEL
            // -------------------------------------------------

            showStatus('Loading duck model...');

            const gltf = await gltfLoader.loadAsync(MODEL_URL);

            duckRoot = gltf.scene;

            duckRoot.scale.setScalar(0.5);

            scene.add(duckRoot);


            // Find every mesh in the model.

            duckMeshes = [];

            duckRoot.traverse(object => {

                if (object.isMesh) {

                    duckMeshes.push(object);

                }

            });

            if (duckMeshes.length === 0) {

                throw new Error(
                    'The duck model contains no mesh objects.'
                );

            }


            // -------------------------------------------------
            // LOAD CAUSTIC TEXTURE
            // -------------------------------------------------

            showStatus('Loading caustic texture...');

            const textureLoader = new THREE.TextureLoader();

            const causticMap = await textureLoader.loadAsync(
                CAUSTIC_TEXTURE_URL
            );

            causticMap.wrapS = THREE.RepeatWrapping;

            causticMap.wrapT = THREE.RepeatWrapping;

            causticMap.colorSpace = THREE.SRGBColorSpace;


            // -------------------------------------------------
            // DUCK MATERIAL
            // -------------------------------------------------

            duckMaterial = new THREE.MeshPhysicalNodeMaterial();

            duckMaterial.side = THREE.DoubleSide;

            duckMaterial.transparent = true;

            duckMaterial.color = new THREE.Color(0xFFD700);

            duckMaterial.transmission = 1;

            duckMaterial.thickness = 0.25;

            duckMaterial.ior = 1.5;

            duckMaterial.metalness = 0;

            duckMaterial.roughness = 0.1;


            // -------------------------------------------------
            // CAUSTIC UNIFORMS
            // -------------------------------------------------

            causticOcclusion = uniform(20);

            const causticColor = uniform(
                duckMaterial.color
            );


            // -------------------------------------------------
            // CAUSTIC SHADOW POSITION
            // -------------------------------------------------

            duckMaterial.castShadowPositionNode = Fn(() => {

                return positionLocal;

            })();


            // -------------------------------------------------
            // CAUSTIC SHADOW NODE
            // -------------------------------------------------

            duckMaterial.castShadowNode = Fn(() => {

                const refractionVector = refract(

                    positionViewDirection.negate(),

                    normalView,

                    div(1.0, duckMaterial.ior)

                ).normalize();


                const viewZ = normalView.z.pow(
                    causticOcclusion
                );


                const textureUV = refractionVector.xy.mul(0.6);


                const chromaticAberrationOffset =
                    normalView.z.pow(-0.9).mul(0.004);


                const causticProjection = vec3(

                    texture(
                        causticMap,
                        textureUV.add(
                            vec2(
                                chromaticAberrationOffset.negate(),
                                0
                            )
                        )
                    ).r,

                    texture(
                        causticMap,
                        textureUV.add(
                            vec2(
                                0,
                                chromaticAberrationOffset.negate()
                            )
                        )
                    ).g,

                    texture(
                        causticMap,
                        textureUV.add(
                            vec2(
                                chromaticAberrationOffset,
                                chromaticAberrationOffset
                            )
                        )
                    ).b

                );


                return causticProjection

                    .mul(viewZ.mul(25))

                    .add(viewZ)

                    .mul(causticColor);

            })();


            // -------------------------------------------------
            // APPLY DUCK MATERIAL
            // -------------------------------------------------

            for (const mesh of duckMeshes) {

                mesh.material = duckMaterial;

                mesh.castShadow = true;

            }


            // -------------------------------------------------
            // GLASS TEXTURE
            // -------------------------------------------------

            showStatus('Loading glass texture...');

            const colorMap = await textureLoader.loadAsync(
                COLOR_TEXTURE_URL
            );

            colorMap.wrapS = THREE.RepeatWrapping;

            colorMap.wrapT = THREE.RepeatWrapping;

            colorMap.colorSpace = THREE.SRGBColorSpace;


            // -------------------------------------------------
            // GLASS MATERIAL
            // -------------------------------------------------

            glassMaterial = new THREE.MeshPhysicalNodeMaterial();

            glassMaterial.map = colorMap;

            glassMaterial.side = THREE.DoubleSide;

            glassMaterial.transparent = true;

            glassMaterial.color = new THREE.Color(0xffffff);

            glassMaterial.transmission = 1;

            glassMaterial.ior = 1.5;

            glassMaterial.metalness = 0;

            glassMaterial.roughness = 0.1;

            glassMaterial.castShadowNode = vec4(
                texture(colorMap).rgb,
                0.8
            );


            glass = new THREE.Mesh(
                new THREE.PlaneGeometry(0.2, 0.2),
                glassMaterial
            );

            glass.position.y = 0.1;

            glass.castShadow = true;

            glass.visible = false;

            scene.add(glass);


            // -------------------------------------------------
            // GROUND TEXTURE
            // -------------------------------------------------

            showStatus('Loading ground texture...');

            const groundMap = await textureLoader.loadAsync(
                GROUND_TEXTURE_URL
            );

            groundMap.wrapS = THREE.RepeatWrapping;

            groundMap.wrapT = THREE.RepeatWrapping;

            groundMap.repeat.set(10, 10);

            groundMap.colorSpace = THREE.SRGBColorSpace;


            // -------------------------------------------------
            // GROUND
            // -------------------------------------------------

            const groundGeometry = new THREE.PlaneGeometry(
                2,
                2
            );

            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x999999,
                map: groundMap
            });

            const ground = new THREE.Mesh(
                groundGeometry,
                groundMaterial
            );

            ground.rotation.x = -Math.PI / 2;

            ground.receiveShadow = true;

            scene.add(ground);


            // -------------------------------------------------
            // ORBIT CONTROLS
            // -------------------------------------------------

            controls = new OrbitControls(
                camera,
                renderer.domElement
            );

            controls.maxDistance = 3;

            controls.maxPolarAngle = Math.PI / 2;

            controls.target.set(0, 0.1, 0);

            controls.enableDamping = true;

            controls.update();


            // -------------------------------------------------
            // GUI
            // -------------------------------------------------

            initGUI();


            // -------------------------------------------------
            // RESIZE EVENT
            // -------------------------------------------------

            window.addEventListener(
                'resize',
                onWindowResize
            );


            // -------------------------------------------------
            // START ANIMATION
            // -------------------------------------------------

            // THREE.Timer does not have a start() method.
            // Its update() method is called in animate().

            animationStarted = true;

            renderer.setAnimationLoop(animate);

            hideStatus();

        }


        // =====================================================
        // GUI
        // =====================================================

        function initGUI() {

            const params = {
                model: 'duck'
            };

            gui = new GUI();

            const folder = gui.addFolder('Settings');


            // Caustic occlusion.

            folder.add(
                causticOcclusion,
                'value',
                0,
                20,
                0.1
            ).name('Caustic occlusion');


            // Material color.

            folder.addColor(
                duckMaterial,
                'color'
            ).name('Material color');


            // Model selector.

            folder.add(
                params,
                'model',
                ['duck', 'glass']
            )
            .name('Model')
            .onChange(model => {

                for (const mesh of duckMeshes) {

                    mesh.visible = model === 'duck';

                }

                glass.visible = model === 'glass';

            });


            folder.open();

        }


        // =====================================================
        // RESIZE
        // =====================================================

        function onWindowResize() {

            if (!camera || !renderer) return;

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }


        // =====================================================
        // ANIMATION
        // =====================================================

        function animate() {

            if (!animationStarted) return;

            clock.update();

            if (duckRoot) {

                duckRoot.rotation.y -= 0.01;

            }

            if (controls) {

                controls.update();

            }

            renderer.render(scene, camera);

        }


        // =====================================================
        // CLEANUP
        // =====================================================

        function cleanup() {

            animationStarted = false;

            window.removeEventListener(
                'resize',
                onWindowResize
            );

            if (renderer) {

                renderer.setAnimationLoop(null);

            }

            if (controls) {

                controls.dispose();

            }

            if (gui) {

                gui.destroy();

            }

            if (scene) {

                const geometries = new Set();

                const materials = new Set();

                const textures = new Set();

                scene.traverse(object => {

                    if (object.geometry) {

                        geometries.add(object.geometry);

                    }

                    if (object.material) {

                        const list = Array.isArray(object.material)
                            ? object.material
                            : [object.material];

                        for (const material of list) {

                            materials.add(material);

                            for (const value of Object.values(material)) {

                                if (value && value.isTexture) {

                                    textures.add(value);

                                }

                            }

                        }

                    }

                });

                geometries.forEach(item => item.dispose());

                materials.forEach(item => item.dispose());

                textures.forEach(item => item.dispose());

            }

            clock.dispose();

            if (renderer) {

                renderer.dispose();

            }

        }


        window.addEventListener(
            'pagehide',
            cleanup,
            { once: true }
        );


        // =====================================================
        // START APPLICATION
        // =====================================================

        init().catch(error => {

            console.error(
                'Caustics example error:',
                error
            );

            showStatus(
                'Unable to start caustics: ' +
                error.message +
                '. Check the browser console.'
            );

        });

    </script>

</body>
</html>
