
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Ocean Shader</title>
    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.45);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
        }

        #info strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="info">
    <strong>Ocean Shader Simulation</strong>
    Drag: Rotate camera<br>
    Scroll: Zoom<br>
    GUI: Adjust ocean and atmosphere
</div>

<script type="module">

import * as THREE from "three";

import { OrbitControls } from
    "three/addons/controls/OrbitControls.js";

import { Water } from
    "three/addons/objects/Water.js";

import { Sky } from
    "three/addons/objects/Sky.js";

import { EffectComposer } from
    "three/addons/postprocessing/EffectComposer.js";

import { RenderPass } from
    "three/addons/postprocessing/RenderPass.js";

import { UnrealBloomPass } from
    "three/addons/postprocessing/UnrealBloomPass.js";

import { OutputPass } from
    "three/addons/postprocessing/OutputPass.js";

import Stats from
    "three/addons/libs/stats.module.js";

import GUI from
    "three/addons/libs/lil-gui.module.min.js";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    1,
    20000
);

camera.position.set(0, 120, 700);


/* =====================================================
   RENDERER
===================================================== */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "default"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 0.5;

document.body.appendChild(renderer.domElement);


/* =====================================================
   STATS
===================================================== */

const stats = new Stats();

document.body.appendChild(stats.dom);


/* =====================================================
   ORBIT CONTROLS
===================================================== */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.target.set(0, 10, 0);

controls.maxPolarAngle = Math.PI * 0.495;

controls.minDistance = 40;

controls.maxDistance = 3000;

controls.enableDamping = true;

controls.dampingFactor = 0.04;


/* =====================================================
   PROCEDURAL WATER NORMAL TEXTURE

   This replaces the external waternormals.jpg file.
   No texture download is required.
===================================================== */

function createWaterNormalTexture(size = 256) {

    const data = new Uint8Array(
        size * size * 4
    );

    const TAU = Math.PI * 2;

    function heightAt(u, v) {

        return (
            0.35 * Math.sin(TAU * (3 * u + 2 * v)) +
            0.22 * Math.sin(TAU * (5 * u - 3 * v)) +
            0.15 * Math.cos(TAU * (2 * u + 5 * v)) +
            0.10 * Math.sin(TAU * (7 * u + 4 * v))
        );
    }

    const step = 1 / size;

    for (let y = 0; y < size; y++) {

        for (let x = 0; x < size; x++) {

            const u = x / size;
            const v = y / size;

            const left = heightAt(u - step, v);
            const right = heightAt(u + step, v);

            const down = heightAt(u, v - step);
            const up = heightAt(u, v + step);

            const dx = (right - left) / (2 * step);
            const dy = (up - down) / (2 * step);

            let nx = -dx * 0.025;
            let ny = -dy * 0.025;
            let nz = 1.0;

            const length = Math.sqrt(
                nx * nx + ny * ny + nz * nz
            );

            nx /= length;
            ny /= length;
            nz /= length;

            const index = (y * size + x) * 4;

            data[index] = Math.round((nx * 0.5 + 0.5) * 255);
            data[index + 1] = Math.round((ny * 0.5 + 0.5) * 255);
            data[index + 2] = Math.round((nz * 0.5 + 0.5) * 255);
            data[index + 3] = 255;
        }
    }

    const texture = new THREE.DataTexture(
        data,
        size,
        size,
        THREE.RGBAFormat
    );

    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;

    texture.magFilter = THREE.LinearFilter;
    texture.minFilter = THREE.LinearFilter;

    texture.generateMipmaps = false;

    texture.needsUpdate = true;

    return texture;
}

const waterNormals = createWaterNormalTexture();

console.log("Procedural water normal texture created.");


/* =====================================================
   WATER
===================================================== */

const waterGeometry = new THREE.PlaneGeometry(
    10000,
    10000
);

const water = new Water(
    waterGeometry,
    {
        textureWidth: 512,
        textureHeight: 512,

        waterNormals: waterNormals,

        sunDirection: new THREE.Vector3(),

        sunColor: 0xffffff,

        waterColor: 0x001e35,

        distortionScale: 3.7,

        fog: scene.fog !== undefined,

        size: 1
    }
);

water.rotation.x = -Math.PI / 2;

water.position.y = 0;

scene.add(water);


/* =====================================================
   SKY
===================================================== */

const sky = new Sky();

sky.scale.setScalar(10000);

scene.add(sky);

const skyUniforms = sky.material.uniforms;

skyUniforms["turbidity"].value = 10;

skyUniforms["rayleigh"].value = 2;

skyUniforms["mieCoefficient"].value = 0.005;

skyUniforms["mieDirectionalG"].value = 0.8;


/* =====================================================
   SUN AND ENVIRONMENT
===================================================== */

const pmremGenerator = new THREE.PMREMGenerator(
    renderer
);

const sun = new THREE.Vector3();

function updateSun() {

    const elevation = parameters.elevation;

    const azimuth = parameters.azimuth;

    const phi = THREE.MathUtils.degToRad(
        90 - elevation
    );

    const theta = THREE.MathUtils.degToRad(
        azimuth
    );

    sun.setFromSphericalCoords(
        1,
        phi,
        theta
    );

    sky.material.uniforms[
        "sunPosition"
    ].value.copy(sun);

    water.material.uniforms[
        "sunDirection"
    ].value.copy(sun).normalize();

    const environmentScene = new THREE.Scene();

    environmentScene.add(sky);

    const environment = pmremGenerator.fromScene(
        environmentScene
    ).texture;

    scene.environment = environment;

    environmentScene.remove(sky);

    scene.add(sky);

    environment.dispose();
}


/* =====================================================
   FLOATING OBJECT
===================================================== */

const objectGeometry = new THREE.BoxGeometry(
    35,
    35,
    35
);

const objectMaterial = new THREE.MeshStandardMaterial({
    color: 0xff5533,
    metalness: 0.35,
    roughness: 0.3
});

const floatingObject = new THREE.Mesh(
    objectGeometry,
    objectMaterial
);

floatingObject.position.set(
    0,
    35,
    0
);

scene.add(floatingObject);


/* =====================================================
   LIGHTS
===================================================== */

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    0.4
);

scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    2
);

directionalLight.position.set(
    100,
    200,
    100
);

scene.add(directionalLight);


/* =====================================================
   POST PROCESSING
===================================================== */

const composer = new EffectComposer(renderer);

const renderPass = new RenderPass(
    scene,
    camera
);

composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
    ),
    0.25,
    0.4,
    0.85
);

composer.addPass(bloomPass);

const outputPass = new OutputPass();

composer.addPass(outputPass);


/* =====================================================
   GUI PARAMETERS
===================================================== */

const parameters = {

    elevation: 12,

    azimuth: 180,

    exposure: 0.5,

    distortionScale: 3.7,

    waterSize: 1,

    turbidity: 10,

    rayleigh: 2,

    mieCoefficient: 0.005,

    mieDirectionalG: 0.8,

    bloomStrength: 0.25,

    bloomRadius: 0.4,

    bloomThreshold: 0.85
};


/* =====================================================
   GUI
===================================================== */

const gui = new GUI({
    title: "Ocean Controls"
});


/* Sky controls */

const skyFolder = gui.addFolder("Atmosphere");

skyFolder.add(
    parameters,
    "elevation",
    0,
    90,
    0.1
).onChange(updateSun);

skyFolder.add(
    parameters,
    "azimuth",
    -180,
    180,
    0.1
).onChange(updateSun);

skyFolder.add(
    parameters,
    "turbidity",
    0,
    20,
    0.1
).onChange(value => {
    skyUniforms["turbidity"].value = value;
});

skyFolder.add(
    parameters,
    "rayleigh",
    0,
    4,
    0.01
).onChange(value => {
    skyUniforms["rayleigh"].value = value;
});

skyFolder.add(
    parameters,
    "mieCoefficient",
    0,
    0.1,
    0.001
).onChange(value => {
    skyUniforms["mieCoefficient"].value = value;
});

skyFolder.add(
    parameters,
    "mieDirectionalG",
    0,
    1,
    0.01
).onChange(value => {
    skyUniforms["mieDirectionalG"].value = value;
});

skyFolder.add(
    parameters,
    "exposure",
    0,
    1,
    0.01
).onChange(value => {
    renderer.toneMappingExposure = value;
});


/* Water controls */

const waterFolder = gui.addFolder("Water");

waterFolder.add(
    parameters,
    "distortionScale",
    0,
    8,
    0.1
).onChange(value => {
    water.material.uniforms[
        "distortionScale"
    ].value = value;
});

waterFolder.add(
    parameters,
    "waterSize",
    0.1,
    10,
    0.1
).onChange(value => {
    water.material.uniforms[
        "size"
    ].value = value;
});


/* Bloom controls */

const bloomFolder = gui.addFolder("Bloom");

bloomFolder.add(
    parameters,
    "bloomStrength",
    0,
    2,
    0.01
).onChange(value => {
    bloomPass.strength = value;
});

bloomFolder.add(
    parameters,
    "bloomRadius",
    0,
    1,
    0.01
).onChange(value => {
    bloomPass.radius = value;
});

bloomFolder.add(
    parameters,
    "bloomThreshold",
    0,
    1,
    0.01
).onChange(value => {
    bloomPass.threshold = value;
});

skyFolder.open();

waterFolder.open();


/* =====================================================
   INITIALIZE ENVIRONMENT
===================================================== */

updateSun();


/* =====================================================
   TIMER

   THREE.Clock is deprecated in Three.js r183.
   THREE.Timer is used instead.
===================================================== */

const timer = new THREE.Timer();

timer.connect(document);


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    requestAnimationFrame(animate);

    timer.update();

    const elapsedTime = timer.getElapsed();

    // Animate water waves.
    water.material.uniforms[
        "time"
    ].value = elapsedTime;

    // Floating object movement.
    floatingObject.position.y =
        35 + Math.sin(elapsedTime * 1.5) * 5;

    floatingObject.rotation.x =
        elapsedTime * 0.15;

    floatingObject.rotation.y =
        elapsedTime * 0.25;

    // Update camera controls.
    controls.update();

    // Render scene with bloom.
    composer.render();

    stats.update();
}

animate();


/* =====================================================
   RESIZE
===================================================== */

function onWindowResize() {

    const width = window.innerWidth;

    const height = window.innerHeight;

    camera.aspect = width / height;

    camera.updateProjectionMatrix();

    renderer.setSize(width, height);

    composer.setSize(width, height);

    bloomPass.resolution.set(
        width,
        height
    );
}

window.addEventListener(
    "resize",
    onWindowResize
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "pagehide",
    () => {

        timer.dispose();

        controls.dispose();

        gui.destroy();

        pmremGenerator.dispose();

        composer.dispose();

        waterNormals.dispose();

        waterGeometry.dispose();

        objectGeometry.dispose();

        objectMaterial.dispose();

        renderer.dispose();

    },
    { once: true }
);

</script>

</body>
</html>
