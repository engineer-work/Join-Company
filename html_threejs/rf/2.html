
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parametric Robot RL — Block Navigation</title>

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #101722;
    color: #edf4ff;
}
#scene { position: fixed; inset: 0; }
#panel {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 290px;
    padding: 16px;
    border: 1px solid #34465d;
    border-radius: 12px;
    background: rgba(13, 22, 34, 0.94);
    box-shadow: 0 8px 28px #0006;
    z-index: 5;
}
h2 { margin: 0 0 6px; font-size: 18px; }
p { color: #a9bad0; font-size: 12px; line-height: 1.5; }
button {
    width: 100%;
    margin: 4px 0;
    padding: 9px;
    border: 1px solid #52677f;
    border-radius: 7px;
    background: #24364b;
    color: white;
    cursor: pointer;
}
button:hover { background: #34516e; }
button.primary { background: #087f8c; border-color: #20b7c5; }
button.danger { background: #713b43; }
#stats {
    margin-top: 10px;
    padding: 10px;
    border-radius: 7px;
    background: #172638;
    font-size: 12px;
    line-height: 1.8;
}
#message {
    margin-top: 8px;
    min-height: 30px;
    color: #72e4dc;
    font-size: 12px;
}
#legend {
    position: fixed;
    bottom: 15px;
    right: 15px;
    padding: 12px;
    border-radius: 9px;
    background: #101722dd;
    font-size: 12px;
    line-height: 1.8;
}
.dot { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
</style>
</head>

<body>
<div id="scene"></div>

<div id="panel">
    <h2>Parametric Robot RL</h2>
    <p>
        A procedural robot learns to reach the green target.
        Q-learning updates its policy when the block layout changes.
    </p>

    <button class="primary" id="trainBtn">Train Agent</button>
    <button id="startBtn">Start Walking</button>
    <button id="addBtn">Add Block</button>
    <button id="removeBtn">Remove Block</button>
    <button id="pushBtn">Push Nearest Block</button>
    <button class="danger" id="resetBtn">Reset Learning</button>

    <div id="stats">
        <div>Episode: <b id="episode">0</b></div>
        <div>Q states: <b id="states">0</b></div>
        <div>Steps: <b id="steps">0</b></div>
        <div>Successes: <b id="success">0</b></div>
        <div>Blocks: <b id="blocks">0</b></div>
        <div>Exploration ε: <b id="epsilon">1.00</b></div>
    </div>
    <div id="message">Ready. Train the agent to begin.</div>
</div>

<div id="legend">
    <div><span class="dot" style="background:#25d9c1"></span>Robot</div>
    <div><span class="dot" style="background:#f4a340"></span>Pushable block</div>
    <div><span class="dot" style="background:#57d987"></span>Goal</div>
    <div><span class="dot" style="background:#43556c"></span>Grid / wall</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* -------------------------------------------------------
   THREE.JS SCENE
------------------------------------------------------- */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101722);
scene.fog = new THREE.Fog(0x101722, 18, 40);

const camera = new THREE.PerspectiveCamera(
    48, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(8, 13, 15);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("scene").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc7e6ff, 0x202633, 2));

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(5, 12, 7);
sun.castShadow = true;
scene.add(sun);

const GRID = 8;
const CELL = 1.5;
const HALF = (GRID - 1) / 2;
const GOAL = { x: 7, z: 7 };

function worldX(x) { return (x - HALF) * CELL; }
function worldZ(z) { return (z - HALF) * CELL; }

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(GRID * CELL, GRID * CELL),
    new THREE.MeshStandardMaterial({
        color: 0x202d3d,
        roughness: 0.9
    })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(GRID * CELL, GRID, 0x60758c, 0x3a4b60);
grid.position.y = 0.015;
scene.add(grid);

const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x43556c });
const walls = [];

function addWall(x, z) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(CELL, 0.7, CELL),
        wallMaterial
    );
    mesh.position.set(worldX(x), 0.35, worldZ(z));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    walls.push({ x, z, mesh });
}

// Fixed boundaries / obstacles.
for (let i = 0; i < GRID; i++) {
    addWall(i, 0);
    addWall(i, GRID - 1);
}
for (let i = 1; i < GRID - 1; i++) {
    addWall(0, i);
    addWall(GRID - 1, i);
}

// Interior fixed obstacles. They are deliberately sparse.
addWall(3, 3);
addWall(4, 3);
addWall(3, 4);

/* -------------------------------------------------------
   GOAL
------------------------------------------------------- */

const goal = new THREE.Group();
const goalBase = new THREE.Mesh(
    new THREE.CylinderGeometry(0.48, 0.48, 0.12, 24),
    new THREE.MeshStandardMaterial({
        color: 0x37d977,
        emissive: 0x104c26
    })
);
goalBase.position.y = 0.08;
goal.add(goalBase);

const goalOrb = new THREE.Mesh(
    new THREE.SphereGeometry(0.23, 20, 20),
    new THREE.MeshStandardMaterial({
        color: 0x8cffb0,
        emissive: 0x22aa55,
        emissiveIntensity: 1.5
    })
);
goalOrb.position.y = 0.65;
goal.add(goalOrb);
goal.position.set(worldX(GOAL.x), 0, worldZ(GOAL.z));
scene.add(goal);

/* -------------------------------------------------------
   PROCEDURAL ROBOT
   No external model or GLB is used.
------------------------------------------------------- */

const robot = new THREE.Group();
scene.add(robot);

const robotMat = new THREE.MeshStandardMaterial({
    color: 0x25d9c1,
    metalness: 0.45,
    roughness: 0.3
});
const darkMat = new THREE.MeshStandardMaterial({
    color: 0x1b2d3b,
    metalness: 0.5,
    roughness: 0.4
});
const eyeMat = new THREE.MeshStandardMaterial({
    color: 0x9cffff,
    emissive: 0x32cfff,
    emissiveIntensity: 2
});

function makeBox(parent, size, material, position) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material
    );
    mesh.position.set(position[0], position[1], position[2]);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
}

makeBox(robot, [0.55, 0.72, 0.36], robotMat, [0, 1.05, 0]); // torso
makeBox(robot, [0.38, 0.34, 0.34], darkMat, [0, 1.62, 0]); // head
makeBox(robot, [0.25, 0.08, 0.05], eyeMat, [0, 1.65, -0.18]); // eyes
makeBox(robot, [0.44, 0.18, 0.34], darkMat, [0, 0.65, 0]); // pelvis

const limbs = {
    leftArm: new THREE.Group(),
    rightArm: new THREE.Group(),
    leftLeg: new THREE.Group(),
    rightLeg: new THREE.Group()
};

robot.add(
    limbs.leftArm, limbs.rightArm,
    limbs.leftLeg, limbs.rightLeg
);

function createLimb(group, upperSize, lowerSize, x, y) {
    group.position.set(x, y, 0);
    makeBox(group, upperSize, robotMat, [0, -upperSize[1] / 2, 0]);
    makeBox(group, lowerSize, darkMat, [0, -upperSize[1] - lowerSize[1] / 2, 0]);
}

createLimb(limbs.leftArm, [0.18, 0.42, 0.18], [0.16, 0.38, 0.16], -0.39, 1.42);
createLimb(limbs.rightArm, [0.18, 0.42, 0.18], [0.16, 0.38, 0.16], 0.39, 1.42);
createLimb(limbs.leftLeg, [0.2, 0.42, 0.2], [0.2, 0.4, 0.2], -0.16, 0.57);
createLimb(limbs.rightLeg, [0.2, 0.42, 0.2], [0.2, 0.4, 0.2], 0.16, 0.57);

const robotShadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.48, 24),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })
);
robotShadow.rotation.x = -Math.PI / 2;
robotShadow.position.y = 0.025;
scene.add(robotShadow);

/* -------------------------------------------------------
   BLOCKS
------------------------------------------------------- */

const blocks = [];
let blockId = 0;

function occupiedByWall(x, z) {
    return walls.some(w => w.x === x && w.z === z);
}

function occupiedByBlock(x, z, except = null) {
    return blocks.some(b => b.x === x && b.z === z && b !== except);
}

function addBlock(x, z) {
    if (x <= 0 || z <= 0 || x >= GRID - 1 || z >= GRID - 1) return false;
    if (occupiedByWall(x, z) || occupiedByBlock(x, z)) return false;
    if ((x === GOAL.x && z === GOAL.z) || (x === agent.x && z === agent.z)) return false;

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(CELL * 0.72, 0.72, CELL * 0.72),
        new THREE.MeshStandardMaterial({
            color: 0xf4a340,
            roughness: 0.55,
            metalness: 0.15
        })
    );
    mesh.position.set(worldX(x), 0.36, worldZ(z));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    blocks.push({ id: blockId++, x, z, mesh });
    return true;
}

function removeBlock(block) {
    if (!block) return;
    scene.remove(block.mesh);
    block.mesh.geometry.dispose();
    block.mesh.material.dispose();
    const index = blocks.indexOf(block);
    if (index >= 0) blocks.splice(index, 1);
}

/* -------------------------------------------------------
   REINFORCEMENT LEARNING — Q-LEARNING
------------------------------------------------------- */

const ACTIONS = [
    { dx: 0, dz: -1, name: "north" },
    { dx: 1, dz: 0, name: "east" },
    { dx: 0, dz: 1, name: "south" },
    { dx: -1, dz: 0, name: "west" }
];

const ALPHA = 0.18;       // learning rate
const GAMMA = 0.94;       // future reward weight
let epsilon = 1.0;        // exploration
const EPSILON_MIN = 0.04;
const EPSILON_DECAY = 0.9993;

const Q = new Map();
let episode = 0;
let successes = 0;
let totalSteps = 0;
let walking = false;
let training = false;
let walkTimer = null;
let trainingTimer = null;
let stepsThisEpisode = 0;

const agent = { x: 1, z: 1 };

function stateKey(x, z) {
    // Block positions are part of the state. This lets the agent
    // learn different actions for different obstacle arrangements.
    const blockState = blocks
        .map(b => `${b.x},${b.z}`)
        .sort()
        .join("|");
    return `${x},${z}|${blockState}`;
}

function qValues(state) {
    if (!Q.has(state)) Q.set(state, [0, 0, 0, 0]);
    return Q.get(state);
}

function bestAction(state) {
    const values = qValues(state);
    let best = 0;
    for (let i = 1; i < values.length; i++) {
        if (values[i] > values[best]) best = i;
    }
    return best;
}

function randomAction() {
    return Math.floor(Math.random() * ACTIONS.length);
}

function chooseAction(state, explore = true) {
    if (explore && Math.random() < epsilon) return randomAction();
    return bestAction(state);
}

function inBounds(x, z) {
    return x > 0 && z > 0 && x < GRID - 1 && z < GRID - 1;
}

/*
  Action behavior:
  - Empty cell: robot walks into it.
  - Block cell: robot attempts to push it one cell forward.
  - Wall / blocked push: robot remains in place.
  This is the transition model the Q-learning agent learns from.
*/
function environmentStep(x, z, actionIndex) {
    const action = ACTIONS[actionIndex];
    const nx = x + action.dx;
    const nz = z + action.dz;

    if (!inBounds(nx, nz) || occupiedByWall(nx, nz)) {
        return { x, z, reward: -4, done: false, pushed: false };
    }

    const block = blocks.find(b => b.x === nx && b.z === nz);

    if (block) {
        const bx = nx + action.dx;
        const bz = nz + action.dz;

        if (!inBounds(bx, bz) || occupiedByWall(bx, bz) || occupiedByBlock(bx, bz, block)) {
            return { x, z, reward: -5, done: false, pushed: false };
        }

        block.x = bx;
        block.z = bz;
        block.mesh.position.set(worldX(bx), 0.36, worldZ(bz));

        const done = x === GOAL.x && z === GOAL.z;
        return {
            x: nx, z: nz,
            reward: done ? 100 : -1.2,
            done,
            pushed: true
        };
    }

    const done = nx === GOAL.x && nz === GOAL.z;
    return {
        x: nx, z: nz,
        reward: done ? 100 : -1,
        done,
        pushed: false
    };
}

/*
  Training uses temporary block coordinates. At the beginning of
  each episode, the same current arrangement is restored.
*/
function captureBlocks() {
    return blocks.map(b => ({ x: b.x, z: b.z }));
}

function restoreBlocks(snapshot) {
    blocks.forEach((b, i) => {
        if (snapshot[i]) {
            b.x = snapshot[i].x;
            b.z = snapshot[i].z;
            b.mesh.position.set(worldX(b.x), 0.36, worldZ(b.z));
        }
    });
}

function resetEpisode(snapshot) {
    restoreBlocks(snapshot);
    agent.x = 1;
    agent.z = 1;
    stepsThisEpisode = 0;
}

function trainOneEpisode(snapshot, maxSteps = 160) {
    resetEpisode(snapshot);

    let done = false;

    for (let step = 0; step < maxSteps && !done; step++) {
        const state = stateKey(agent.x, agent.z);
        const action = chooseAction(state, true);

        const result = environmentStep(agent.x, agent.z, action);
        const nextState = stateKey(result.x, result.z);

        const currentQ = qValues(state);
        const nextQ = qValues(nextState);
        const maxNext = Math.max(...nextQ);

        currentQ[action] += ALPHA *
            (result.reward + GAMMA * (result.done ? 0 : maxNext) - currentQ[action]);

        agent.x = result.x;
        agent.z = result.z;
        done = result.done;
        stepsThisEpisode++;
    }

    if (done) successes++;
    episode++;
    epsilon = Math.max(EPSILON_MIN, epsilon * EPSILON_DECAY);
    totalSteps += stepsThisEpisode;
}

/* -------------------------------------------------------
   LEARNED POLICY WALKING
------------------------------------------------------- */

function updateRobotPosition() {
    robot.position.set(worldX(agent.x), 0, worldZ(agent.z));
    robotShadow.position.set(worldX(agent.x), 0.025, worldZ(agent.z));
}

function walkOneStep() {
    if (!walking) return;

    const state = stateKey(agent.x, agent.z);
    const action = bestAction(state);
    const result = environmentStep(agent.x, agent.z, action);

    agent.x = result.x;
    agent.z = result.z;

    const direction = ACTIONS[action];
    robot.rotation.y = Math.atan2(direction.dx, direction.dz);

    updateRobotPosition();
    animateGait();

    document.getElementById("steps").textContent = totalSteps;
    if (result.done) {
        walking = false;
        clearInterval(walkTimer);
        document.getElementById("startBtn").textContent = "Start Walking";
        document.getElementById("message").textContent = "Goal reached!";
    }
}

/* Simple visual gait animation */
let gait = 0;
function animateGait() {
    gait += 0.8;
    const swing = Math.sin(gait) * 0.42;
    limbs.leftLeg.rotation.x = swing;
    limbs.rightLeg.rotation.x = -swing;
    limbs.leftArm.rotation.x = -swing * 0.7;
    limbs.rightArm.rotation.x = swing * 0.7;
}

/* -------------------------------------------------------
   TRAINING CONTROLS
------------------------------------------------------- */

function updateStats() {
    document.getElementById("episode").textContent = episode;
    document.getElementById("states").textContent = Q.size;
    document.getElementById("success").textContent = successes;
    document.getElementById("blocks").textContent = blocks.length;
    document.getElementById("epsilon").textContent = epsilon.toFixed(2);
}

function stopWalking() {
    walking = false;
    clearInterval(walkTimer);
    document.getElementById("startBtn").textContent = "Start Walking";
}

function trainAgent(episodesToRun = 5000) {
    stopWalking();
    training = true;

    const snapshot = captureBlocks();
    const message = document.getElementById("message");
    message.textContent = "Training Q-learning agent...";

    // Batch training so the browser can update the interface.
    let remaining = episodesToRun;

    clearInterval(trainingTimer);
    trainingTimer = setInterval(() => {
        const batch = Math.min(250, remaining);

        for (let i = 0; i < batch; i++) {
            trainOneEpisode(snapshot);
        }

        remaining -= batch;
        updateStats();

        if (remaining <= 0) {
            clearInterval(trainingTimer);
            training = false;
            restoreBlocks(snapshot);
            agent.x = 1;
            agent.z = 1;
            updateRobotPosition();
            message.textContent = "Training complete. Start walking to test the policy.";
        }
    }, 10);
}

document.getElementById("trainBtn").addEventListener("click", () => {
    trainAgent(5000);
});

document.getElementById("startBtn").addEventListener("click", () => {
    if (training) return;

    if (walking) {
        stopWalking();
    } else {
        walking = true;
        document.getElementById("startBtn").textContent = "Pause Walking";
        document.getElementById("message").textContent = "Robot is following its learned policy.";
        walkTimer = setInterval(walkOneStep, 450);
    }
});

document.getElementById("addBtn").addEventListener("click", () => {
    stopWalking();

    let added = false;
    for (let attempt = 0; attempt < 100; attempt++) {
        const x = 1 + Math.floor(Math.random() * (GRID - 2));
        const z = 1 + Math.floor(Math.random() * (GRID - 2));
        if (addBlock(x, z)) {
            added = true;
            break;
        }
    }

    if (added) {
        document.getElementById("message").textContent =
            "Block added. The changed layout requires retraining.";
        updateStats();
        trainAgent(4000);
    } else {
        document.getElementById("message").textContent = "No free cell available for another block.";
    }
});

document.getElementById("removeBtn").addEventListener("click", () => {
    stopWalking();

    if (!blocks.length) {
        document.getElementById("message").textContent = "There are no movable blocks to remove.";
        return;
    }

    // Remove the block closest to the robot.
    let nearest = blocks[0];
    let bestDistance = Infinity;

    for (const block of blocks) {
        const distance = Math.abs(block.x - agent.x) + Math.abs(block.z - agent.z);
        if (distance < bestDistance) {
            bestDistance = distance;
            nearest = block;
        }
    }

    removeBlock(nearest);
    document.getElementById("message").textContent =
        "Block removed. Retraining with the new environment.";
    updateStats();
    trainAgent(4000);
});

document.getElementById("pushBtn").addEventListener("click", () => {
    stopWalking();

    let nearest = null;
    let bestDistance = Infinity;

    for (const block of blocks) {
        const distance = Math.abs(block.x - agent.x) + Math.abs(block.z - agent.z);
        if (distance < bestDistance) {
            bestDistance = distance;
            nearest = block;
        }
    }

    if (!nearest) {
        document.getElementById("message").textContent = "No block is available to push.";
        return;
    }

    // Manually demonstrate a push in the direction away from the robot.
    const dx = Math.sign(nearest.x - agent.x);
    const dz = Math.sign(nearest.z - agent.z);

    let bx = nearest.x + dx;
    let bz = nearest.z + dz;

    if (dx !== 0 && dz !== 0) {
        bz = nearest.z;
    }

    if (!inBounds(bx, bz) || occupiedByWall(bx, bz) || occupiedByBlock(bx, bz, nearest)) {
        document.getElementById("message").textContent = "That block is blocked in the push direction.";
        return;
    }

    nearest.x = bx;
    nearest.z = bz;
    nearest.mesh.position.set(worldX(bx), 0.36, worldZ(bz));

    document.getElementById("message").textContent =
        "Block pushed. The agent will retrain for the changed layout.";
    updateStats();
    trainAgent(4000);
});

document.getElementById("resetBtn").addEventListener("click", () => {
    stopWalking();
    clearInterval(trainingTimer);

    Q.clear();
    episode = 0;
    successes = 0;
    totalSteps = 0;
    epsilon = 1.0;

    agent.x = 1;
    agent.z = 1;
    updateRobotPosition();
    updateStats();

    document.getElementById("message").textContent =
        "Learning reset. Train the agent again.";
});

/* -------------------------------------------------------
   INITIAL BLOCKS AND SCENE UPDATE
------------------------------------------------------- */

addBlock(2, 4);
addBlock(5, 2);
addBlock(5, 5);

updateRobotPosition();
updateStats();

/* -------------------------------------------------------
   RENDER LOOP
------------------------------------------------------- */

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();
    goalOrb.position.y = 0.65 + Math.sin(time * 2) * 0.08;
    goalOrb.rotation.y += 0.015;

    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
