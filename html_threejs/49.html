
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js - Skeletal Animation Blending</title>

    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #a0a0a0;
        }

        #container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #info {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            color: #fff;
            background: rgba(0, 0, 0, 0.45);
            padding: 10px 14px;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.6;
            max-width: 450px;
        }

        #info a {
            color: #ff7777;
            text-decoration: none;
        }

        #info a:hover {
            text-decoration: underline;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            background: #777;
            z-index: 5;
            pointer-events: none;
        }

        #error {
            display: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: 600px;
            width: 90%;
            padding: 20px;
            background: #300;
            color: white;
            border-radius: 8px;
            z-index: 20;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .lil-gui {
            --width: 310px;
            --background-color: rgba(25, 25, 25, 0.92);
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="container">
    <div id="loading">Loading Soldier model...</div>
    <div id="error"></div>
</div>

<div id="info">
    <a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>
    - Skeletal Animation Blending<br>
    Model from
    <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a>
    <br>
    Crossfades blend between Idle, Walk and Run animations.
</div>

<script type="module">

import * as THREE from 'three';

import Stats from 'three/addons/libs/stats.module.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// --------------------------------------------------
// GLOBAL VARIABLES
// --------------------------------------------------

let scene;
let camera;
let renderer;
let stats;
let mixer;
let timer;

let model;
let skeleton;

let idleAction;
let walkAction;
let runAction;

let idleWeight = 0;
let walkWeight = 0;
let runWeight = 0;

let actions = [];
let settings;

let singleStepMode = false;
let sizeOfNextStep = 0;

const crossFadeControls = [];

const container = document.getElementById('container');
const loadingElement = document.getElementById('loading');
const errorElement = document.getElementById('error');

// --------------------------------------------------
// INITIALIZATION
// --------------------------------------------------

init();

function init() {

    // Camera
    camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        1,
        100
    );

    camera.position.set(1, 2, -3);
    camera.lookAt(0, 1, 0);

    // Scene
    scene = new THREE.Scene();

    scene.background = new THREE.Color(0xa0a0a0);
    scene.fog = new THREE.Fog(0xa0a0a0, 10, 50);

    // Timer
    timer = new THREE.Timer();
    timer.connect(document);

    // --------------------------------------------------
    // LIGHTING
    // --------------------------------------------------

    const hemiLight = new THREE.HemisphereLight(
        0xffffff,
        0x8d8d8d,
        3
    );

    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(
        0xffffff,
        3
    );

    dirLight.position.set(-3, 10, -10);
    dirLight.castShadow = true;

    dirLight.shadow.camera.top = 2;
    dirLight.shadow.camera.bottom = -2;
    dirLight.shadow.camera.left = -2;
    dirLight.shadow.camera.right = 2;
    dirLight.shadow.camera.near = 0.1;
    dirLight.shadow.camera.far = 40;

    dirLight.shadow.mapSize.set(1024, 1024);

    scene.add(dirLight);

    // --------------------------------------------------
    // GROUND
    // --------------------------------------------------

    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshPhongMaterial({
            color: 0xcbcbcb,
            depthWrite: false
        })
    );

    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;

    scene.add(ground);

    // --------------------------------------------------
    // WEBGL RENDERER
    // --------------------------------------------------

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;

    container.appendChild(renderer.domElement);

    // Statistics
    stats = new Stats();
    container.appendChild(stats.dom);

    // Resize
    window.addEventListener('resize', onWindowResize);

    // --------------------------------------------------
    // LOAD SOLDIER MODEL
    // --------------------------------------------------

    const loader = new GLTFLoader();

    const modelURL =
        'https://threejs.org/examples/models/gltf/Soldier.glb';

    loader.load(
        modelURL,

        function (gltf) {

            model = gltf.scene;

            scene.add(model);

            // Enable shadows
            model.traverse(function (object) {

                if (object.isMesh) {
                    object.castShadow = true;
                    object.receiveShadow = true;
                }

            });

            // Skeleton helper
            skeleton = new THREE.SkeletonHelper(model);
            skeleton.visible = false;

            scene.add(skeleton);

            // Animation mixer
            mixer = new THREE.AnimationMixer(model);

            // --------------------------------------------------
            // FIND ANIMATIONS
            // --------------------------------------------------

            const animations = gltf.animations;

            console.log('Available animations:');

            animations.forEach(function (clip, index) {
                console.log(index, clip.name, clip.duration);
            });

            // Find clips by name first.
            // Fall back to the official Soldier.glb clip indexes.

            const findAnimation = function (keywords, fallbackIndex) {

                const found = animations.find(function (clip) {

                    const name = clip.name.toLowerCase();

                    return keywords.some(function (keyword) {
                        return name.includes(keyword);
                    });

                });

                return found || animations[fallbackIndex];

            };

            const idleClip = findAnimation(['idle'], 0);
            const runClip = findAnimation(['run'], 1);
            const walkClip = findAnimation(['walk'], 3);

            if (!idleClip || !walkClip || !runClip) {
                throw new Error(
                    'Could not find the required Idle, Walk and Run animations.'
                );
            }

            idleAction = mixer.clipAction(idleClip);
            walkAction = mixer.clipAction(walkClip);
            runAction = mixer.clipAction(runClip);

            actions = [
                idleAction,
                walkAction,
                runAction
            ];

            // Create GUI after actions are initialized
            createPanel();

            // Start all animations
            activateAllActions();

            // Hide loading message
            loadingElement.style.display = 'none';

            // Start rendering
            renderer.setAnimationLoop(animate);

        },

        function (xhr) {

            if (xhr.total > 0) {

                const percent = (
                    xhr.loaded / xhr.total * 100
                ).toFixed(0);

                loadingElement.textContent =
                    'Loading Soldier model... ' + percent + '%';

            }

        },

        function (error) {

            console.error('Model loading failed:', error);

            loadingElement.style.display = 'none';
            errorElement.style.display = 'block';

            errorElement.textContent =
                'Unable to load Soldier.glb.\n\n' +
                'Check your internet connection and browser console.\n\n' +
                'Model URL:\n' + modelURL;

        }

    );

}

// --------------------------------------------------
// GUI PANEL
// --------------------------------------------------

function createPanel() {

    const panel = new GUI({
        width: 310
    });

    const folder1 = panel.addFolder('Visibility');
    const folder2 = panel.addFolder('Activation / Deactivation');
    const folder3 = panel.addFolder('Pausing / Stepping');
    const folder4 = panel.addFolder('Crossfading');
    const folder5 = panel.addFolder('Blend Weights');
    const folder6 = panel.addFolder('General Speed');

    settings = {

        'show model': true,
        'show skeleton': false,

        'deactivate all': deactivateAllActions,
        'activate all': activateAllActions,

        'pause/continue': pauseContinue,
        'make single step': toSingleStepMode,
        'modify step size': 0.05,

        'from walk to idle': function () {
            prepareCrossFade(walkAction, idleAction, 1.0);
        },

        'from idle to walk': function () {
            prepareCrossFade(idleAction, walkAction, 0.5);
        },

        'from walk to run': function () {
            prepareCrossFade(walkAction, runAction, 2.5);
        },

        'from run to walk': function () {
            prepareCrossFade(runAction, walkAction, 5.0);
        },

        'use default duration': true,
        'set custom duration': 3.5,

        'modify idle weight': 0.0,
        'modify walk weight': 1.0,
        'modify run weight': 0.0,

        'modify time scale': 1.0

    };

    // Visibility
    folder1.add(settings, 'show model')
        .onChange(showModel);

    folder1.add(settings, 'show skeleton')
        .onChange(showSkeleton);

    // Activation
    folder2.add(settings, 'deactivate all');
    folder2.add(settings, 'activate all');

    // Pause and step
    folder3.add(settings, 'pause/continue');
    folder3.add(settings, 'make single step');

    folder3.add(
        settings,
        'modify step size',
        0.01,
        0.1,
        0.001
    );

    // Crossfading
    crossFadeControls.push(
        folder4.add(settings, 'from walk to idle')
    );

    crossFadeControls.push(
        folder4.add(settings, 'from idle to walk')
    );

    crossFadeControls.push(
        folder4.add(settings, 'from walk to run')
    );

    crossFadeControls.push(
        folder4.add(settings, 'from run to walk')
    );

    folder4.add(settings, 'use default duration');

    folder4.add(
        settings,
        'set custom duration',
        0,
        10,
        0.01
    );

    // Blend weights
    folder5.add(
        settings,
        'modify idle weight',
        0,
        1,
        0.01
    )
    .listen()
    .onChange(function (weight) {
        setWeight(idleAction, weight);
    });

    folder5.add(
        settings,
        'modify walk weight',
        0,
        1,
        0.01
    )
    .listen()
    .onChange(function (weight) {
        setWeight(walkAction, weight);
    });

    folder5.add(
        settings,
        'modify run weight',
        0,
        1,
        0.01
    )
    .listen()
    .onChange(function (weight) {
        setWeight(runAction, weight);
    });

    // Animation speed
    folder6.add(
        settings,
        'modify time scale',
        0,
        1.5,
        0.01
    )
    .onChange(modifyTimeScale);

    folder1.open();
    folder2.open();
    folder3.open();
    folder4.open();
    folder5.open();
    folder6.open();

}

// --------------------------------------------------
// VISIBILITY
// --------------------------------------------------

function showModel(visibility) {

    if (model) {
        model.visible = visibility;
    }

}

function showSkeleton(visibility) {

    if (skeleton) {
        skeleton.visible = visibility;
    }

}

// --------------------------------------------------
// ANIMATION SPEED
// --------------------------------------------------

function modifyTimeScale(speed) {

    if (mixer) {
        mixer.timeScale = speed;
    }

}

// --------------------------------------------------
// ACTIVATE / DEACTIVATE
// --------------------------------------------------

function deactivateAllActions() {

    actions.forEach(function (action) {
        action.stop();
    });

}

function activateAllActions() {

    if (!actions.length) return;

    setWeight(
        idleAction,
        settings['modify idle weight']
    );

    setWeight(
        walkAction,
        settings['modify walk weight']
    );

    setWeight(
        runAction,
        settings['modify run weight']
    );

    actions.forEach(function (action) {
        action.play();
    });

}

// --------------------------------------------------
// PAUSE / CONTINUE
// --------------------------------------------------

function pauseContinue() {

    if (singleStepMode) {

        singleStepMode = false;
        unPauseAllActions();

    } else {

        if (idleAction.paused) {
            unPauseAllActions();
        } else {
            pauseAllActions();
        }

    }

}

function pauseAllActions() {

    actions.forEach(function (action) {
        action.paused = true;
    });

}

function unPauseAllActions() {

    actions.forEach(function (action) {
        action.paused = false;
    });

}

// --------------------------------------------------
// SINGLE STEP MODE
// --------------------------------------------------

function toSingleStepMode() {

    unPauseAllActions();

    singleStepMode = true;

    sizeOfNextStep = settings['modify step size'];

}

// --------------------------------------------------
// CROSSFADE PREPARATION
// --------------------------------------------------

function prepareCrossFade(
    startAction,
    endAction,
    defaultDuration
) {

    const duration = setCrossFadeDuration(defaultDuration);

    singleStepMode = false;

    unPauseAllActions();

    if (startAction === idleAction) {

        executeCrossFade(
            startAction,
            endAction,
            duration
        );

    } else {

        synchronizeCrossFade(
            startAction,
            endAction,
            duration
        );

    }

}

// --------------------------------------------------
// CROSSFADE DURATION
// --------------------------------------------------

function setCrossFadeDuration(defaultDuration) {

    if (settings['use default duration']) {
        return defaultDuration;
    }

    return settings['set custom duration'];

}

// --------------------------------------------------
// SYNCHRONIZED CROSSFADE
// --------------------------------------------------

function synchronizeCrossFade(
    startAction,
    endAction,
    duration
) {

    function onLoopFinished(event) {

        if (event.action === startAction) {

            mixer.removeEventListener(
                'loop',
                onLoopFinished
            );

            executeCrossFade(
                startAction,
                endAction,
                duration
            );

        }

    }

    mixer.addEventListener('loop', onLoopFinished);

}

// --------------------------------------------------
// EXECUTE CROSSFADE
// --------------------------------------------------

function executeCrossFade(
    startAction,
    endAction,
    duration
) {

    setWeight(endAction, 1);

    endAction.time = 0;

    startAction.crossFadeTo(
        endAction,
        duration,
        true
    );

}

// --------------------------------------------------
// SET ANIMATION WEIGHT
// --------------------------------------------------

function setWeight(action, weight) {

    action.enabled = true;

    action.setEffectiveTimeScale(1);

    action.setEffectiveWeight(weight);

}

// --------------------------------------------------
// UPDATE GUI WEIGHTS
// --------------------------------------------------

function updateWeightSliders() {

    settings['modify idle weight'] = idleWeight;
    settings['modify walk weight'] = walkWeight;
    settings['modify run weight'] = runWeight;

}

// --------------------------------------------------
// ENABLE / DISABLE CROSSFADE BUTTONS
// --------------------------------------------------

function updateCrossFadeControls() {

    if (
        idleWeight === 1 &&
        walkWeight === 0 &&
        runWeight === 0
    ) {

        crossFadeControls[0].disable();
        crossFadeControls[1].enable();
        crossFadeControls[2].disable();
        crossFadeControls[3].disable();

    }

    if (
        idleWeight === 0 &&
        walkWeight === 1 &&
        runWeight === 0
    ) {

        crossFadeControls[0].enable();
        crossFadeControls[1].disable();
        crossFadeControls[2].enable();
        crossFadeControls[3].disable();

    }

    if (
        idleWeight === 0 &&
        walkWeight === 0 &&
        runWeight === 1
    ) {

        crossFadeControls[0].disable();
        crossFadeControls[1].disable();
        crossFadeControls[2].disable();
        crossFadeControls[3].enable();

    }

}

// --------------------------------------------------
// WINDOW RESIZE
// --------------------------------------------------

function onWindowResize() {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
    );

}

// --------------------------------------------------
// ANIMATION LOOP
// --------------------------------------------------

function animate() {

    timer.update();

    if (!mixer || !idleAction) return;

    // Read current animation weights
    idleWeight = idleAction.getEffectiveWeight();
    walkWeight = walkAction.getEffectiveWeight();
    runWeight = runAction.getEffectiveWeight();

    // Update GUI
    updateWeightSliders();

    updateCrossFadeControls();

    // Frame delta
    let mixerUpdateDelta = timer.getDelta();

    // Single-step mode
    if (singleStepMode) {

        mixerUpdateDelta = sizeOfNextStep;

        sizeOfNextStep = 0;

    }

    // Update animation mixer
    mixer.update(mixerUpdateDelta);

    // Render
    renderer.render(scene, camera);

    // Performance statistics
    stats.update();

}

</script>

</body>
</html>
