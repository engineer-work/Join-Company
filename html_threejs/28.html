
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Three.js - Unreal Bloom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #container {
            width: 100%;
            height: 100vh;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            color: white;
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
            pointer-events: none;
        }

        #info a {
            color: white;
            pointer-events: auto;
        }

        canvas {
            display: block;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="container"></div>

<div id="info">
    <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
    - Unreal Bloom
    <br>
    Model:
    <a href="https://blog.sketchfab.com/art-spotlight-primary-ion-drive/"
       target="_blank" rel="noopener">Primary Ion Drive</a>
    by Mike Murdock, CC Attribution
    <br>
    Left mouse: Rotate | Right mouse: Pan | Wheel: Zoom
</div>

<script type="module">

import * as THREE from 'three';

import Stats from 'three/addons/libs/stats.module.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// --------------------------------------------------
// GLOBAL VARIABLES
// --------------------------------------------------

let camera;
let scene;
let renderer;
let composer;
let mixer;
let stats;
let controls;
let gui;
let bloomPass;
let timer;

let modelReady = false;

const container = document.getElementById('container');

// --------------------------------------------------
// PARAMETERS
// --------------------------------------------------

const params = {

    threshold: 0,
    strength: 1,
    radius: 0.5,
    exposure: 1

};

// --------------------------------------------------
// MODEL URL
// --------------------------------------------------

const MODEL_URL =
    'https://threejs.org/examples/models/gltf/PrimaryIonDrive.glb';

// --------------------------------------------------
// INITIALIZATION
// --------------------------------------------------

init();

async function init() {

    // TIMER

    timer = new THREE.Timer();
    timer.connect(document);

    // SCENE

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);

    // CAMERA

    camera = new THREE.PerspectiveCamera(
        40,
        window.innerWidth / window.innerHeight,
        1,
        100
    );

    camera.position.set(-5, 2.5, -3.5);

    scene.add(camera);

    // AMBIENT LIGHT

    scene.add(
        new THREE.AmbientLight(0xcccccc, 1)
    );

    // POINT LIGHT

    const pointLight = new THREE.PointLight(
        0xffffff,
        100
    );

    camera.add(pointLight);

    // RENDERER

    renderer = new THREE.WebGLRenderer({

        antialias: true

    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = Math.pow(
        params.exposure,
        4.0
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    container.appendChild(renderer.domElement);

    // --------------------------------------------------
    // POST PROCESSING
    // --------------------------------------------------

    const renderScene = new RenderPass(
        scene,
        camera
    );

    bloomPass = new UnrealBloomPass(

        new THREE.Vector2(
            window.innerWidth,
            window.innerHeight
        ),

        1.5,
        0.4,
        0.85

    );

    bloomPass.threshold = params.threshold;
    bloomPass.strength = params.strength;
    bloomPass.radius = params.radius;

    const outputPass = new OutputPass();

    composer = new EffectComposer(renderer);

    composer.addPass(renderScene);

    composer.addPass(bloomPass);

    composer.addPass(outputPass);

    // --------------------------------------------------
    // ORBIT CONTROLS
    // --------------------------------------------------

    controls = new OrbitControls(
        camera,
        renderer.domElement
    );

    controls.maxPolarAngle = Math.PI * 0.5;

    controls.minDistance = 3;

    controls.maxDistance = 8;

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.update();

    // --------------------------------------------------
    // STATS
    // --------------------------------------------------

    stats = new Stats();

    container.appendChild(stats.dom);

    // --------------------------------------------------
    // GUI
    // --------------------------------------------------

    initGUI();

    // --------------------------------------------------
    // LOAD MODEL
    // --------------------------------------------------

    await loadModel();

    // --------------------------------------------------
    // EVENTS
    // --------------------------------------------------

    window.addEventListener(
        'resize',
        onWindowResize
    );

    // Start rendering after initialization.

    renderer.setAnimationLoop(animate);

}

// --------------------------------------------------
// LOAD GLTF MODEL
// --------------------------------------------------

async function loadModel() {

    const loader = new GLTFLoader();

    try {

        console.log('Loading Primary Ion Drive model...');

        const gltf = await loader.loadAsync(MODEL_URL);

        const model = gltf.scene;

        scene.add(model);

        // ANIMATION

        if (gltf.animations && gltf.animations.length > 0) {

            mixer = new THREE.AnimationMixer(model);

            const clip = gltf.animations[0].clone();

            mixer.clipAction(clip).play();

            console.log(
                'Model animation loaded:',
                clip.name || 'Animation'
            );

        } else {

            console.warn('No animation found in this GLB model.');

        }

        modelReady = true;

        console.log('Primary Ion Drive loaded successfully.');

    } catch (error) {

        console.error('Model loading failed:', error);

        const message = document.createElement('div');

        message.style.cssText = `
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(100, 0, 0, 0.85);
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 80%;
            text-align: center;
            z-index: 20;
        `;

        message.textContent =
            'Unable to load Primary Ion Drive. Check the browser console and internet connection.';

        container.appendChild(message);

    }

}

// --------------------------------------------------
// GUI
// --------------------------------------------------

function initGUI() {

    gui = new GUI();

    // BLOOM SETTINGS

    const bloomFolder = gui.addFolder('Bloom');

    bloomFolder.add(
        params,
        'threshold',
        0.0,
        1.0
    ).onChange(function(value) {

        bloomPass.threshold = Number(value);

    });

    bloomFolder.add(
        params,
        'strength',
        0.0,
        3.0
    ).onChange(function(value) {

        bloomPass.strength = Number(value);

    });

    bloomFolder.add(
        params,
        'radius',
        0.0,
        1.0
    ).step(0.01).onChange(function(value) {

        bloomPass.radius = Number(value);

    });

    bloomFolder.open();

    // TONE MAPPING

    const toneMappingFolder = gui.addFolder(
        'Tone Mapping'
    );

    toneMappingFolder.add(
        params,
        'exposure',
        0.1,
        2
    ).onChange(function(value) {

        renderer.toneMappingExposure =
            Math.pow(Number(value), 4.0);

    });

}

// --------------------------------------------------
// RESIZE
// --------------------------------------------------

function onWindowResize() {

    const width = window.innerWidth;
    const height = window.innerHeight;

    camera.aspect = width / height;

    camera.updateProjectionMatrix();

    renderer.setSize(width, height);

    composer.setSize(width, height);

    bloomPass.resolution.set(width, height);

}

// --------------------------------------------------
// ANIMATION
// --------------------------------------------------

function animate() {

    timer.update();

    const delta = timer.getDelta();

    // UPDATE MODEL ANIMATION

    if (mixer && modelReady) {

        mixer.update(delta);

    }

    // UPDATE CONTROLS

    controls.update();

    // UPDATE PERFORMANCE

    stats.update();

    // POST-PROCESSING RENDER

    composer.render(delta);

}

// --------------------------------------------------
// CLEANUP
// --------------------------------------------------

window.addEventListener('pagehide', () => {

    renderer.setAnimationLoop(null);

    controls.dispose();

    gui.destroy();

    timer.dispose();

    composer.dispose();

});

</script>

</body>
</html>
