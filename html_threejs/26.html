
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Three.js - PointLight ShadowMap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 13px;
            z-index: 10;
        }

        #info a {
            color: #fff;
        }

        canvas {
            display: block;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="info">
    <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
    - PointLight ShadowMap
    <br>
    Left mouse: Rotate | Right mouse: Pan | Wheel: Zoom
</div>

<script type="module">

import * as THREE from 'three';

import Stats from 'three/addons/libs/stats.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --------------------------------------------------
// GLOBAL VARIABLES
// --------------------------------------------------

let camera;
let scene;
let renderer;
let stats;
let controls;

let pointLight;
let pointLight2;

const clock = new THREE.Timer();

// --------------------------------------------------
// INITIALIZATION
// --------------------------------------------------

init();

function init() {

    // CAMERA

    camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        1,
        1000
    );

    camera.position.set(0, 10, 40);

    // SCENE

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);

    scene.add(
        new THREE.AmbientLight(0x111122, 3)
    );

    // POINT LIGHTS

    pointLight = createLight(0x0088ff);
    scene.add(pointLight);

    pointLight2 = createLight(0xff8888);
    scene.add(pointLight2);

    // ENCLOSURE

    const geometry = new THREE.BoxGeometry(
        30,
        30,
        30
    );

    const material = new THREE.MeshPhongMaterial({

        color: 0xa0adaf,
        shininess: 10,
        specular: 0x111111,
        side: THREE.BackSide

    });

    const enclosure = new THREE.Mesh(
        geometry,
        material
    );

    enclosure.position.y = 10;

    enclosure.receiveShadow = true;

    scene.add(enclosure);

    // RENDERER

    renderer = new THREE.WebGLRenderer({

        antialias: true

    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type = THREE.PCFShadowMap;

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);

    // ORBIT CONTROLS

    controls = new OrbitControls(
        camera,
        renderer.domElement
    );

    controls.target.set(0, 10, 0);

    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    controls.enableRotate = true;
    controls.enableZoom = true;
    controls.enablePan = true;

    controls.minDistance = 10;
    controls.maxDistance = 100;

    controls.update();

    // STATS

    stats = new Stats();

    document.body.appendChild(stats.dom);

    // TIMER

    clock.connect(document);

    // RESIZE EVENT

    window.addEventListener(
        'resize',
        onWindowResize
    );

    // ANIMATION

    renderer.setAnimationLoop(animate);

}

// --------------------------------------------------
// CREATE POINT LIGHT
// --------------------------------------------------

function createLight(color) {

    const intensity = 200;

    const light = new THREE.PointLight(
        color,
        intensity,
        20
    );

    light.castShadow = true;

    light.shadow.bias = -0.005;

    // Shadow map resolution
    light.shadow.mapSize.setScalar(128);

    light.shadow.radius = 10;

    // LIGHT SOURCE SPHERE

    const lightGeometry = new THREE.SphereGeometry(
        0.3,
        12,
        6
    );

    const lightMaterial = new THREE.MeshBasicMaterial({

        color: color

    });

    lightMaterial.color.multiplyScalar(intensity);

    const lightSphere = new THREE.Mesh(
        lightGeometry,
        lightMaterial
    );

    light.add(lightSphere);

    // TRANSPARENT PATTERN TEXTURE

    const texture = new THREE.CanvasTexture(
        generateTexture()
    );

    texture.magFilter = THREE.NearestFilter;

    texture.wrapT = THREE.RepeatWrapping;
    texture.wrapS = THREE.RepeatWrapping;

    texture.repeat.set(1, 4.5);

    // OUTER SPHERE

    const sphereGeometry = new THREE.SphereGeometry(
        2,
        32,
        32
    );

    const sphereMaterial = new THREE.MeshPhongMaterial({

        color: 0xffffff,

        side: THREE.DoubleSide,

        alphaMap: texture,

        alphaTest: 0.5

    });

    const sphere = new THREE.Mesh(
        sphereGeometry,
        sphereMaterial
    );

    sphere.castShadow = true;
    sphere.receiveShadow = true;

    light.add(sphere);

    return light;

}

// --------------------------------------------------
// GENERATE PATTERN TEXTURE
// --------------------------------------------------

function generateTexture() {

    const canvas = document.createElement('canvas');

    canvas.width = 2;
    canvas.height = 2;

    const context = canvas.getContext('2d');

    context.fillStyle = 'white';

    context.fillRect(0, 1, 2, 1);

    return canvas;

}

// --------------------------------------------------
// WINDOW RESIZE
// --------------------------------------------------

function onWindowResize() {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}

// --------------------------------------------------
// ANIMATION
// --------------------------------------------------

function animate() {

    clock.update();

    const time = clock.getElapsed();

    // BLUE LIGHT

    pointLight.position.x =
        Math.sin(time * 0.6) * 9;

    pointLight.position.y =
        Math.sin(time * 0.7) * 9 + 6;

    pointLight.position.z =
        Math.sin(time * 0.8) * 9;

    pointLight.rotation.x = time;
    pointLight.rotation.z = time;

    // RED LIGHT
    // Preserve the original 10000-second phase offset.

    const time2 = time + 10000;

    pointLight2.position.x =
        Math.sin(time2 * 0.6) * 9;

    pointLight2.position.y =
        Math.sin(time2 * 0.7) * 9 + 6;

    pointLight2.position.z =
        Math.sin(time2 * 0.8) * 9;

    pointLight2.rotation.x = time2;
    pointLight2.rotation.z = time2;

    // CONTROLS

    controls.update();

    // RENDER

    renderer.render(scene, camera);

    // PERFORMANCE

    stats.update();

}

// --------------------------------------------------
// CLEANUP
// --------------------------------------------------

window.addEventListener('pagehide', () => {

    renderer.setAnimationLoop(null);

    controls.dispose();

    clock.dispose();

});

</script>

</body>
</html>
