
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js WebGPU - Compute Particles</title>
    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 18px;
            left: 20px;
            z-index: 10;
            color: white;
            pointer-events: none;
            line-height: 1.6;
        }

        #info a {
            color: #fff;
            text-decoration: none;
            pointer-events: auto;
        }

        #info .title {
            font-size: 17px;
            font-weight: bold;
        }

        #info small {
            color: #aaa;
            font-size: 12px;
        }

        #error {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
            color: white;
            background: #111;
            text-align: center;
            z-index: 20;
            line-height: 1.6;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
            "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
            "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.tsl.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="info">
        <div class="title">
            <a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>
            - Compute Particles
        </div>
        <small>200,000 GPU-computed particles</small>
        <br>
        <small>Move your mouse to interact. Drag to orbit.</small>
    </div>

    <div id="error"></div>

    <script type="module">

        import * as THREE from 'three/webgpu';

        import {
            Fn,
            If,
            uniform,
            float,
            uv,
            vec3,
            hash,
            shapeCircle,
            instancedArray,
            instanceIndex
        } from 'three/tsl';

        import { Inspector } from 'three/addons/inspector/Inspector.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --------------------------------------------------
        // CONFIGURATION
        // --------------------------------------------------

        const particleCount = 200000;

        const gravity = uniform(-0.00098);
        const bounce = uniform(0.8);
        const friction = uniform(0.99);
        const particleSize = uniform(0.12);

        const clickPosition = uniform(new THREE.Vector3());

        let camera;
        let scene;
        let renderer;
        let controls;
        let computeParticles;

        let isOrbitControlsActive = false;

        const errorElement = document.getElementById('error');

        // --------------------------------------------------
        // INITIALIZATION
        // --------------------------------------------------

        init().catch((error) => {

            console.error('Particle initialization failed:', error);

            errorElement.style.display = 'flex';
            errorElement.innerHTML = `
                <div>
                    <h2>WebGPU initialization failed</h2>
                    <p>${error.message}</p>
                    <p>
                        This example requires a browser and GPU
                        that support WebGPU.
                    </p>
                    <p>Open the browser console for more details.</p>
                </div>
            `;

        });

        async function init() {

            // --------------------------------------------------
            // CAMERA
            // --------------------------------------------------

            camera = new THREE.PerspectiveCamera(
                50,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );

            camera.position.set(0, 5, 20);

            // --------------------------------------------------
            // SCENE
            // --------------------------------------------------

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // --------------------------------------------------
            // GPU BUFFERS
            // --------------------------------------------------

            const positions = instancedArray(
                particleCount,
                'vec3'
            );

            const velocities = instancedArray(
                particleCount,
                'vec3'
            );

            const colors = instancedArray(
                particleCount,
                'vec3'
            );

            // --------------------------------------------------
            // INITIALIZE PARTICLES
            // --------------------------------------------------

            const separation = 0.2;
            const amount = Math.sqrt(particleCount);
            const offset = float(amount / 2);

            const computeInit = Fn(() => {

                const position = positions.element(instanceIndex);
                const color = colors.element(instanceIndex);

                const x = instanceIndex.mod(amount);
                const z = instanceIndex.div(amount);

                position.x = offset.sub(x).mul(separation);
                position.y = 0;
                position.z = offset.sub(z).mul(separation);

                color.x = hash(instanceIndex);
                color.y = hash(instanceIndex.add(2));
                color.z = hash(instanceIndex.add(4));

            })()
                .compute(particleCount)
                .setName('Initialize Particles');

            // --------------------------------------------------
            // PARTICLE PHYSICS
            // --------------------------------------------------

            const computeUpdate = Fn(() => {

                const position = positions.element(instanceIndex);
                const velocity = velocities.element(instanceIndex);

                // Gravity
                velocity.addAssign(
                    vec3(0.0, gravity, 0.0)
                );

                // Update position
                position.addAssign(velocity);

                // Air friction
                velocity.mulAssign(friction);

                // Floor collision
                If(position.y.lessThan(0), () => {

                    position.y = 0;

                    velocity.y = velocity.y
                        .negate()
                        .mul(bounce);

                    // Floor friction
                    velocity.x = velocity.x.mul(0.9);
                    velocity.z = velocity.z.mul(0.9);

                });

            });

            computeParticles = computeUpdate()
                .compute(particleCount)
                .setName('Update Particles');

            // --------------------------------------------------
            // PARTICLE MATERIAL
            // --------------------------------------------------

            const material = new THREE.SpriteNodeMaterial();

            material.colorNode =
                uv().mul(colors.element(instanceIndex));

            material.positionNode = positions.toAttribute();

            material.scaleNode = particleSize;

            material.opacityNode = shapeCircle();

            material.alphaToCoverage = true;
            material.transparent = true;

            // --------------------------------------------------
            // PARTICLE SPRITE
            // --------------------------------------------------

            const particles = new THREE.Sprite(material);

            particles.count = particleCount;
            particles.frustumCulled = false;

            scene.add(particles);

            // --------------------------------------------------
            // GRID
            // --------------------------------------------------

            const helper = new THREE.GridHelper(
                90,
                45,
                0x303030,
                0x303030
            );

            scene.add(helper);

            // --------------------------------------------------
            // INVISIBLE INTERACTION PLANE
            // --------------------------------------------------

            const planeGeometry = new THREE.PlaneGeometry(
                200,
                200
            );

            planeGeometry.rotateX(-Math.PI / 2);

            const plane = new THREE.Mesh(
                planeGeometry,
                new THREE.MeshBasicMaterial({
                    visible: false
                })
            );

            scene.add(plane);

            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();

            // --------------------------------------------------
            // WEBGPU RENDERER
            // --------------------------------------------------

            renderer = new THREE.WebGPURenderer({
                antialias: true
            });

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 1.5)
            );

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.setClearColor(0x000000);

            renderer.inspector = new Inspector();

            document.body.appendChild(renderer.domElement);

            // Initialize WebGPU before compute or rendering.
            await renderer.init();

            // --------------------------------------------------
            // INITIAL COMPUTE
            // --------------------------------------------------

            renderer.compute(computeInit);

            // --------------------------------------------------
            // PARTICLE INTERACTION
            // --------------------------------------------------

            const computeHit = Fn(() => {

                const position = positions.element(instanceIndex);
                const velocity = velocities.element(instanceIndex);

                const dist = position.distance(clickPosition);

                const direction = position
                    .sub(clickPosition)
                    .normalize();

                const distArea = float(3)
                    .sub(dist)
                    .max(0);

                const power = distArea.mul(0.01);

                const relativePower = power.mul(
                    hash(instanceIndex).mul(1.5).add(0.5)
                );

                velocity.assign(
                    velocity.add(
                        direction.mul(relativePower)
                    )
                );

            })()
                .compute(particleCount)
                .setName('Hit Particles');

            // --------------------------------------------------
            // POINTER MOVEMENT
            // --------------------------------------------------

            function onMove(event) {

                if (isOrbitControlsActive) return;

                pointer.set(
                    (event.clientX / window.innerWidth) * 2 - 1,
                    -(event.clientY / window.innerHeight) * 2 + 1
                );

                raycaster.setFromCamera(pointer, camera);

                const intersects = raycaster.intersectObject(
                    plane,
                    false
                );

                if (intersects.length > 0) {

                    const point = intersects[0].point;

                    clickPosition.value.copy(point);

                    // Apply force slightly below the floor.
                    clickPosition.value.y = -1;

                    renderer.compute(computeHit);

                }

            }

            renderer.domElement.addEventListener(
                'pointermove',
                onMove
            );

            // --------------------------------------------------
            // ORBIT CONTROLS
            // --------------------------------------------------

            controls = new OrbitControls(
                camera,
                renderer.domElement
            );

            controls.enableDamping = true;

            controls.minDistance = 5;
            controls.maxDistance = 200;

            controls.target.set(0, -8, 0);

            controls.update();

            controls.addEventListener('start', () => {

                isOrbitControlsActive = true;

            });

            controls.addEventListener('end', () => {

                isOrbitControlsActive = false;

            });

            controls.touches = {
                ONE: null,
                TWO: THREE.TOUCH.DOLLY_PAN
            };

            // --------------------------------------------------
            // GUI
            // --------------------------------------------------

            const gui = renderer.inspector.createParameters(
                'Settings'
            );

            gui.add(
                gravity,
                'value',
                -0.0098,
                0,
                0.0001
            ).name('Gravity');

            gui.add(
                bounce,
                'value',
                0.1,
                1,
                0.01
            ).name('Bounce');

            gui.add(
                friction,
                'value',
                0.96,
                0.99,
                0.01
            ).name('Friction');

            gui.add(
                particleSize,
                'value',
                0.12,
                0.5,
                0.01
            ).name('Particle Size');

            // --------------------------------------------------
            // RESIZE
            // --------------------------------------------------

            window.addEventListener(
                'resize',
                onWindowResize
            );

            // Start animation only after initialization.
            renderer.setAnimationLoop(animate);

        }

        // --------------------------------------------------
        // WINDOW RESIZE
        // --------------------------------------------------

        function onWindowResize() {

            if (!camera || !renderer) return;

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }

        // --------------------------------------------------
        // ANIMATION
        // --------------------------------------------------

        function animate() {

            if (!renderer || !controls) return;

            controls.update();

            renderer.compute(computeParticles);

            renderer.render(scene, camera);

        }

    </script>

</body>
</html>
