
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three.js - Ocean Shader</title>

    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #071522;
            font-family: Arial, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
        }

        #container canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            color: white;
            font-size: 14px;
            text-shadow: 0 1px 4px #000;
            pointer-events: none;
        }

        #info a {
            color: #00aeef;
            text-decoration: none;
            pointer-events: auto;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="container"></div>

<div id="info">
    <a href="https://threejs.org" target="_blank" rel="noopener">
        three.js
    </a>
    - WebGL Ocean
</div>

<script type="module">

import * as THREE from "three";

import Stats from "three/addons/libs/stats.module.js";

import { GUI } from "three/addons/libs/lil-gui.module.min.js";

import { OrbitControls } from
    "three/addons/controls/OrbitControls.js";

import { Water } from
    "three/addons/objects/Water.js";

import { Sky } from
    "three/addons/objects/Sky.js";

import { EffectComposer } from
    "three/addons/postprocessing/EffectComposer.js";

import { RenderPass } from
    "three/addons/postprocessing/RenderPass.js";

import { UnrealBloomPass } from
    "three/addons/postprocessing/UnrealBloomPass.js";

import { OutputPass } from
    "three/addons/postprocessing/OutputPass.js";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let container;

let camera;
let scene;
let renderer;

let controls;
let stats;

let water;
let sun;
let sky;
let mesh;

let composer;
let bloomPass;

let pmremGenerator;
let renderTarget;

const clock = new THREE.Clock();


/* =========================================================
   PARAMETERS
========================================================= */

const parameters = {

    elevation: 2,

    azimuth: 180,

    exposure: 0.5,

    waterDistortion: 3.7,

    waterSize: 1,

    bloomStrength: 0.1,

    bloomRadius: 0,

    bloomThreshold: 0

};


/* =========================================================
   INITIALIZATION
========================================================= */

init();


function init() {

    container = document.getElementById("container");

    createRenderer();

    createScene();

    createCamera();

    createLights();

    createWater();

    createSky();

    createEnvironment();

    createObject();

    createControls();

    createPostProcessing();

    createStats();

    createGUI();

    window.addEventListener(
        "resize",
        onWindowResize
    );

    renderer.setAnimationLoop(animate);

}


/* =========================================================
   RENDERER
========================================================= */

function createRenderer() {

    renderer = new THREE.WebGLRenderer({

        antialias: true,

        powerPreference: "high-performance"

    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = parameters.exposure;

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    container.appendChild(renderer.domElement);

}


/* =========================================================
   SCENE
========================================================= */

function createScene() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87bde0);

}


/* =========================================================
   CAMERA
========================================================= */

function createCamera() {

    camera = new THREE.PerspectiveCamera(

        55,

        window.innerWidth / window.innerHeight,

        1,

        20000

    );

    camera.position.set(30, 30, 100);

}


/* =========================================================
   LIGHTING
========================================================= */

function createLights() {

    const ambientLight = new THREE.AmbientLight(

        0xffffff,

        0.5

    );

    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(

        0xffffff,

        2

    );

    directionalLight.position.set(50, 100, 50);

    scene.add(directionalLight);

}


/* =========================================================
   WATER
========================================================= */

function createWater() {

    const waterGeometry = new THREE.PlaneGeometry(

        10000,

        10000

    );

    const waterNormals = new THREE.TextureLoader().load(

        "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/textures/waternormals.jpg",

        (texture) => {

            texture.wrapS = THREE.RepeatWrapping;

            texture.wrapT = THREE.RepeatWrapping;

        },

        undefined,

        (error) => {

            console.error(
                "Water normal texture loading failed:",
                error
            );

        }

    );


    water = new Water(

        waterGeometry,

        {

            textureWidth: 512,

            textureHeight: 512,

            waterNormals: waterNormals,

            sunDirection: new THREE.Vector3(),

            sunColor: 0xffffff,

            waterColor: 0x001e0f,

            distortionScale: parameters.waterDistortion,

            fog: false

        }

    );

    water.rotation.x = -Math.PI / 2;

    scene.add(water);

}


/* =========================================================
   SKY
========================================================= */

function createSky() {

    sky = new Sky();

    sky.scale.setScalar(10000);

    scene.add(sky);


    const skyUniforms = sky.material.uniforms;

    skyUniforms.turbidity.value = 10;

    skyUniforms.rayleigh.value = 2;

    skyUniforms.mieCoefficient.value = 0.005;

    skyUniforms.mieDirectionalG.value = 0.8;

}


/* =========================================================
   ENVIRONMENT AND SUN
========================================================= */

function createEnvironment() {

    sun = new THREE.Vector3();

    pmremGenerator = new THREE.PMREMGenerator(renderer);

    updateSun();

}


function updateSun() {

    const phi = THREE.MathUtils.degToRad(

        90 - parameters.elevation

    );

    const theta = THREE.MathUtils.degToRad(

        parameters.azimuth

    );


    sun.setFromSphericalCoords(

        1,

        phi,

        theta

    );


    // Update sky lighting.

    sky.material.uniforms.sunPosition.value.copy(sun);


    // Update water lighting.

    water.material.uniforms.sunDirection.value
        .copy(sun)
        .normalize();


    // Generate environment reflections.

    if (renderTarget) {

        renderTarget.dispose();

    }

    const environmentScene = new THREE.Scene();

    environmentScene.add(sky);

    renderTarget = pmremGenerator.fromScene(
        environmentScene
    );

    scene.add(sky);

    scene.environment = renderTarget.texture;

}


/* =========================================================
   3D OBJECT
========================================================= */

function createObject() {

    const geometry = new THREE.BoxGeometry(

        30,

        30,

        30

    );

    const material = new THREE.MeshStandardMaterial({

        color: 0xffffff,

        roughness: 0.1,

        metalness: 0.2

    });

    mesh = new THREE.Mesh(

        geometry,

        material

    );

    mesh.position.set(0, 5, 0);

    scene.add(mesh);

}


/* =========================================================
   ORBIT CONTROLS
========================================================= */

function createControls() {

    controls = new OrbitControls(

        camera,

        renderer.domElement

    );

    controls.maxPolarAngle = Math.PI * 0.495;

    controls.target.set(0, 10, 0);

    controls.minDistance = 40;

    controls.maxDistance = 200;

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.update();

}


/* =========================================================
   POST PROCESSING - BLOOM
========================================================= */

function createPostProcessing() {

    composer = new EffectComposer(renderer);


    // Render the scene.

    const renderPass = new RenderPass(

        scene,

        camera

    );

    composer.addPass(renderPass);


    // Bloom effect.

    bloomPass = new UnrealBloomPass(

        new THREE.Vector2(
            window.innerWidth,
            window.innerHeight
        ),

        parameters.bloomStrength,

        parameters.bloomRadius,

        parameters.bloomThreshold

    );

    composer.addPass(bloomPass);


    // Final color output.

    const outputPass = new OutputPass();

    composer.addPass(outputPass);

}


/* =========================================================
   STATS
========================================================= */

function createStats() {

    stats = new Stats();

    container.appendChild(stats.dom);

}


/* =========================================================
   GUI CONTROLS
========================================================= */

function createGUI() {

    const gui = new GUI();


    /* -----------------------------------------
       SKY
    ----------------------------------------- */

    const folderSky = gui.addFolder("Sky");

    folderSky.add(
        parameters,
        "elevation",
        0,
        90,
        0.1
    ).onChange(updateSun);

    folderSky.add(
        parameters,
        "azimuth",
        -180,
        180,
        0.1
    ).onChange(updateSun);

    folderSky.add(
        parameters,
        "exposure",
        0,
        1,
        0.01
    ).onChange((value) => {

        renderer.toneMappingExposure = value;

    });

    folderSky.open();


    /* -----------------------------------------
       WATER
    ----------------------------------------- */

    const folderWater = gui.addFolder("Water");

    folderWater.add(
        parameters,
        "waterDistortion",
        0,
        8,
        0.1
    ).name("Distortion").onChange((value) => {

        water.material.uniforms.distortionScale.value = value;

    });

    folderWater.add(
        water.material.uniforms.size,
        "value",
        0.1,
        10,
        0.1
    ).name("Size");

    folderWater.open();


    /* -----------------------------------------
       BLOOM
    ----------------------------------------- */

    const folderBloom = gui.addFolder("Bloom");

    folderBloom.add(
        bloomPass,
        "strength",
        0,
        3,
        0.01
    );

    folderBloom.add(
        bloomPass,
        "radius",
        0,
        1,
        0.01
    );

    folderBloom.add(
        bloomPass,
        "threshold",
        0,
        1,
        0.01
    );

    folderBloom.open();


    /* -----------------------------------------
       SKY ATMOSPHERE
    ----------------------------------------- */

    const folderAtmosphere = gui.addFolder("Atmosphere");

    const skyUniforms = sky.material.uniforms;

    folderAtmosphere.add(
        skyUniforms.turbidity,
        "value",
        0,
        20,
        0.1
    ).name("Turbidity");

    folderAtmosphere.add(
        skyUniforms.rayleigh,
        "value",
        0,
        4,
        0.1
    ).name("Rayleigh");

    folderAtmosphere.add(
        skyUniforms.mieCoefficient,
        "value",
        0,
        0.1,
        0.001
    ).name("Mie coefficient");

    folderAtmosphere.add(
        skyUniforms.mieDirectionalG,
        "value",
        0,
        1,
        0.01
    ).name("Mie direction");

    folderAtmosphere.open();

}


/* =========================================================
   WINDOW RESIZE
========================================================= */

function onWindowResize() {

    camera.aspect = window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    composer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    bloomPass.resolution.set(

        window.innerWidth,

        window.innerHeight

    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    const delta = Math.min(clock.getDelta(), 0.05);

    const time = clock.elapsedTime;


    // Animate floating object.

    mesh.position.y = Math.sin(time) * 20 + 5;

    mesh.rotation.x = time * 0.5;

    mesh.rotation.z = time * 0.51;


    // Animate water.

    water.material.uniforms.time.value += delta;


    // Update camera controls.

    controls.update();


    // Render with bloom.

    composer.render();


    // Update FPS statistics.

    stats.update();

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener("pagehide", () => {

    renderer.setAnimationLoop(null);

    if (renderTarget) {

        renderTarget.dispose();

    }

    pmremGenerator.dispose();

    composer.dispose();

    controls.dispose();

    renderer.dispose();

});

</script>

</body>
</html>
