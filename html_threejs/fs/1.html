 if(activeSoldierAction===action)return;
 action.reset();
 action.enabled=true;
 action.setEffectiveTimeScale(1);
 action.setEffectiveWeight(1);

 action.play();
 if(activeSoldierAction)activeSoldierAction.fadeOut(0.2);
 activeSoldierAction=action;
}

function openPortfolio(){
 portfolioOpen=true;
 portfolioPage=0;
 drawPortfolioScreen();
 portfolioGroup.visible=true;

 // Release pointer lock so the screen can be clicked.
 if(document.pointerLockElement)document.exitPointerLock();

 // Stop any movement keys that were held.
 for(const key in keyStates)keyStates[key]=false;
}

function closePortfolio(){
 portfolioOpen=false;
 portfolioGroup.visible=false;
 for(const key in keyStates)keyStates[key]=false;
}

function togglePortfolio(){
 if(portfolioOpen)closePortfolio();
 else openPortfolio();
}

const screenRaycaster=new THREE.Raycaster();
const screenMouse=new THREE.Vector2();

function clickPortfolioScreen(event){
 const rect=renderer.domElement.getBoundingClientRect();
 screenMouse.x=((event.clientX-rect.left)/rect.width)*2-1;
 screenMouse.y=-((event.clientY-rect.top)/rect.height)*2+1;

 screenRaycaster.setFromCamera(screenMouse,camera);
 const hits=screenRaycaster.intersectObject(screenMesh,false);
 if(!hits.length)return false;

 const uv=hits[0].uv;
 const px=uv.x*SCREEN_W;
 const py=(1-uv.y)*SCREEN_H;

 for(const area of portfolioHitAreas){
  if(px>=area.x&&px<=area.x+area.w&&py>=area.y&&py<=area.y+area.h){
   if(area.close){closePortfolio();return true;}
   if(area.page!==undefined){
    portfolioPage=area.page;
    drawPortfolioScreen();
    return true;
   }
   if(area.url){
    window.open(area.url,'_blank','noopener,noreferrer');
    return true;
   }
  }
 }
 return true;
}

  togglePortfolio();

// --------------------------------------------------
// PLAYER COLLISION AND PHYSICS
// --------------------------------------------------
function playerCollisions(){
 const result=worldOctree.capsuleIntersect(playerCollider);
 playerOnFloor=false;
 if(result){
  playerOnFloor=result.normal.y>=0.15;
  if(!playerOnFloor){
   playerVelocity.addScaledVector(
    result.normal,-result.normal.dot(playerVelocity)
   );
  }
  if(result.depth>=1e-10){
   playerCollider.translate(result.normal.multiplyScalar(result.depth));
  }
 }
}

function updatePlayer(deltaTime){
 let damping=Math.exp(-4*deltaTime)-1;
 if(!playerOnFloor){
  playerVelocity.y-=GRAVITY*deltaTime;
  damping*=0.1;
 }
 playerVelocity.addScaledVector(playerVelocity,damping);
 playerCollider.translate(playerVelocity.clone().multiplyScalar(deltaTime));
 playerCollisions();
}

const vector1=new THREE.Vector3();
const vector2=new THREE.Vector3();
const vector3=new THREE.Vector3();

function playerSphereCollision(sphere){
 const center=new THREE.Vector3().addVectors(
  playerCollider.start,playerCollider.end
 ).multiplyScalar(0.5);

 const sphereCenter=sphere.collider.center;
 const radius=playerCollider.radius+sphere.collider.radius;
 const radiusSquared=radius*radius;

 for(const point of [playerCollider.start,playerCollider.end,center]){
  const distanceSquared=point.distanceToSquared(sphereCenter);
  if(distanceSquared<radiusSquared){
   const normal=vector1.subVectors(point,sphereCenter).normalize();
   const v1=vector2.copy(normal).multiplyScalar(normal.dot(playerVelocity));
   const v2=vector3.copy(normal).multiplyScalar(normal.dot(sphere.velocity));
   playerVelocity.add(v2).sub(v1);
   sphere.velocity.add(v1).sub(v2);
   const distance=(radius-Math.sqrt(distanceSquared))/2;
   sphereCenter.addScaledVector(normal,-distance);
  }
 }
}

function spheresCollisions(){
 for(let i=0;i<spheres.length;i++){
  const s1=spheres[i];
  for(let j=i+1;j<spheres.length;j++){
   const s2=spheres[j];
   const distanceSquared=s1.collider.center.distanceToSquared(s2.collider.center);
   const radius=s1.collider.radius+s2.collider.radius;
   if(distanceSquared<radius*radius){
    const normal=vector1.subVectors(s1.collider.center,s2.collider.center).normalize();
    const v1=vector2.copy(normal).multiplyScalar(normal.dot(s1.velocity));
    const v2=vector3.copy(normal).multiplyScalar(normal.dot(s2.velocity));
    s1.velocity.add(v2).sub(v1);
    s2.velocity.add(v1).sub(v2);
    const distance=(radius-Math.sqrt(distanceSquared))/2;
    s1.collider.center.addScaledVector(normal,distance);
    s2.collider.center.addScaledVector(normal,-distance);
   }
  }
 }
}

function updateSpheres(deltaTime){
 for(const sphere of spheres){
  sphere.collider.center.addScaledVector(sphere.velocity,deltaTime);
  const result=worldOctree.sphereIntersect(sphere.collider);
  if(result){
   sphere.velocity.addScaledVector(
    result.normal,-result.normal.dot(sphere.velocity)*1.5
   );
   sphere.collider.center.add(result.normal.multiplyScalar(result.depth));
  }else{
   sphere.velocity.y-=GRAVITY*deltaTime;
  }
  const damping=Math.exp(-1.5*deltaTime)-1;
  sphere.velocity.addScaledVector(sphere.velocity,damping);
  playerSphereCollision(sphere);
 }
 spheresCollisions();
 for(const sphere of spheres)sphere.mesh.position.copy(sphere.collider.center);
}

// --------------------------------------------------
// MOVEMENT — DIRECTIONS ARE BASED ON CAMERA YAW
// --------------------------------------------------
const forwardVector=new THREE.Vector3();
const rightVector=new THREE.Vector3();

function getForwardVector(){
 forwardVector.set(-Math.sin(cameraYaw),0,-Math.cos(cameraYaw));
 return forwardVector;
}

function getRightVector(){
 rightVector.set(Math.cos(cameraYaw),0,-Math.sin(cameraYaw));
 return rightVector;
}

function controls(deltaTime){
 if(portfolioOpen)return;

 const running=keyStates.ShiftLeft||keyStates.ShiftRight;
 const speedDelta=deltaTime*(playerOnFloor?25:8)*(running?1.7:1);

 if(keyStates.KeyW||keyStates.ArrowUp){
  playerVelocity.addScaledVector(getForwardVector(),speedDelta);
 }
 if(keyStates.KeyS||keyStates.ArrowDown){
  playerVelocity.addScaledVector(getForwardVector(),-speedDelta);
 }
 if(keyStates.KeyA||keyStates.ArrowLeft){
  playerVelocity.addScaledVector(getRightVector(),-speedDelta);
 }
 if(keyStates.KeyD||keyStates.ArrowRight){
  playerVelocity.addScaledVector(getRightVector(),speedDelta);
 }
 if(playerOnFloor&&keyStates.Space){
  playerVelocity.y=JUMP_SPEED;
  playerOnFloor=false;
 }
}

// --------------------------------------------------
// CAMERA COLLISION
// --------------------------------------------------
const cameraOrigin=new THREE.Vector3();
const cameraDirection=new THREE.Vector3();

function updateThirdPersonCamera(){
 const playerHead=playerCollider.end;

 cameraOrigin.copy(playerHead);
 cameraOrigin.y+=0.15;

 const horizontalDistance=portfolioOpen?7.2:4.5;
 const verticalOffset=portfolioOpen?2.5:1.2;

 // Camera stays behind the player relative to the viewing direction.
 cameraDesired.set(
  playerHead.x+Math.sin(cameraYaw)*horizontalDistance,
  playerHead.y+verticalOffset+Math.sin(cameraPitch)*1.5,
  playerHead.z+Math.cos(cameraYaw)*horizontalDistance
 );

 if(!portfolioOpen){
  // Ray collision keeps the camera from going through world walls.
  cameraDirection.subVectors(cameraDesired,cameraOrigin);
  const desiredDistance=cameraDirection.length();
  cameraDirection.normalize();

  cameraRay.origin.copy(cameraOrigin);
  cameraRay.direction.copy(cameraDirection);

  const wallHit=worldOctree.rayIntersect(cameraRay);
  if(wallHit){
   const safeDistance=Math.max(0.25,Math.min(
    desiredDistance,wallHit.distance-0.25
   ));
   cameraDesired.copy(cameraOrigin).addScaledVector(cameraDirection,safeDistance);
  }

  camera.position.copy(cameraDesired);
  cameraTarget.copy(playerHead);
  cameraTarget.y+=0.55;
 }else{
  // While inspecting the 3D screen, aim the camera at the display.
  camera.position.copy(cameraDesired);
  cameraTarget.copy(portfolioGroup.position);
  cameraTarget.y+=0.15;
 }

 camera.lookAt(cameraTarget);
}

const soldierMoveDirection=new THREE.Vector3();

function updateSoldier(){
 if(!soldierLoaded||!soldier)return;

 characterRoot.position.set(
  playerCollider.start.x,
  playerCollider.start.y-playerCollider.radius,
  playerCollider.start.z
 );

 soldierMoveDirection.set(playerVelocity.x,0,playerVelocity.z);
 const speed=soldierMoveDirection.length();

 if(speed>0.15){
  soldierMoveDirection.normalize();
  // Soldier model faces the opposite local direction, so compensate.
  characterRoot.rotation.y=Math.atan2(
   soldierMoveDirection.x,soldierMoveDirection.z
  )-Math.PI;

  const running=keyStates.ShiftLeft||keyStates.ShiftRight;
  playSoldierAnimation(running?'run':'walk');
 }else{
  playSoldierAnimation('idle');
 }
}

// --------------------------------------------------
// PORTFOLIO DISPLAY POSITION IN THE GAME WORLD
// --------------------------------------------------
function updatePortfolioPosition(){
 if(!portfolioOpen)return;

 const px=-Math.sin(cameraYaw);
 const pz=-Math.cos(cameraYaw);

 // Place the screen in front of the player, inside the 3D world.
 portfolioGroup.position.set(
  playerCollider.start.x+px*3.2,
  playerCollider.start.y+1.6,
  playerCollider.start.z+pz*3.2
 );

 // Its front faces the player.
 portfolioGroup.rotation.set(0,cameraYaw,0);
}

// --------------------------------------------------
// THROW BALL
// --------------------------------------------------
function throwBall(){
 if(portfolioOpen)return;

 const sphere=spheres[sphereIdx];
 camera.getWorldDirection(playerDirection);

 sphere.collider.center.copy(playerCollider.end).addScaledVector(
  playerDirection,playerCollider.radius*1.5
 );

 const holdDuration=Math.max(0,performance.now()-mouseTime);
 const impulse=15+30*(1-Math.exp(-holdDuration*0.001));

 sphere.velocity.copy(playerDirection).multiplyScalar(impulse);
 sphere.velocity.addScaledVector(playerVelocity,2);

 sphereIdx=(sphereIdx+1)%spheres.length;
}

// --------------------------------------------------
// LOAD COLLISION WORLD
// --------------------------------------------------
const worldLoader=new GLTFLoader();
const MODEL_URL='https://cdn.jsdelivr.net/gh/mrdoob/three.js@r180/examples/models/gltf/collision-world.glb';

worldLoader.load(
 MODEL_URL,
 gltf=>{
  scene.add(gltf.scene);
  worldOctree.fromGraphNode(gltf.scene);

  gltf.scene.traverse(child=>{
   if(child.isMesh){
    child.castShadow=true;
    child.receiveShadow=true;
    if(child.material.map){
     child.material.map.anisotropy=renderer.capabilities.getMaxAnisotropy();
    }
   }
  });

  const helper=new OctreeHelper(worldOctree);
  helper.visible=false;
  scene.add(helper);

  const gui=new GUI({width:200});
  const debugOptions={debug:false};
  gui.add(debugOptions,'debug').onChange(value=>helper.visible=value);

  status.textContent='World loaded. Press P to open the 3D portfolio screen.';
  console.log('Collision world loaded.');
 },
 xhr=>{
  if(xhr.total)status.textContent='Loading world: '+Math.round(xhr.loaded/xhr.total*100)+'%';
 },
 error=>{
  console.error('World loading failed:',error);
  status.textContent='World loading failed. Check browser console.';
 }
);

// --------------------------------------------------
// RESIZE AND FALL RECOVERY
// --------------------------------------------------
window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

function teleportPlayerIfOob(){
 if(playerCollider.end.y<=-25){
  playerCollider.start.set(0,0.35,0);
  playerCollider.end.set(0,1,0);
  playerVelocity.set(0,0,0);
 }
}

// --------------------------------------------------
// MAIN LOOP
// --------------------------------------------------
function animate(){
 timer.update();
 const frameDelta=Math.min(0.05,timer.getDelta());
 const deltaTime=frameDelta/STEPS_PER_FRAME;

 for(let i=0;i<STEPS_PER_FRAME;i++){
  if(!portfolioOpen){
   controls(deltaTime);
   updatePlayer(deltaTime);
   updateSpheres(deltaTime);
   teleportPlayerIfOob();
  }
 }

 if(soldierMixer)soldierMixer.update(frameDelta);

 updateSoldier();
 updatePortfolioPosition();
 updateThirdPersonCamera();

 renderer.render(scene,camera);
 stats.update();
}

renderer.setAnimationLoop(animate);
</script>
</body>
</html>
